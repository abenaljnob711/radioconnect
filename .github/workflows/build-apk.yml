
name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          if [ ! -d "latest" ]; then
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
            unzip -q cmdline-tools.zip
            mv cmdline-tools latest
            rm cmdline-tools.zip
          fi
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Install Capacitor
        run: |
          npm install -g @capacitor/cli
          npm install @capacitor/core @capacitor/android

      - name: Create www folder
        run: |
          mkdir -p www
          cp -r public/* www/
          rm -f www/package.json www/gitignore www/manifest.json

      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Change Android App Name
        run: |
          STRINGS="android/app/src/main/res/values/strings.xml"
          if [ ! -f "$STRINGS" ]; then
            echo "ERROR: strings.xml not found!"
            exit 1
          fi
          if grep -q 'name="app_name"' "$STRINGS"; then
            sed -i 's|<string name="app_name">.*</string>|<string name="app_name">جهاز لاسلكي نداء ودردشة حقيقي</string>|' "$STRINGS"
          else
            sed -i 's|</resources>|    <string name="app_name">جهاز لاسلكي نداء ودردشة حقيقي</string>\n</resources>|' "$STRINGS"
          fi
          cat "$STRINGS"

      - name: Replace App Icons
        run: |
          set -e

          ICON="$GITHUB_WORKSPACE/public/icon.png"
          RES="android/app/src/main/res"

          if [ ! -f "$ICON" ]; then
            echo "ERROR: New icon not found: $ICON"
            exit 1
          fi

          echo "===== New icon information ====="
          file "$ICON"
          ls -lh "$ICON"

          for dir in "$RES"/mipmap-*; do
            if [ -d "$dir" ]; then
              cp "$ICON" "$dir/ic_launcher.png"
              cp "$ICON" "$dir/ic_launcher_round.png"
              echo "Updated: $dir"
            fi
          done

          echo "===== Icon replacement completed ====="

      - name: Add Permissions to AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.READ_CONTACTS"/>\n    <uses-permission android:name="android.permission.WRITE_CONTACTS"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n    <application|' "$MANIFEST"
            echo "===== AndroidManifest.xml updated ====="
          else
            echo "ERROR: AndroidManifest.xml not found!"
            exit 1
          fi

      - name: Fix Kotlin Dependencies
        run: |
          cat >> android/app/build.gradle <<'EOF'

          // Fix Kotlin duplicate class errors
          configurations.all {
              resolutionStrategy.eachDependency { details ->
                  if (details.requested.group == 'org.jetbrains.kotlin' &&
                      details.requested.name.startsWith('kotlin-stdlib')) {
                      details.useVersion '1.8.22'
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: radio-connect-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
