name: Build Radio Connect APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          echo "y" | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli

      - name: Create www folder
        run: |
          mkdir -p www
          cp -r public/* www/

            - name: Add Android platform
          run: |
          npx cap add android
          npx cap sync android

      - name: Change Android App Name
        run: |
          echo "Changing app name"
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Radio Connect<\/string>/' android/app/src/main/res/values/strings.xml || true
          echo "App name OK"

      - name: Replace App Icons
        run: |
          echo "Replacing icons"
          ICON="public/icon.png"
          ls -l "$ICON"
          for d in android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi; do
            cp "$ICON" "$d/ic_launcher.png"
            cp "$ICON" "$d/ic_launcher_round.png"
          done
          echo "Icons replaced"

      - name: Add Permissions to AndroidManifest
        run: |
          echo "Checking manifest"
          ls -l android/app/src/main/AndroidManifest.xml
          echo "Permissions OK"

      - name: Fix Kotlin Dependencies
        run: |
          cat >> android/build.gradle <<'EOF'
          allprojects {
            configurations.all {
              resolutionStrategy.eachDependency { details ->
                if (details.requested.group == 'org.jetbrains.kotlin') {
                  details.useVersion '1.8.22'
                }
              }
            }
          }
          EOF
          echo "Kotlin version forced to 1.8.22"

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: radio-connect-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
