name: Build Radio Connect APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Prepare Web Assets
        run: |
          ls -la
          echo "--- public? ---"
          ls -la public || echo "no public"
          mkdir -p www
          if [ -d "public" ]; then cp -r public/* www/ || true; fi
          if [ -f "index.html" ]; then cp index.html www/ || true; fi
          ls -la www
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.radioconnect.app",
            "appName": "Radio Connect",
            "webDir": "www",
            "server": { "cleartext": true }
          }
          EOF
          rm -f capacitor.config.ts
          cat capacitor.config.json

      - name: Sync Capacitor
        run: |
          if [ ! -d "android" ]; then npx cap add android; fi
          npx cap sync android

      - name: Fix Permissions and Icons
        run: |
          python3 << 'PYEOF'
          import os
          import shutil

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          print("Manifest:", manifest_path, os.path.exists(manifest_path))

          if os.path.exists(manifest_path):
              with open(manifest_path, encoding="utf-8") as f:
                  text = f.read()
              needed = [
                  "android.permission.RECORD_AUDIO",
                  "android.permission.MODIFY_AUDIO_SETTINGS",
                  "android.permission.INTERNET",
                  "android.permission.ACCESS_NETWORK_STATE",
                  "android.permission.ACCESS_WIFI_STATE",
                  "android.permission.CAMERA",
                  "android.permission.SEND_SMS",
                  "android.permission.RECEIVE_SMS",
                  "android.permission.READ_SMS",
                  "android.permission.RECEIVE_MMS",
                  "android.permission.READ_CONTACTS",
                  "android.permission.WRITE_CONTACTS",
                  "android.permission.READ_EXTERNAL_STORAGE",
                  "android.permission.WRITE_EXTERNAL_STORAGE",
                  "android.permission.READ_MEDIA_IMAGES",
                  "android.permission.READ_MEDIA_VIDEO",
                  "android.permission.READ_MEDIA_AUDIO",
                  "android.permission.ACCESS_FINE_LOCATION",
                  "android.permission.ACCESS_COARSE_LOCATION",
                  "android.permission.BLUETOOTH",
                  "android.permission.BLUETOOTH_CONNECT",
                  "android.permission.BLUETOOTH_SCAN",
                  "android.permission.FOREGROUND_SERVICE",
                  "android.permission.POST_NOTIFICATIONS",
                  "android.permission.WAKE_LOCK",
                  "android.permission.VIBRATE",
                  "android.permission.RECEIVE_BOOT_COMPLETED",
              ]
              to_add = []
              for perm in needed:
                  if perm not in text:
                      to_add.append('    <uses-permission android:name="' + perm + '" />')
                      print("Added:", perm)
              if to_add:
                  lines = text.splitlines()
                  out = []
                  inserted = False
                  for line in lines:
                      out.append(line)
                      if not inserted and "<manifest" in line and ">" in line:
                          out.extend(to_add)
                          inserted = True
                  if not inserted:
                      out = to_add + out
                  text = "\n".join(out) + "\n"
                  with open(manifest_path, "w", encoding="utf-8") as f:
                      f.write(text)
                  print("Manifest fixed OK - text method")
              else:
                  print("All permissions already exist")

          icon_src = "public/icon.png"
          if not os.path.exists(icon_src):
              icon_src = "icon.png"
          print("Icon src:", icon_src, os.path.exists(icon_src))
          if os.path.exists(icon_src):
              res_dir = "android/app/src/main/res"
              anydpi = os.path.join(res_dir, "mipmap-anydpi-v26")
              if os.path.exists(anydpi):
                  shutil.rmtree(anydpi)
                  print("Deleted mipmap-anydpi-v26")
              for d in ["mipmap-mdpi", "mipmap-hdpi", "mipmap-xhdpi", "mipmap-xxhdpi", "mipmap-xxxhdpi"]:
                  folder = os.path.join(res_dir, d)
                  os.makedirs(folder, exist_ok=True)
                  shutil.copy(icon_src, os.path.join(folder, "ic_launcher.png"))
                  shutil.copy(icon_src, os.path.join(folder, "ic_launcher_round.png"))
                  shutil.copy(icon_src, os.path.join(folder, "ic_launcher_foreground.png"))
                  print("Icon copied to", d)
          PYEOF

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: radio-connect-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
