name: Build Radio Connect APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create www folder
        run: |
          mkdir -p www
          cp -r public/* www/
          rm -f www/package.json
          rm -f www/gitignore
          rm -f www/manifest.json

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Change Android App Name
        run: |
          STRINGS="android/app/src/main/res/values/strings.xml"

          if [ -f "$STRINGS" ]; then
            sed -i 's|<string name="app_name">.*</string>|<string name="app_name">جهاز لاسلكي نداء ودردشة حقيقي</string>|' "$STRINGS"
          fi

      - name: Replace App Icons
        run: |
          set -e

          ICON="$GITHUB_WORKSPACE/public/icon.png"
          RES="android/app/src/main/res"

          if [ ! -f "$ICON" ]; then
            echo "ERROR: New icon not found: $ICON"
            exit 1
          fi

          echo "===== New icon information ====="
          file "$ICON"
          ls -lh "$ICON"

          echo "===== Remove old adaptive icons ====="
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

          echo "===== Replace launcher icons ====="
          for dir in "$RES"/mipmap-*; do
            if [ -d "$dir" ]; then
              cp "$ICON" "$dir/ic_launcher.png"
              cp "$ICON" "$dir/ic_launcher_round.png"
              echo "Updated: $dir"
            fi
          done

          echo "===== Verify icons ====="
          find "$RES" -name "ic_launcher.png" -o -name "ic_launcher_round.png"
          echo "===== Icon replacement completed ====="

      - name: Add Permissions to AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if ! grep -q "RECORD_AUDIO" "$MANIFEST"; then
            sed -i '/<application/i\
            <uses-permission android:name="android.permission.INTERNET" />\
            <uses-permission android:name="android.permission.RECORD_AUDIO" />\
            <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\
            <uses-permission android:name="android.permission.CAMERA" />\
            <uses-permission android:name="android.permission.WAKE_LOCK" />' "$MANIFEST"
          fi

      - name: Fix Kotlin Dependencies
        run: |
          find android -name "*.gradle" -o -name "*.gradle.kts" | while read file; do
            sed -i 's/kotlin-stdlib-jdk7/kotlin-stdlib/g' "$file"
            sed -i 's/kotlin-stdlib-jdk8/kotlin-stdlib/g' "$file"
          done

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: radio-connect-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
