<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio Connect - جهاز لاسلكي</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0b1120;
      color: #ffffff;
      font-family: Tahoma, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      justify-content: space-between;
      align-items: center;
    }
    .app-container {
      width: 100%;
      max-width: 480px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #111827;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
      position: relative;
      overflow: hidden;
    }
    header {
      padding: 15px;
      background: #1f2937;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      border-bottom: 1px solid #374151;
    }
    .screen-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
    }
    /* إشارة المايك المخفية افتراضياً والتي تظهر عند الضغط */
    #micIndicator {
      display: none;
      font-size: 24px;
      color: #ef4444;
      margin-bottom: 15px;
      animation: pulse 1s infinite;
    }
    #micIndicator.active {
      display: block;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.2); opacity: 0.7; }
      100% { transform: scale(1); opacity: 1; }
    }
    .ptt-container {
      padding: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #1f2937;
      border-top: 1px solid #374151;
    }
    #pttBtn {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: white;
      border: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);
      transition: all 0.1s ease;
      outline: none;
      user-select: none;
    }
    #pttBtn:active, #pttBtn.pressed {
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      box-shadow: 0 2px 8px rgba(239, 68, 68, 0.6);
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>Radio Connect - جهاز لاسلكي</header>

    <div class="screen-body">
      <!-- هنا تظهر إشارة المايك فقط عند الضغط -->
      <div id="micIndicator">🎙️ جاري التحدث...</div>
      <div id="statusText" style="color: #9ca3af; font-size: 14px;">متصل بالغرفة وجاهز</div>
    </div>

    <div class="ptt-container">
      <!-- زر التحدث PTT -->
      <button id="pttBtn">اضغط للتحدث</button>
    </div>
  </div>

  <script>
    const API = location.origin;
    const pttBtn = document.getElementById("pttBtn");
    const micIndicator = document.getElementById("micIndicator");
    const statusText = document.getElementById("statusText");

    // وظيفة إظهار المايك عند الضغط (للماوس واللمس)
    function startSpeaking(e) {
      if(e) e.preventDefault();
      pttBtn.classList.add("pressed");
      micIndicator.classList.add("active");
      statusText.innerText = "المرسل: يتحدث الآن...";
      // هنا يتم تفعيل بث الصوت الفعلي عبر LiveKit لديك
    }

    // وظيفة إخفاء المايك عند رفع الإصبع أو ترك الزر
    function stopSpeaking(e) {
      if(e) e.preventDefault();
      pttBtn.classList.remove("pressed");
      micIndicator.classList.remove("active");
      statusText.innerText = "متصل بالغرفة وجاهز";
      // هنا يتم إيقاف بث الصوت عبر LiveKit لديك
    }

    // ربط الأحداث للكمبيوتر والهواتف الذكية
    pttBtn.addEventListener("mousedown", startSpeaking);
    pttBtn.addEventListener("mouseup", stopSpeaking);
    pttBtn.addEventListener("mouseleave", stopSpeaking);

    pttBtn.addEventListener("touchstart", startSpeaking);
    pttBtn.addEventListener("touchend", stopSpeaking);
  </script>

</body>
</html>
