<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Radio Connect</title>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.15.3/dist/livekit-client.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;background:#020611;color:#fff;font-family:Arial}body{position:fixed;width:100%;height:100vh;overflow:hidden}
.app{max-width:430px;height:100vh;margin:auto;background:#020611;display:flex;flex-direction:column}
.top{height:46px;display:flex;justify-content:space-between;align-items:center;padding:0 12px}
.top.pill{background:#0a1f2a;border:1px solid #1a4a3a;color:#2ee5a0;font-size:10px;padding:6px 12px;border-radius:20px}
.wave{margin:4px 10px;height:52px;background:#0a1420;border-radius:12px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;border:1px solid rgba(255,255,255,.05)}
.wave b{font-size:16px}.wave small{font-size:10px;color:#6a829a;display:block}
.circle{width:34px;height:34px;border-radius:50%;background:#0e1e32;border:1px solid #1e4a6a;color:#5eb0ff;display:flex;align-items:center;justify-content:center}
.modes{margin:6px 10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modes button{height:42px;border-radius:10px;background:#0a1420;border:1px solid rgba(255,255,255,.06);color:#6a829a;font-size:11px}
.modes button.active{background:#123052;border-color:#2a6a9a;color:#5eb0ff}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
/* DEVICE - هذا هو الجديد الفخم الكبير */
.dev{width:220px;height:395px;background:linear-gradient(180deg,#1d2835 0%,#111821 50%,#090d13 100%);border-radius:28px;border:2px solid #2e3d50;box-shadow:0 0 0 1px rgba(255,255,255,.06) inset,0 24px 60px rgba(0,0,0,.9);position:relative;display:flex;flex-direction:column;align-items:center;padding:20px 16px 16px;transition:.2s}
.dev:before{content:'';position:absolute;top:-54px;left:50%;transform:translateX(-50%);width:18px;height:58px;background:linear-gradient(#2a2a2a,#111);border-radius:10px 10px 0 0}
.screen{width:100%;height:84px;background:radial-gradient(ellipse at center,#0a2a32,#061a22 70%,#030f15);border:1px solid #143a4a;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 18px rgba(0,229,255,.2)}
.screen b{color:#d0f0ff;font-size:16px;letter-spacing:.5px}.screen span{color:#7ac8d8;font-size:12px}.screen small{color:#3a4a5a;font-size:11px;margin-top:4px}
.knobs{display:flex;gap:20px;margin:16px 0 20px}.knobs i{width:20px;height:20px;background:radial-gradient(circle at 35% 35%,#4a5a6a,#121821);border-radius:50%;border:1px solid #222;display:block}
.ptt{width:120px;height:98px;background:linear-gradient(180deg,#1e2c3a,#121a24);border:1.5px solid #2e4054;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.1s}
.ptt b{color:#00b7ff;font-size:22px;letter-spacing:2px}.ptt small{color:#5a6a7a;font-size:8px}.ptt:active{transform:scale(.95)}
.dev.tx{border-color:#3fa9ff;box-shadow:0 0 0 3px rgba(63,169,255,.15),0 0 45px rgba(63,169,255,.6),0 24px 60px #000}.dev.tx.ptt{border-color:#3fa9ff;background:#14365a;box-shadow:0 0 20px #3fa9ff}
.dev.rx{border-color:#ff3b30;box-shadow:0 0 0 3px rgba(255,59,48,.15),0 0 45px rgba(255,59,48,.6),0 24px 60px #000}.dev.rx.ptt{border-color:#ff3b30;background:#3a1a1a;box-shadow:0 0 20px #ff3b30;animation:bl.6s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.6}}
.side{position:absolute;right:-12px;top:124px;width:20px;height:80px;background:linear-gradient(90deg,#e52a1a,#7a0f0a);border-radius:0 9px 9px 0;display:flex;align-items:center;justify-content:center;box-shadow:2px 0 14px rgba(229,42,26,.5)}
.side span{writing-mode:vertical-rl;color:#fff;font-size:10px;font-weight:900}
.side.tx{background:linear-gradient(90deg,#3fa9ff,#0a4a8a);box-shadow:2px 0 14px #3fa9ff}.side.rx{background:linear-gradient(90deg,#ff3b30,#7a0f0a)}
.wavebar{display:flex;gap:4px;height:18px;margin-top:20px}.wavebar i{width:4px;background:#3fa9ff;border-radius:2px}.wavebar.active i{animation:br.5s infinite ease-in-out}
@keyframes br{0%,100%{height:4px}50%{height:18px}}
.hint{font-size:11px;color:#4a5a6e;margin-top:10px}
.chat{flex:1;display:none;flex-direction:column;background:#020611}.chat.show{display:flex}
.chat.msgs{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.bubble{padding:10px;border-radius:12px;font-size:12px;max-width:85%}
.bubble.me{background:#0e2f4a;border:1px solid #1e5a8a;align-self:flex-start}
.bubble.other{background:#2a1414;border:1px solid #5a1a1a;align-self:flex-end;color:#fff}
</style>
</head>
<body>
<div class="app">
<div class="top"><div class="pill">● متصل AES-256</div><div style="font-weight:800">Radio Connect <span style="color:#5a7a9a;font-size:11px;font-weight:400">S458 • Q307 • CH07</span></div></div>
<div class="wave"><div class="circle" onclick="chg(-1)">‹</div><div style="text-align:center"><b id="wc">S458</b><small>موجة القيادة</small></div><div class="circle" onclick="chg(1)">›</div></div>
<div class="modes"><button id="bChat" onclick="setM('chat')">🏠 محادثة الغرفة</button><button id="bWave" class="active" onclick="setM('wave')">📻 الموجة المباشرة</button></div>

<div class="stage" id="vWave">
<div class="dev" id="dev">
<div class="screen"><b id="dc">S458</b><span>CH 07 • 446.100 MHz</span><small id="ds">● جاهز</small></div>
<div class="knobs"><i></i><i></i></div>
<div class="ptt" id="ptt"><b>PTT</b><small>PRESS TO TALK</small></div>
<div class="side" id="side"><span>PTT</span></div>
</div>
<div class="wavebar" id="wb"><i style="height:5px"></i><i style="height:10px"></i><i style="height:14px"></i><i style="height:10px"></i><i style="height:5px"></i></div>
<div class="hint" id="hint">اضغط مطولاً على PTT - أزرق TX / أحمر RX</div>
</div>

<div class="chat" id="vChat"><div class="msgs" id="msgs"><div class="bubble other">مستلم S458 - تم التنفيذ<div style="font-size:9px;margin-top:4px;color:#ff6b60">RX Q307</div></div></div></div>
</div>
<script>
let codes=[];for(let i=0;i<20;i++){let L=String.fromCharCode(65+Math.random()*26|0);codes.push(L+(100+Math.random()*900|0))}
let idx=0;function chg(d){idx=(idx+d+codes.length)%codes.length;document.getElementById('wc').textContent=codes[idx];document.getElementById('dc').textContent=codes[idx]}
function setM(m){document.getElementById('bWave').classList.toggle('active',m==='wave');document.getElementById('bChat').classList.toggle('active',m==='chat');document.getElementById('vWave').style.display=m==='wave'?'flex':'none';document.getElementById('vChat').classList.toggle('show',m==='chat')}
let isDown=false;const dev=document.getElementById('dev'),ptt=document.getElementById('ptt'),side=document.getElementById('side'),wb=document.getElementById('wb'),ds=document.getElementById('ds'),hint=document.getElementById('hint');
function tx(on){if(on){dev.className='dev tx';ptt.className='ptt tx';side.className='side tx';wb.className='wavebar active';ds.textContent='🔵 TX ترسل الآن';ds.style.color='#3fa9ff';hint.textContent='🔵 جاري الإرسال...';if(navigator.vibrate) navigator.vibrate(30)}else{dev.className='dev';ptt.className='ptt';side.className='side';wb.className='wavebar';ds.textContent='● جاهز';ds.style.color='';hint.textContent='اضغط مطولاً على PTT - أزرق TX / أحمر RX'}}
function rx(){dev.className='dev rx';ptt.className='ptt rx';side.className='side rx';wb.className='wavebar active';ds.textContent='🔴 RX من Q307';ds.style.color='#ff3b30';if(navigator.vibrate) navigator.vibrate([80,40,80]);setTimeout(()=>{dev.className='dev';ptt.className='ptt';side.className='side';wb.className='wavebar';ds.textContent='● جاهز';ds.style.color=''},2200)}
ptt.addEventListener('pointerdown',e=>{e.preventDefault();isDown=true;tx(true)});ptt.addEventListener('pointerup',e=>{e.preventDefault();isDown=false;tx(false)});ptt.addEventListener('touchstart',e=>{e.preventDefault();isDown=true;tx(true)},{passive:false});ptt.addEventListener('touchend',e=>{e.preventDefault();isDown=false;tx(false)},{passive:false});
side.addEventListener('pointerdown',e=>{e.preventDefault();tx(true)});side.addEventListener('pointerup',e=>{e.preventDefault();tx(false)});
// محاكاة استقبال Q307
setInterval(()=>{if(!isDown && Math.random()>0.7) rx()},6000);
</script>
</div></body></html>
