<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Radio Connect</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#020a12;color:#fff;font-family:Arial,sans-serif;position:fixed;width:100%;height:100vh;overflow:hidden}
.app{max-width:520px;height:100vh;margin:auto;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 0%,#0f2035,#02050a)}
.topbar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid rgba(0,229,255,.12);background:rgba(5,20,35,.8)}
.topbar .left{display:flex;align-items:center;gap:8px}
.topbar .logo{font-size:22px}
.topbar strong{font-size:16px;color:#00e5ff}
.topbar span{font-size:9px;color:#6aa8c0;display:block}
.pills{display:flex;gap:6px;padding:8px}
.pill{flex:1;padding:10px;border-radius:12px;background:#0b1c2d;border:1px solid rgba(255,255,255,.07);text-align:center;font-size:11px;font-weight:800}
.pill small{display:block;font-size:9px;color:#6a829a;margin-top:2px}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.device{width:210px;height:340px;background:linear-gradient(180deg,#1e2a38,#0e151e);border-radius:22px;border:2px solid #2a3a4a;display:flex;flex-direction:column;align-items:center;padding:16px;position:relative;box-shadow:0 20px 50px #000,inset 0 1px rgba(255,255,255,.1);transition:.2s;z-index:10}
.device.tx{border-color:#00e5ff;box-shadow:0 0 0 5px rgba(0,229,255,.25),0 0 40px #00e5ff,0 20px 50px #000}
.device.rx{border-color:#ff3b30;box-shadow:0 0 0 5px rgba(255,59,48,.25),0 0 40px #ff3b30}
.antenna{width:16px;height:80px;background:linear-gradient(#333,#111);border-radius:10px 10px 0 0;margin-bottom:8px;position:relative}
.antenna::before{content:'';position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:10px;height:10px;background:#333;border-radius:50%}
.screen{width:100%;height:80px;background:radial-gradient(#001a22,#000b0f);border:1px solid #0f3a4a;border-radius:10px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;margin-bottom:18px}
.screen .rx{color:#ff3b30;font-size:10px;font-weight:900}
.screen .wave{color:#00ff88;font-size:10px;font-weight:900}
.ptt-btn{width:120px;height:120px;border-radius:20px;background:linear-gradient(145deg,#1a2a3a,#0a131c);border:3px solid #2a4a5a;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.12s;pointer-events:auto;touch-action:none;z-index:50;user-select:none}
.ptt-btn:active{transform:scale(.92)}
.ptt-btn.tx{border-color:#00e5ff;box-shadow:0 0 25px #00e5ff;background:linear-gradient(145deg,#0b3a5e,#08253d)}
.ptt-btn.rx{border-color:#ff3b30;box-shadow:0 0 25px #ff3b30}
.ptt-btn b{font-size:26px;color:#00e5ff;letter-spacing:3px}
.ptt-btn.rx b{color:#ff6b60}
.ptt-btn small{font-size:8px;color:#7a8a9a;margin-top:4px;letter-spacing:1px}
.side-ptt{position:absolute;right:-16px;top:120px;width:16px;height:90px;background:linear-gradient(90deg,#ff2a1a,#7a0f0a);border-radius:0 8px 8px 0;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:20}
.side-ptt span{writing-mode:vertical-rl;font-size:9px;font-weight:900;color:#fff}
.bottom-nav{height:62px;display:flex;justify-content:space-around;align-items:center;background:rgba(3,12,20,.95);border-top:1px solid rgba(255,255,255,.06);z-index:30}
.bottom-nav div{font-size:9px;color:#5a768e;text-align:center;cursor:pointer;pointer-events:auto}
.bottom-nav div.active{color:#00e5ff}
.menu-btn{width:40px;height:40px;border-radius:12px;background:#0b1c2d;border:1px solid rgba(255,255,255,.08);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto;z-index:100}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#0b2033;border:1px solid #00e5ff;color:#fff;padding:10px 16px;border-radius:14px;font-size:11px;opacity:0;transition:.3s;z-index:9999;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="left"><div class="logo">📻</div><div><strong>Radio Connect</strong><span>راديو كونكت</span></div></div>
    <div style="display:flex;align-items:center;gap:8px"><span style="font-size:11px;color:#8ab4dc">لا موجة 🎙️</span><div class="menu-btn" id="menuToggle">☰</div></div>
  </div>
  <div class="pills"><div class="pill">----<small>اضغط للنسخ</small></div><div class="pill"><span id="userCount">0 👥</span><small>المشاركون</small></div><div class="pill" style="color:#46d879">● متصل<small></small></div></div>
  <div class="stage">
    <div class="device" id="device">
      <div class="antenna"></div>
      <div class="screen"><div class="rx">RX</div><div class="wave">WAVE --Q</div></div>
      <div class="ptt-btn" id="pttMain"><b>PTT</b><small>PRESS TO TALK</small></div>
      <div class="side-ptt" id="sidePtt"><span>PTT</span></div>
    </div>
  </div>
  <div class="bottom-nav">
    <div>⚙️<br>الإعدادات</div><div>📡<br>النداء اللاسلكي</div><div class="active">💬<br>المحادثات</div>
  </div>
</div>
<div class="toast" id="toast"></div>

<audio id="walkieBeep" src="./walkie_beep.mp3" preload="auto"></audio>
<audio id="walkieBeepBackup" src="./public/walkie_beep.mp3" preload="auto"></audio>

<script>
const $=id=>document.getElementById(id);
function toast(m,type='info'){let t=$('toast');t.textContent=m;t.style.borderColor=type=='error'?'#ff3b30':type=='success'?'#00ff88':'#00e5ff';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000); console.log(m);}

const PTTEngine = {
  beepEl: null,
  async init(){
    this.beepEl = $('walkieBeep') || $('walkieBeepBackup');
    if(!this.beepEl) return false;
    this.beepEl.volume = 0.9;
    return true;
  },
  playRealBeep(){
    let el = $('walkieBeep');
    if(!el || el.error){ el = $('walkieBeepBackup'); }
    if(!el){ toast('❌ walkie_beep.mp3 غير موجود','error'); return false; }
    el.currentTime = 0;
    el.volume = 0.9;
    el.play().then(()=>{ toast('🔔 walkie_beep.mp3 يعمل!','success'); if(navigator.vibrate) navigator.vibrate([30,40,30]); }).catch(e=>{ toast('اضغط مرة ثانية لتفعيل الصوت','error'); console.error(e); });
    return true;
  }
};

let isTx=false;
function setTx(on){
  let dev=$('device'),btn=$('pttMain');
  if(on){ dev.className='device tx'; btn.className='ptt-btn tx'; } else { dev.className='device'; btn.className='ptt-btn'; PTTEngine.playRealBeep(); }
}

function bindPTT(){
  const ptt=$('pttMain'), side=$('sidePtt');
  [ptt,side].forEach(el=>{
    if(!el) return;
    el.addEventListener('pointerdown',e=>{ e.preventDefault(); if(isTx) return; isTx=true; setTx(true); });
    el.addEventListener('pointerup',e=>{ e.preventDefault(); if(!isTx) return; isTx=false; setTx(false); });
    el.addEventListener('pointercancel',e=>{ e.preventDefault(); isTx=false; setTx(false); });
    el.addEventListener('touchstart',e=>{ e.preventDefault(); if(isTx) return; isTx=true; setTx(true); },{passive:false});
    el.addEventListener('touchend',e=>{ e.preventDefault(); if(!isTx) return; isTx=false; setTx(false); },{passive:false});
  });
  toast('✅ جاهز - اضغط PTT','success');
}

document.addEventListener('DOMContentLoaded', async ()=>{
  await PTTEngine.init();
  bindPTT();
  // فك حجب اللمس
  document.querySelectorAll('.bottom-nav div, .menu-btn').forEach(b=>{ b.style.pointerEvents='auto'; });
});

// للتجربة من الكونسول
window.testBeep = ()=> PTTEngine.playRealBeep();
</script>
</body>
</html>
