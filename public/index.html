<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Radio Connect</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#020611}
body{font-family:Arial,"Noto Sans Arabic",sans-serif;color:#fff;position:fixed;width:100%;height:100vh}
.app{max-width:440px;height:100vh;margin:0 auto;background:#020611;display:flex;flex-direction:column}

/* HEADER - مثل الصورة بالضبط */
.top{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;background:#020611;flex-shrink:0}
.pill-green{background:#0a1f2a;border:1px solid #124a3a;color:#2ee5a0;font-size:10px;padding:5px 10px;border-radius:20px}
.top-title{font-size:14px;font-weight:800;display:flex;gap:4px;align-items:center}
.top-title span{color:#5a7a9a;font-size:11px;font-weight:400}

/* WAVE SELECTOR - مثل الصورة */
.wave-sel{margin:6px 10px;background:#08101c;border:1px solid rgba(255,255,255,.06);border-radius:12px;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 10px}
.circle{width:36px;height:36px;border-radius:50%;background:#0e1e32;border:1px solid rgba(58,157,230,.25);color:#5eb0ff;display:flex;align-items:center;justify-content:center;font-size:18px}
.wave-sel.mid{text-align:center}
.wave-sel.mid b{font-size:16px;letter-spacing:1px;display:block}
.wave-sel.mid small{font-size:10px;color:#6a829a}

/* MODE BUTTONS - مثل الصورة */
.modes{margin:6px 10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modes button{height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.06);background:#0a1420;color:#6a829a;font-size:11px;font-weight:700}
.modes button.active{background:#102a45;border-color:#1e5a8a;color:#5eb0ff;box-shadow:0 0 12px rgba(62,157,230,.2)}

/* RADIO DEVICE - هذا هو الفرق الكبير - مطابق للصورة الأصلية */
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 0}
.device-real{
  width:212px;height:380px;
  background:linear-gradient(180deg,#1a232e 0%,#121821 45%,#0a0e14 100%);
  border-radius:26px;
  border:1.5px solid #253140;
  box-shadow:
    0 0 0 1px rgba(255,255,255,.04) inset,
    0 1px 0 rgba(255,255,255,.08) inset,
    0 20px 50px rgba(0,0,0,.85),
    0 0 0 8px rgba(255,255,255,.02);
  position:relative;
  display:flex;flex-direction:column;align-items:center;
  padding:18px 14px 14px;
}
.device-real::before{ /* antenna */
  content:'';position:absolute;top:-52px;left:50%;transform:translateX(-50%);
  width:16px;height:56px;background:linear-gradient(180deg,#2a2a2a,#111);
  border-radius:10px 10px 0 0;box-shadow:0 -2px 8px rgba(0,0,0,.6);
}
.device-real::after{
  content:'';position:absolute;top:-12px;left:50%;transform:translateX(-50%);
  width:10px;height:20px;background:#000;border-radius:4px;z-index:2;
}
.d-screen{
  width:100%;height:78px;
  background:radial-gradient(ellipse at center,#0a2a32 0%,#061a22 60%,#030f15 100%);
  border:1px solid #123a4a;border-radius:10px;
  box-shadow:inset 0 0 18px rgba(0,229,255,.22), inset 0 1px 0 rgba(0,229,255,.15);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  margin-top:4px;
}
.d-screen.code{color:#d0f0ff;font-size:15px;font-weight:900;letter-spacing:.5px;text-shadow:0 0 8px rgba(0,229,255,.6)}
.d-screen.freq{color:#a0d8e8;font-size:12px;font-weight:700;margin-top:2px;letter-spacing:.3px}
.d-screen.freq span{font-size:10px}
.d-screen.ready{color:#3a4a5a;font-size:11px;margin-top:4px;display:flex;align-items:center;gap:4px}
.d-screen.ready i{width:6px;height:6px;background:#3a4a5a;border-radius:50%;display:inline-block}

.dots{display:flex;gap:16px;margin:14px 0 18px}
.dots span{width:18px;height:18px;background:radial-gradient(circle at 35% 35%,#3a4552,#121821);border-radius:50%;border:1px solid #1e2a36;box-shadow:inset 0 1px 1px rgba(255,255,255,.1)}

.ptt-real{
  width:112px;height:92px;
  background:linear-gradient(180deg,#1e2a36 0%,#121a24 100%);
  border:1px solid #2a3a4a;border-radius:14px;
  box-shadow:0 0 0 1px rgba(255,255,255,.04) inset, 0 6px 16px rgba(0,0,0,.6);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;user-select:none;touch-action:none;transition:.1s;
}
.ptt-real b{color:#00b7ff;font-size:20px;font-weight:900;letter-spacing:2px;text-shadow:0 0 10px rgba(0,183,255,.6)}
.ptt-real small{color:#5a6a7a;font-size:8px;margin-top:2px;letter-spacing:.5px}
.ptt-real:active{transform:scale(.96)}
.ptt-real.tx{border-color:#3fa9ff;box-shadow:0 0 22px rgba(63,169,255,.7),0 6px 16px #000;background:linear-gradient(180deg,#14365a,#0e2a4a)}
.ptt-real.rx{border-color:#ff3b30;box-shadow:0 0 22px rgba(255,59,48,.7),0 6px 16px #000;background:linear-gradient(180deg,#3a1a1a,#1e0e0e)}

.side-real{
  position:absolute;right:-10px;top:118px;
  width:18px;height:76px;
  background:linear-gradient(90deg,#e52a1a,#8a0f0a);
  border-radius:0 8px 8px 0;
  box-shadow:2px 0 14px rgba(229,42,26,.5), inset -1px 0 1px rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;
}
.side-real span{writing-mode:vertical-rl;color:#fff;font-size:9px;font-weight:900;letter-spacing:1px;text-shadow:0 1px 2px #000}
.side-real.tx{background:linear-gradient(90deg,#3fa9ff,#0a4a8a);box-shadow:2px 0 14px #3fa9ff}
.side-real.rx{background:linear-gradient(90deg,#ff3b30,#8a0f0a);box-shadow:2px 0 14px #ff3b30;animation:rxB.6s infinite}
@keyframes rxB{0%,100%{opacity:1}50%{opacity:.65}}

.wave-mini{display:flex;gap:3px;height:16px;margin-top:18px;align-items:center}
.wave-mini i{width:4px;background:#3fa9ff;border-radius:2px;display:block}
.wave-mini.active i{animation:b.5s infinite ease-in-out}
@keyframes b{0%,100%{height:4px}50%{height:16px}}
.hint{font-size:11px;color:#4a5a6e;margin-top:8px}

/* CHAT - مطابق للصورة الثانية */
.chat{flex:1;display:none;flex-direction:column;background:#020611;overflow:hidden}
.chat.show{display:flex}
.chat-h{height:36px;display:flex;justify-content:space-between;align-items:center;padding:0 10px;font-size:12px;color:#8ab4dc;border-bottom:1px solid rgba(255,255,255,.05)}
.msg{background:#0a1a2d;border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:10px;margin:8px 10px;font-size:12px;line-height:1.5;color:#cfe4ff}
.msg.rx{background:#1a0e0e;border-color:rgba(255,59,48,.15);color:#fff}
.msg.meta{font-size:10px;color:#5eb0ff;margin-top:6px;display:flex;justify-content:space-between}
.msg.rx.meta{color:#ff6b60}
.input{height:56px;background:#080f1a;border-top:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:8px;padding:0 10px;flex-shrink:0}
.input input{flex:1;height:36px;background:#0a1420;border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:0 14px;color:#fff;outline:none;font-size:12px}
.mic{width:36px;height:36px;border-radius:50%;background:#1a2330;color:#8ab4dc;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="pill-green">● متصل AES-256</div>
    <div class="top-title">Radio Connect <span>S458 • Q307 • CH 07</span></div>
  </div>

  <div class="wave-sel">
    <div class="circle" onclick="chg(-1)">‹</div>
    <div class="mid"><b id="wc">S458</b><small>موجة القيادة</small></div>
    <div class="circle" onclick="chg(1)">›</div>
  </div>

  <div class="modes">
    <button id="bChat" onclick="setM('chat')">🏠 محادثة الغرفة</button>
    <button id="bWave" class="active" onclick="setM('wave')">📻 الموجة المباشرة</button>
  </div>

  <!-- RADIO VIEW - مطابق للصورة الأصلية -->
  <div class="stage" id="vWave">
    <div class="device-real" id="dev">
      <div class="d-screen">
        <div class="code" id="dCode">S458</div>
        <div class="freq">CH 07 • 446.100 <span>MHz</span></div>
        <div class="ready"><i></i> جاهز</div>
      </div>
      <div class="dots"><span></span><span></span></div>
      <div class="ptt-real" id="ptt"><b>PTT</b><small>PRESS TO TALK</small></div>
      <div class="side-real" id="side"><span>PTT</span></div>
    </div>
    <div class="wave-mini" id="wm"><i style="height:5px"></i><i style="height:8px"></i><i style="height:12px"></i><i style="height:8px"></i><i style="height:5px"></i></div>
    <div class="hint">اضغط مطولاً على PTT</div>
  </div>

  <!-- CHAT VIEW - مطابق للصورة الثانية -->
  <div class="chat" id="vChat">
    <div class="chat-h"><span>💬 محادثة الغرفة Q307</span><span style="color:#2ee5a0;font-size:10px">● مشفر</span></div>
    <div style="flex:1;overflow-y:auto" id="msgs">
      <div class="msg rx">مستلم. سأتحرك لنقطة المراقبة الشمالية. لا يوجد نشاط.<div class="meta"><span>10:48 م • RX Q307</span></div></div>
    </div>
    <div class="input"><div class="mic">🎙️</div><input placeholder="اكتب رسالة..." id="inp" onkeydown="if(event.key==='Enter')send()"><div class="mic" onclick="send()">➤</div></div>
  </div>
</div>

<script>
let idx=0,codes=[];
for(let i=0;i<20;i++){let L=String.fromCharCode(65+Math.random()*26|0);codes.push(L+(100+Math.random()*900|0))}
let cur=codes[0];
function chg(d){idx=(idx+d+codes.length)%codes.length;cur=codes[idx];document.getElementById('wc').textContent=cur;document.getElementById('dCode').textContent=cur}
function setM(m){
 document.getElementById('bWave').classList.toggle('active',m==='wave');
 document.getElementById('bChat').classList.toggle('active',m==='chat');
 document.getElementById('vWave').style.display=m==='wave'?'flex':'none';
 document.getElementById('vChat').classList.toggle('show',m==='chat');
}
let down=false,dev=document.getElementById('dev'),ptt=document.getElementById('ptt'),side=document.getElementById('side'),wm=document.getElementById('wm');
function tx(on){
 if(on){dev.classList.add('tx');dev.classList.remove('rx');ptt.classList.add('tx');ptt.classList.remove('rx');side.classList.add('tx');side.classList.remove('rx');wm.classList.add('active');}
 else{dev.className='device-real';ptt.className='ptt-real';side.className='side-real';wm.classList.remove('active');}
}
function rx(){
 dev.classList.add('rx');ptt.classList.add('rx');side.classList.add('rx');side.classList.remove('tx');wm.classList.add('active');
 setTimeout(()=>{dev.className='device-real';ptt.className='ptt-real';side.className='side-real';wm.classList.remove('active')},2200);
 if(navigator.vibrate) navigator.vibrate([80,40,80]);
}
ptt.addEventListener('pointerdown',e=>{e.preventDefault();down=true;tx(true)});
ptt.addEventListener('pointerup',e=>{e.preventDefault();down=false;tx(false)});
ptt.addEventListener('touchstart',e=>{e.preventDefault();down=true;tx(true)},{passive:false});
ptt.addEventListener('touchend',e=>{e.preventDefault();down=false;tx(false)},{passive:false});
side.addEventListener('pointerdown',e=>{e.preventDefault();down=true;tx(true)});
side.addEventListener('pointerup',e=>{e.preventDefault();down=false;tx(false)});
function send(){let i=document.getElementById('inp');let t=i.value.trim();if(!t) return;let m=document.createElement('div');m.className='msg';m.innerHTML=t+'<div class=meta><span>الآن • TX S458</span></div>';document.getElementById('msgs').appendChild(m);i.value='';setTimeout(rx,800);setTimeout(()=>{let r=document.createElement('div');r.className='msg rx';r.innerHTML='تم الاستلام S458 - جاري التنفيذ<div class=meta><span>الآن • RX Q307</span></div>';document.getElementById('msgs').appendChild(r)},1500)}
</script>
</body>
</html>
