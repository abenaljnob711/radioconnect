<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#01040a">
<title>Radio Connect - Tactical Pro</title>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.15.3/dist/livekit-client.umd.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#01040a;color:#fff;font-family:Arial,"Noto Sans Arabic",sans-serif}
body{position:fixed;width:100%;height:100vh}
.app{max-width:520px;height:100vh;margin:auto;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 0%,#0f2035 0%,#02050a 65%);overflow:hidden}
/* HEADER */
.topbar{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:rgba(0,0,0,.4);border-bottom:1px solid rgba(0,229,255,.15);flex-shrink:0}
.topbar.left{display:flex;align-items:center;gap:8px}
.brand strong{font-size:14px;font-weight:900;letter-spacing:.5px}
.brand span{font-size:9px;color:#5eb0ff;display:block}
.status{font-size:10px;color:#00e5ff;background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.2);padding:4px 10px;border-radius:20px}
/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:8px}
.wave-bar{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(145deg,#0b1c2d,#06101a);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:8px 12px;margin-bottom:8px}
.wave-bar.code{font-family:monospace;font-size:22px;font-weight:900;letter-spacing:2px;text-shadow:0 0 10px #00e5ff}
.wave-bar.name{font-size:10px;color:#8ab4dc}
.arrow{width:32px;height:32px;border-radius:50%;background:#0c2942;border:1px solid rgba(62,157,230,.4);color:#fff;font-size:18px}
/* RADIO DEVICE - THE NEW PRO DESIGN */
.radio-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:10px 0}
.device{
  width:165px;height:310px;position:relative;
  background:linear-gradient(180deg,#222830 0%,#0f1318 100%);
  border-radius:24px;border:2px solid #2a3441;
  box-shadow:0 20px 50px rgba(0,0,0,.9),inset 0 1px 1px rgba(255,255,255,.15);
  display:flex;flex-direction:column;align-items:center;padding:14px 12px;
  transition:all.25s ease;
}
.device.tx{border-color:#3fa9ff;box-shadow:0 0 0 4px rgba(63,169,255,.2),0 0 35px rgba(63,169,255,.7),0 20px 50px rgba(0,0,0,.9)}
.device.rx{border-color:#ff3b30;box-shadow:0 0 0 4px rgba(255,59,48,.2),0 0 35px rgba(255,59,48,.7),0 20px 50px rgba(0,0,0,.9)}
.antenna{width:14px;height:52px;background:linear-gradient(180deg,#333,#111);border-radius:8px 8px 0 0;margin-bottom:6px;position:relative}
.antenna::after{content:'';position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:6px;height:18px;background:#111;border-radius:3px}
.screen{width:100%;height:72px;background:radial-gradient(ellipse at center,#001a22 0%,#000b0f 100%);border:1px solid #0f3a4a;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 15px rgba(0,229,255,.2);margin-bottom:14px}
.screen.ch{font-family:monospace;font-size:26px;font-weight:900;color:#00e5ff;letter-spacing:3px;text-shadow:0 0 12px #00e5ff}
.screen.fr{font-size:9px;color:#5ab0c0;margin-top:2px}
.screen.st{font-size:8px;font-weight:800;margin-top:3px}
.st.tx{color:#3fa9ff}.st.rx{color:#ff3b30}.st.idle{color:#4a5a6a}
.knobs{display:flex;gap:18px;margin-bottom:16px}
.knob{width:18px;height:18px;background:radial-gradient(circle at 30% 30%,#444,#111);border-radius:50%;border:1px solid #333}
.ptt-main{width:86px;height:86px;border-radius:18px;background:linear-gradient(145deg,#1e2a36,#0d131a);border:2px solid #2a3a4a;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;user-select:none;touch-action:none;transition:.12s;position:relative}
.ptt-main:active{transform:scale(.94)}
.ptt-main.tx{border-color:#3fa9ff;background:linear-gradient(145deg,#12365a,#0a2540);box-shadow:0 0 20px #3fa9ff}
.ptt-main.rx{border-color:#ff3b30;background:linear-gradient(145deg,#3a1212,#1a0808);box-shadow:0 0 20px #ff3b30;animation:rxPulse.6s infinite}
@keyframes rxPulse{0%,100%{opacity:1}50%{opacity:.7}}
.ptt-main b{font-size:20px;letter-spacing:2px;color:#5eb0ff}
.ptt-main.rx b{color:#ff6b60}
.ptt-main small{font-size:7px;color:#7a8a9a;margin-top:2px}
.side-ptt{position:absolute;right:-14px;top:110px;width:14px;height:82px;background:linear-gradient(90deg,#ff2a1a,#7a0f0a);border-radius:0 7px 7px 0;cursor:pointer;box-shadow:3px 0 12px rgba(255,0,0,.4);display:flex;align-items:center;justify-content:center}
.side-ptt span{writing-mode:vertical-rl;font-size:8px;font-weight:900;color:#fff}
.side-ptt.tx{background:linear-gradient(90deg,#3fa9ff,#0a4a8a);box-shadow:0 0 12px #3fa9ff}
.side-ptt.rx{background:linear-gradient(90deg,#ff3b30,#8a0f0a);animation:rxPulse.6s infinite}
.waveform{display:flex;align-items:center;gap:3px;height:20px;margin-top:14px}
.waveform i{display:block;width:4px;background:#3fa9ff;border-radius:2px;transition:.2s}
.waveform.rx i{background:#ff3b30}
.waveform.active i{animation:bar.5s infinite ease-in-out}
@keyframes bar{0%,100%{height:4px}50%{height:18px}}
.hint{font-size:10px;color:#6a829a;margin-top:10px;font-weight:700;text-align:center}

/* CHAT */
.chat{flex:1;display:none;flex-direction:column;background:linear-gradient(180deg,#071725,#030a11);border:1px solid rgba(255,255,255,.07);border-radius:14px;overflow:hidden}
.chat.show{display:flex}
.chat-head{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#081a29;border-bottom:1px solid rgba(0,229,255,.15);font-size:10px;font-weight:900}
.msgs{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.bubble{max-width:85%;padding:8px 10px;border-radius:14px;font-size:11px;line-height:1.5;position:relative}
.bubble.mine{align-self:flex-start;background:linear-gradient(145deg,#0d4a73,#083659);border:1px solid rgba(63,169,255,.35)}
.bubble.other{align-self:flex-end;background:linear-gradient(145deg,#2a1212,#1a0808);border:1px solid rgba(255,59,48,.25)}
.bubble.meta{font-size:7px;opacity:.7;margin-top:4px;display:flex;gap:6px}
.log{font-family:monospace;font-size:7px;color:#445c6e;background:#07131e;padding:3px 8px;border-radius:10px;align-self:center}
.input-row{height:54px;display:flex;align-items:center;gap:6px;padding:6px 8px;background:#040b12;border-top:1px solid rgba(255,255,255,.08)}
.input-row input{flex:1;height:36px;background:#07131e;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:0 12px;color:#fff;font-size:12px;outline:none}
.icon{width:36px;height:36px;border-radius:50%;background:#0b1d2d;border:1px solid rgba(255,255,255,.1);color:#8ab4dc;display:flex;align-items:center;justify-content:center}
.send{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#1594ff,#0757d8);color:#fff;display:none;align-items:center;justify-content:center}
.send.show{display:flex}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.mode button{padding:10px;border-radius:10px;background:#071521;border:1px solid rgba(255,255,255,.08);color:#8ab4dc;font-size:10px;font-weight:800}
.mode button.active{background:linear-gradient(145deg,#0b3a5e,#08253d);border-color:#3fa9ff;color:#fff;box-shadow:0 0 12px rgba(63,169,255,.3)}
.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:#0b2033;border:1px solid #3fa9ff;color:#fff;padding:8px 14px;border-radius:14px;font-size:10px;opacity:0;transition:.3s;pointer-events:none;z-index:999}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="left"><span style="font-size:18px">📡</span><div class="brand"><strong>Radio Connect</strong><span id="roomLabel">لا توجد غرفة • S458</span></div></div>
    <div class="status" id="status">● متصل</div>
  </div>

  <div class="main">
    <div class="wave-bar">
      <button class="arrow" onclick="changeWave(-1)">‹</button>
      <div style="text-align:center"><div class="code" id="waveCode">S458</div><div class="name" id="waveName">موجة القيادة • CH 07</div></div>
      <button class="arrow" onclick="changeWave(1)">›</button>
    </div>

    <div class="mode">
      <button class="active" id="btnWave" onclick="setMode('wave')">📻 الموجة المباشرة</button>
      <button id="btnRoom" onclick="setMode('room')">🏠 محادثة الغرفة</button>
    </div>

    <!-- RADIO DEVICE PRO -->
    <div class="radio-stage" id="radioStage">
      <div class="device" id="device">
        <div class="antenna"></div>
        <div class="screen">
          <div class="ch" id="devCh">S458</div>
          <div class="fr" id="devFr">CH 07 • 446.100 MHz</div>
          <div class="st idle" id="devSt">● جاهز</div>
        </div>
        <div class="knobs"><div class="knob"></div><div class="knob"></div></div>
        <div class="ptt-main" id="pttMain"><b id="pttTxt">PTT</b><small>PRESS TO TALK</small></div>
        <div class="side-ptt" id="sidePtt"><span>PTT</span></div>
      </div>
      <div class="waveform" id="waveform"><i style="height:5px"></i><i style="height:9px"></i><i style="height:14px"></i><i style="height:9px"></i><i style="height:5px"></i></div>
      <div class="hint" id="hint">اضغط مطولاً على PTT - أزرق إرسال / أحمر استقبال</div>
    </div>

    <!-- CHAT PRO -->
    <div class="chat" id="chatBox">
      <div class="chat-head"><span id="chatTitle">💬 محادثة الغرفة</span><span style="color:#46d879">● مشفر AES-256</span></div>
      <div class="msgs" id="msgs"><div style="text-align:center;color:#536a80;font-size:10px;padding:20px">لا توجد رسائل<br>🔵 TX = إرسالك &nbsp; 🔴 RX = استقبال</div></div>
      <div class="input-row"><div class="icon" id="micBtn">🎙️</div><input id="inp" placeholder="اكتب رسالة..." oninput="onInp()" onkeydown="if(event.key==='Enter')sendMsg()"><div class="send" id="sendBtn" onclick="sendMsg()">➤</div></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
let waveIdx=0, waves=[], mode='wave', isTx=false, audioCtx=null, livekitRoom=null, deviceId=localStorage.getItem('radioDeviceId')||'', activeRoomId=localStorage.getItem('radioActiveRoomId')||'', rooms=[];
const NAMES=["موجة القيادة","موجة العمليات","موجة الطوارئ","موجة المساندة","موجة الاستطلاع","موجة الإمداد","موجة الاتصال","موجة الدعم"];
for(let i=0;i<30;i++){let l=String.fromCharCode(65+Math.floor(Math.random()*26));let n=Math.floor(100+Math.random()*900);waves.push({code:l+n,name:(NAMES[i]||'موجة '+(i+1))})}
let cur=waves[0];

function beep(f,d){try{if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended') audioCtx.resume();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.2,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}catch(e){}}
function toast(m){let t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}

function setMode(m){
 mode=m;localStorage.setItem('radioCommMode',m);
 $('btnWave').classList.toggle('active',m==='wave');
 $('btnRoom').classList.toggle('active',m==='room');
 $('radioStage').style.display=m==='wave'?'flex':'none';
 $('chatBox').classList.toggle('show',m==='room');
 toast(m==='wave'?'📻 وضع الموجة - جهاز حقيقي':'🏠 وضع الغرفة');
}
function changeWave(d){
 waveIdx=(waveIdx+d+waves.length)%waves.length;cur=waves[waveIdx];
 $('waveCode').textContent=cur.code;$('devCh').textContent=cur.code;$('waveName').textContent=cur.name+' • CH 07';
 toast('📻 '+cur.code);
}
function setTx(on){
 let dev=$('device'), st=$('devSt'), side=$('sidePtt'), main=$('pttMain'), wf=$('waveform'), hint=$('hint');
 if(on){
  dev.classList.add('tx');dev.classList.remove('rx');side.classList.add('tx');side.classList.remove('rx');main.classList.add('tx');main.classList.remove('rx');wf.classList.add('active');wf.classList.remove('rx');st.textContent='🔵 TX - ترسل الآن';st.className='st tx';hint.textContent='🔵 جاري الإرسال...';
  beep(1500,.06);
  if(navigator.vibrate) navigator.vibrate(40);
 }else{
  dev.classList.remove('tx');side.classList.remove('tx');main.classList.remove('tx');wf.classList.remove('active');st.textContent='● جاهز';st.className='st idle';hint.textContent='اضغط مطولاً على PTT';
  beep(900,.1);
 }
}
function setRx(on){
 let dev=$('device'), st=$('devSt'), side=$('sidePtt'), main=$('pttMain'), wf=$('waveform');
 if(on){
  dev.classList.add('rx');dev.classList.remove('tx');side.classList.add('rx');side.classList.remove('tx');main.classList.add('rx');main.classList.remove('tx');wf.classList.add('active','rx');st.textContent='🔴 RX - استلام من Q307';st.className='st rx';
  beep(1100,.12);setTimeout(()=>beep(1100,.12),140);
  if(navigator.vibrate) navigator.vibrate([80,40,80]);
  setTimeout(()=>setRx(false),2500);
 }else{
  dev.classList.remove('rx');side.classList.remove('rx');main.classList.remove('rx');wf.classList.remove('active','rx');st.textContent='● جاهز';st.className='st idle';
 }
}

// PTT events
let ptt=$('pttMain'), side=$('sidePtt'), stream=null;
function startTx(e){e.preventDefault();if(isTx) return;isTx=true;setTx(true)}
function endTx(e){e.preventDefault();if(!isTx) return;isTx=false;setTx(false)}
;[ptt,side].forEach(el=>{
 el.addEventListener('pointerdown',startTx);
 el.addEventListener('pointerup',endTx);
 el.addEventListener('pointercancel',endTx);
 el.addEventListener('touchstart',startTx,{passive:false});
 el.addEventListener('touchend',endTx,{passive:false});
});

// Chat
function onInp(){$('sendBtn').classList.toggle('show',$('inp').value.trim().length>0)}
function addMsg(txt,mine){
 let c=$('msgs');if(c.children.length===1 && c.children[0].textContent.includes('لا توجد')) c.innerHTML='';
 let d=document.createElement('div');d.className='bubble '+(mine?'mine':'other');
 let tag=mine?'🔵 [TX] S458':'🔴 [RX] Q307';
 d.innerHTML=txt+'<div class="meta"><span>'+new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})+'</span><span>'+tag+'</span></div>';
 c.appendChild(d);c.scrollTop=c.scrollHeight;
 if(!mine) setRx(true);
}
function sendMsg(){
 let i=$('inp');let t=i.value.trim();if(!t) return;
 addMsg(t,true);i.value='';onInp();
 setTimeout(()=>addMsg('مستلم. سأتحرك إلى نقطة المراقبة الشمالية.',false),1200);
}

// init
(async()=>{
 try{
  let r=await fetch('/api/device',{method:'POST',headers:{'Content-Type':'application/json','x-device-id':deviceId},body:JSON.stringify({deviceId})});
  let d=await r.json();if(d.deviceId) deviceId=d.deviceId;if(d.waveFingerprint){$('waveCode').textContent=d.waveFingerprint;$('devCh').textContent=d.waveFingerprint;cur.code=d.waveFingerprint}
 }catch(e){}
 setMode(localStorage.getItem('radioCommMode')||'wave');
})();
</script>
</body>
</html>
