<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio Connect</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#02050e;color:#eaf2ff;direction:rtl;text-align:right}
body{padding-bottom:75px}
button,input{font:inherit}button{border:0;cursor:pointer}
.hidden{display:none!important}
.app{max-width:520px;min-height:100vh;margin:auto;background:radial-gradient(circle at 50% 15%,rgba(13,40,81,.4),transparent 60%),linear-gradient(180deg,#050c1b,#02050e);padding:10px}
/* ... باقي الـ CSS حقك نفسه ... */
</style>
</head>
<body>
<div class="app">
  <!-- ضع هنا نفس الـ HTML حق الواجهة من الصورة -->
  <div class="topbar">
    <button class="iconbtn" onclick="openDrawer()">☰</button>
    <div class="brand"><strong>Radio Connect</strong><span>جهاز لاسلكي</span></div>
    <div class="serverStatus"><span class="statusDot"></span><span id="serverStatusText">متصل</span></div>
  </div>
  <!-- ... -->
</div>

<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
<script>
'use strict';
const API = location.origin;
const $ = id => document.getElementById(id);

let deviceId = localStorage.getItem('deviceId') || null;
let livekitRoom = null, livekitRoomId = null, localAudioTrack = null;
let talking = false, pttPointerId = null, pttSession = 0;
let currentRoom = null, voiceMode = 'natural';
const state = { rooms:[], members:[] };

function toast(msg){
  const e = $('toast'); if(!e) return;
  e.textContent = msg; e.classList.remove('hidden');
  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(()=>e.classList.add('hidden'),3000)
}

// ... باقي الدوال مع التصليح ...

async function connectLiveKitRoom(){
  if(!currentRoom || !window.LivekitClient) return false;
  const target = currentRoom.id;
  if(livekitRoom && livekitRoom.state === 'connected' && livekitRoomId === target) return true;
  if(livekitRoom) await disconnectLiveKit();
  try{
    const r = await fetch(`${API}/token?room=${encodeURIComponent(target)}`,{headers:{'x-device-id':deviceId||''}});
    const d = await r.json();
    if(!r.ok || !d.token) return false;
    const room = new LivekitClient.Room({adaptiveStream:true,dynacast:true});
    room.on(LivekitClient.RoomEvent.TrackSubscribed, track => {
      if(track.kind === LivekitClient.Track.Kind.Audio){
        const a = track.attach(); a.autoplay=true; a.playsInline=true;
        document.body.appendChild(a); a.play().catch(()=>{})
      }
    });
    await room.connect(d.url, d.token);
    livekitRoom = room; livekitRoomId = target;
    return true;
  }catch(e){ console.error(e); return false; }
}

async function startTalking(e){
  if(e){ e.preventDefault(); if(e.pointerId!==undefined) pttPointerId=e.pointerId; }
  if(talking || !currentRoom) return;
  const session = ++pttSession;
  talking = true;
  $('pttButton').classList.add('talking');
  $('pttText').textContent = 'جارٍ التحدث';
  try{
    const connected = await connectLiveKitRoom();
    if(!talking || session !== pttSession) return;
    if(!connected) throw new Error('LIVEKIT_NOT_CONNECTED');
    const stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
    const raw = stream.getAudioTracks()[0];
    localAudioTrack = new LivekitClient.LocalAudioTrack(raw);
    await livekitRoom.localParticipant.publishTrack(localAudioTrack);
    toast('الميكروفون يعمل الآن');
  }catch(err){ await stopTalking(); toast('تعذر تشغيل الميكروفون - تأكد من HTTPS والسماح بالميكروفون'); }
}

async function stopTalking(e){
  if(e && pttPointerId !== null && e.pointerId !== undefined && e.pointerId !== pttPointerId) return;
  ++pttSession; talking=false; pttPointerId=null;
  $('pttButton').classList.remove('talking');
  $('pttText').textContent = 'اضغط للتحدث';
  const t = localAudioTrack; localAudioTrack=null;
  if(!t) return;
  try{ if(livekitRoom?.localParticipant) await livekitRoom.localParticipant.unpublishTrack(t); }catch{}
  try{ t.stop(); }catch{}
}

// اربط احداث الزر
document.addEventListener('DOMContentLoaded', ()=>{
  const btn = $('pttButton');
  if(btn){
    btn.addEventListener('pointerdown', startTalking);
    btn.addEventListener('pointerup', stopTalking);
    btn.addEventListener('pointerleave', stopTalking);
    btn.addEventListener('pointercancel', stopTalking);
  }
});
</script>
</body>
</html>
