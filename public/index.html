<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0E1116">
<title>الموجة — لاسلكي</title>

<style>
/* =========================================================
   إعادة ضبط عامة
   ========================================================= */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --bg:        #0E1116;
  --bg-card:   #161b22;
  --border:    #222932;
  --text:      #e6edf3;
  --text-dim:  #7d8590;
  --green:     #00ff80;
  --red:       #ff3b3b;
  --blue:      #2979ff;
  --orange:    #ff9100;
  --purple:    #7c4dff;
  --radius:    16px;
}

html, body {
  height: 100%;
  overflow: hidden;
}

body {
  font-family: 'Segoe UI', 'Tahoma', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  padding: 20px 18px 26px;
  user-select: none;
  -webkit-user-select: none;
  overflow: hidden;
}

/* =========================================================
   الهيدر
   ========================================================= */
.header {
  width: 100%;
  text-align: center;
  flex-shrink: 0;
}

.logo {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-size: 30px;
  font-weight: 800;
  letter-spacing: 3px;
  color: #fff;
}

.logo-dot {
  width: 13px;
  height: 13px;
  border-radius: 50%;
  background: #3a4048;
  transition: all .3s ease;
  box-shadow: 0 0 0 rgba(0, 255, 128, 0);
}

.logo-dot.on {
  background: var(--green);
  box-shadow: 0 0 18px var(--green), 0 0 4px #fff;
}

.logo-dot.alert {
  background: var(--purple);
  box-shadow: 0 0 18px var(--purple);
  animation: alertBlink .4s infinite alternate;
}

@keyframes alertBlink {
  from { opacity: 1; }
  to   { opacity: 0.35; }
}

.status {
  margin-top: 8px;
  font-size: 13.5px;
  color: var(--text-dim);
  min-height: 20px;
  transition: color .25s, font-weight .25s;
  font-weight: 500;
}

.status.on    { color: var(--green); }
.status.rec   { color: var(--red); }
.status.alert { color: var(--purple); }

/* =========================================================
   المنطقة الوسطى — الدائرة
   ========================================================= */
.device-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  min-height: 0;
}

.device {
  position: relative;
  width: min(62vw, 260px);
  aspect-ratio: 1 / 1;
  border-radius: 50%;
  background: radial-gradient(circle at 50% 40%, #232a34 0%, #0E1116 72%);
  border: 2px solid #1c222b;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: border-color .3s, box-shadow .3s;
}

.device::before {
  content: '';
  position: absolute;
  inset: 14px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.03);
  pointer-events: none;
}

.device.connected {
  border-color: rgba(0, 255, 128, 0.55);
  box-shadow:
    0 0 34px rgba(0, 255, 128, 0.32),
    inset 0 0 34px rgba(0, 255, 128, 0.07);
}

.device.recording {
  border-color: rgba(255, 59, 59, 0.7);
  animation: pulseRed 1.1s ease-in-out infinite alternate;
}

@keyframes pulseRed {
  from {
    box-shadow:
      0 0 20px rgba(255, 59, 59, 0.45),
      inset 0 0 20px rgba(255, 59, 59, 0.15);
  }
  to {
    box-shadow:
      0 0 54px rgba(255, 59, 59, 0.9),
      inset 0 0 40px rgba(255, 59, 59, 0.4);
  }
}

.device.alerting {
  border-color: var(--purple);
  animation: pulsePurple 0.55s ease-in-out infinite alternate;
}

@keyframes pulsePurple {
  from { box-shadow: 0 0 20px rgba(124, 77, 255, 0.5); }
  to   { box-shadow: 0 0 60px rgba(124, 77, 255, 1);   }
}

.mic-svg {
  width: 42%;
  height: 42%;
  color: #fff;
  transition: transform .25s;
}

.device.recording .mic-svg {
  animation: micShake 0.55s ease-in-out infinite;
}

@keyframes micShake {
  0%, 100% { transform: rotate(0deg); }
  25%      { transform: rotate(-4deg) scale(1.03); }
  75%      { transform: rotate(4deg)  scale(1.03); }
}

/* موجات حول الدائرة عند التسجيل */
.wave-ring {
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  border: 2px solid transparent;
  pointer-events: none;
  opacity: 0;
}

.device.recording .wave-ring {
  opacity: 1;
  border-color: rgba(255, 59, 59, 0.4);
  animation: ringExpand 1.4s ease-out infinite;
}

@keyframes ringExpand {
  0%   { transform: scale(1);    opacity: 0.9; }
  100% { transform: scale(1.25); opacity: 0;   }
}

/* =========================================================
   الأزرار
   ========================================================= */
.controls {
  width: 100%;
  max-width: 420px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 11px;
}

.btn {
  width: 100%;
  height: 54px;
  border: none;
  border-radius: var(--radius);
  font-family: inherit;
  font-size: 15.5px;
  font-weight: 700;
  color: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  transition: transform .12s, box-shadow .2s, background .25s, opacity .2s;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
  letter-spacing: 0.2px;
}

.btn:active:not(:disabled) {
  transform: scale(0.97);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
}

.btn:disabled {
  background: #232932 !important;
  color: #5a616b;
  cursor: not-allowed;
  box-shadow: none;
  opacity: .55;
}

.btn-icon { font-size: 17px; }

#connectBtn          { background: var(--blue); }
#connectBtn.active   { background: var(--orange); }

#recordBtn           { background: #00b34e; }
#recordBtn.active    { background: #e01e1e; }

#callBtn             { background: var(--purple); }

/* شريط الموجة الصوتية */
.wave-bar {
  display: none;
  height: 5px;
  background: #1a1f27;
  border-radius: 3px;
  overflow: hidden;
  margin-top: -3px;
}

.wave-bar.active { display: block; }

.wave-bar span {
  display: block;
  height: 100%;
  width: 32%;
  background: linear-gradient(90deg, transparent, var(--red), transparent);
  animation: waveSlide 1.15s linear infinite;
}

@keyframes waveSlide {
  from { transform: translateX(-120%); }
  to   { transform: translateX(430%);  }
}

/* شريط معلومات المسودات */
.drafts-info {
  font-size: 11px;
  color: var(--text-dim);
  text-align: center;
  min-height: 15px;
  margin-top: -2px;
}

/* عنصر الصوت المخفي */
audio { display: none; }
</style>
</head>
<body>

<!-- ======== الهيدر ======== -->
<header class="header">
  <div class="logo">
    <span class="logo-dot" id="statusDot"></span>
    <span>الموجة</span>
  </div>
  <div class="status" id="statusText">غير متصل</div>
</header>

<!-- ======== الدائرة ======== -->
<main class="device-wrap">
  <div class="device" id="device">
    <div class="wave-ring"></div>
    <div class="wave-ring" style="animation-delay:.7s"></div>
    <svg class="mic-svg" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.5"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
      <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
      <line x1="12" y1="19" x2="12" y2="23"/>
      <line x1="8"  y1="23" x2="16" y2="23"/>
    </svg>
  </div>
</main>

<!-- ======== الأزرار ======== -->
<footer class="controls">
  <button id="connectBtn" class="btn">
    <span class="btn-icon">🔗</span>
    <span id="connectLabel">الاتصال</span>
  </button>

  <button id="recordBtn" class="btn" disabled>
    <span class="btn-icon">⏺</span>
    <span id="recordLabel">بدء تسجيل الغرفة</span>
  </button>

  <div class="wave-bar" id="waveBar"><span></span></div>
  <div class="drafts-info" id="draftsInfo"></div>

  <button id="callBtn" class="btn" disabled>
    <span class="btn-icon">📡</span>
    <span>محاكاة نداء وارد (أولوية)</span>
  </button>
</footer>

<!-- مشغل صوتي مخفي -->
<audio id="voicePlayer" crossorigin="anonymous"></audio>

<script>
/* =========================================================
   MawjaService — القلب المنطقي (نفس منطق Flutter)
   ========================================================= */
class MawjaService {
  constructor() {
    this.audioCtx        = null;
    this.voicePlayer     = document.getElementById('voicePlayer');
    this.mediaRecorder   = null;
    this.recordedChunks  = [];
    this.isInitialized   = false;
    this.beepBuffer      = null;
    this._statusCb       = null;
    this._streamRef      = null;
  }

  /* -------- مراقب الحالة -------- */
  onStatus(cb) { this._statusCb = cb; }
  _emit(text, cls = '') {
    if (this._statusCb) this._statusCb(text, cls);
  }

  /* -------- توليد نغمة beep برمجياً -------- */
  _generateBeep(duration, frequency, decay = 6) {
    const sr  = this.audioCtx.sampleRate;
    const len = Math.floor(sr * duration);
    const buf = this.audioCtx.createBuffer(1, len, sr);
    const ch  = buf.getChannelData(0);

    for (let i = 0; i < len; i++) {
      const t = i / sr;
      const env = Math.exp(-decay * t) * Math.min(1, t * 60);
      ch[i] = Math.sin(2 * Math.PI * frequency * t) * env;
    }
    return buf;
  }

  /* -------- 1. تهيئة الجلسة الصوتية -------- */
  async init() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) throw new Error('Web Audio API غير مدعوم');

      this.audioCtx = new AC();

      if (this.audioCtx.state === 'suspended') {
        await this.audioCtx.resume();
      }

      // توليد نغمة النداء (بديل عن ملف mp3)
      this.beepBuffer = this._generateBeep(0.4, 1000, 6);

      this.isInitialized = true;
      this._emit('✅ تم تهيئة الصوت', 'on');
      return true;
    } catch (e) {
      console.error('فشل التهيئة:', e);
      this._emit('❌ فشل تهيئة الصوت', 'rec');
      return false;
    }
  }

  /* -------- 2. صوت النداء -------- */
  async playMawjaAlert() {
    if (!this.beepBuffer) return;

    const src  = this.audioCtx.createBufferSource();
    const gain = this.audioCtx.createGain();

    src.buffer    = this.beepBuffer;
    gain.gain.value = 1.0;

    src.connect(gain).connect(this.audioCtx.destination);
    src.start();

    await new Promise(r =>
      setTimeout(r, this.beepBuffer.duration * 1000)
    );
  }

  /* -------- 3. تشغيل الصوت الحي -------- */
  async playLiveVoice(streamUrl) {
    try {
      // رابط فارغ → شغّل نغمة اختبارية (صوت شخص تجريبي)
      if (!streamUrl || streamUrl === 'live_stream_url') {
        this._emit('🎙️ صوت حي (تجريبي)', 'on');

        const src  = this.audioCtx.createBufferSource();
        const gain = this.audioCtx.createGain();
        src.buffer      = this._generateBeep(1.6, 380, 0.6);
        gain.gain.value = 0.55;

        src.connect(gain).connect(this.audioCtx.destination);
        src.start();

        return new Promise(r => setTimeout(r, 1600));
      }

      this.voicePlayer.src    = streamUrl;
      this.voicePlayer.volume = 1.0;
      await this.voicePlayer.play();
    } catch (e) {
      console.error('خطأ في الصوت الحي:', e);
    }
  }

  /* -------- 4. قانون الأولوية -------- */
  async onMawjaIncomingWhileRecordingInRoom() {
    this._emit('📡 نداء وارد — أولوية عالية', 'alert');

    await this.pauseRoomRecordingAndSaveDraft();
    await this.playMawjaAlert();
    await new Promise(r => setTimeout(r, 400));
    await this.playLiveVoice('live_stream_url');
  }

  /* -------- إيقاف تسجيل الغرفة -------- */
  async pauseRoomRecordingAndSaveDraft() {
    return new Promise((resolve) => {
      if (this.mediaRecorder && this.mediaRecorder.state === 'recording') {
        this.mediaRecorder.onstop = () => {
          this._saveDraft();
          this._cleanupStream();
          this._emit('⏸️ تم إيقاف التسجيل — مسودة محفوظة', 'alert');
          resolve();
        };
        this.mediaRecorder.stop();
      } else {
        resolve();
      }
    });
  }

  /* -------- بدء تسجيل الغرفة -------- */
  async startRoomRecording() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: false,
          noiseSuppression: false,
          autoGainControl:  false,
        }
      });

      this._streamRef       = stream;
      this.mediaRecorder    = new MediaRecorder(stream);
      this.recordedChunks   = [];

      this.mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) this.recordedChunks.push(e.data);
      };

      this.mediaRecorder.start(250); // chunks كل 250ms
      return true;
    } catch (e) {
      console.error('فشل بدء التسجيل:', e);
      this._emit('❌ لا يوجد إذن ميكروفون', 'rec');
      return false;
    }
  }

  stopRoomRecording() {
    if (this.mediaRecorder && this.mediaRecorder.state === 'recording') {
      this.mediaRecorder.onstop = () => {
        this._saveDraft();
        this._cleanupStream();
      };
      this.mediaRecorder.stop();
    }
  }

  /* -------- حفظ المسودة محلياً -------- */
  _saveDraft() {
    try {
      const blob = new Blob(this.recordedChunks, { type: 'audio/webm' });
      const size = (blob.size / 1024).toFixed(1);
      const key  = 'mawja_draft_' + Date.now();

      // نحفظ الحجم فقط (لأن Blob كبير على localStorage)
      const drafts = JSON.parse(localStorage.getItem('mawja_drafts') || '[]');
      drafts.push({ id: key, size: size + ' KB', date: new Date().toISOString() });

      // نحتفظ بآخر 20 مسودة فقط
      if (drafts.length > 20) drafts.shift();
      localStorage.setItem('mawja_drafts', JSON.stringify(drafts));

      console.log('💾 مسودة محفوظة:', size, 'KB');
      this._updateDraftsUI();
    } catch (e) {
      console.warn('تعذر حفظ المسودة:', e);
    }
  }

  _updateDraftsUI() {
    const drafts = JSON.parse(localStorage.getItem('mawja_drafts') || '[]');
    const el = document.getElementById('draftsInfo');
    if (el && drafts.length > 0) {
      el.textContent = `📁 عدد المسودات: ${drafts.length}`;
    }
  }

  _cleanupStream() {
    if (this._streamRef) {
      this._streamRef.getTracks().forEach(t => t.stop());
      this._streamRef = null;
    }
  }

  /* -------- إيقاف كل شيء -------- */
  stopAll() {
    try { this.voicePlayer.pause(); } catch (_) {}
    this.voicePlayer.currentTime = 0;
    this.stopRoomRecording();
  }

  /* -------- تنظيف نهائي -------- */
  dispose() {
    this.stopAll();
    this._cleanupStream();
    if (this.audioCtx) {
      try { this.audioCtx.close(); } catch (_) {}
      this.audioCtx = null;
    }
  }
}

/* =========================================================
   طبقة الواجهة — تربط الأزرار بالخدمة
   ========================================================= */
const UI = {
  service:       new MawjaService(),
  isConnected:   false,
  isRecording:   false,
  isProcessing:  false,

  els: {
    dot:          document.getElementById('statusDot'),
    status:       document.getElementById('statusText'),
    device:       document.getElementById('device'),
    connectBtn:   document.getElementById('connectBtn'),
    connectLabel: document.getElementById('connectLabel'),
    recordBtn:    document.getElementById('recordBtn'),
    recordLabel:  document.getElementById('recordLabel'),
    callBtn:      document.getElementById('callBtn'),
    waveBar:      document.getElementById('waveBar'),
    draftsInfo:   document.getElementById('draftsInfo'),
  },

  /* -------- تحديث حالة النص -------- */
  setStatus(text, cls = '') {
    this.els.status.textContent = text;
    this.els.status.className   = 'status ' + cls;

    this.els.dot.classList.remove('on', 'alert');
    if (cls === 'on')    this.els.dot.classList.add('on');
    if (cls === 'alert') this.els.dot.classList.add('alert');
  },

  /* -------- زر الاتصال -------- */
  async toggleConnect() {
    if (this.isProcessing) return;
    this.isProcessing = true;

    try {
      if (!this.isConnected) {
        const ok = await this.service.init();
        if (!ok) return;

        this.isConnected = true;
        this.setStatus('متصل — جاهز', 'on');

        this.els.connectLabel.textContent = 'قطع الاتصال';
        this.els.connectBtn.classList.add('active');
        this.els.device.classList.add('connected');

        this.els.recordBtn.disabled = false;
        this.els.callBtn.disabled   = false;

        this._refreshDrafts();
      } else {
        this.service.stopAll();
        this.isConnected = false;
        this.isRecording = false;

        this.setStatus('غير متصل', '');
        this.els.connectLabel.textContent = 'الاتصال';
        this.els.connectBtn.classList.remove('active');
        this.els.device.classList.remove('connected', 'recording', 'alerting');

        this.els.recordBtn.disabled  = true;
        this.els.callBtn.disabled    = true;
        this.els.recordLabel.textContent = 'بدء تسجيل الغرفة';
        this.els.recordBtn.classList.remove('active');
        this.els.waveBar.classList.remove('active');
      }
    } finally {
      this.isProcessing = false;
    }
  },

  /* -------- زر التسجيل -------- */
  async toggleRecord() {
    if (!this.isConnected || this.isProcessing) return;
    this.isProcessing = true;

    try {
      if (!this.isRecording) {
        const ok = await this.service.startRoomRecording();
        if (!ok) return;

        this.isRecording = true;
        this.setStatus('🔴 جاري تسجيل الغرفة...', 'rec');

        this.els.recordLabel.textContent = 'إيقاف التسجيل';
        this.els.recordBtn.classList.add('active');
        this.els.device.classList.add('recording');
        this.els.waveBar.classList.add('active');
      } else {
        this.service.stopRoomRecording();
        this.isRecording = false;

        this.setStatus('متصل — جاهز', 'on');
        this.els.recordLabel.textContent = 'بدء تسجيل الغرفة';
        this.els.recordBtn.classList.remove('active');
        this.els.device.classList.remove('recording');
        this.els.waveBar.classList.remove('active');

        setTimeout(() => this._refreshDrafts(), 300);
      }
    } finally {
      this.isProcessing = false;
    }
  },

  /* -------- محاكاة نداء وارد -------- */
  async simulateIncoming() {
    if (!this.isConnected || this.isProcessing) return;
    this.isProcessing = true;

    // تأثير بصري
    this.els.device.classList.add('alerting');

    try {
      await this.service.onMawjaIncomingWhileRecordingInRoom();

      // إعادة الواجهة
      this.isRecording = false;
      this.els.recordLabel.textContent = 'بدء تسجيل الغرفة';
      this.els.recordBtn.classList.remove('active');
      this.els.device.classList.remove('recording');
      this.els.waveBar.classList.remove('active');
      this.setStatus('متصل — جاهز', 'on');

      setTimeout(() => this._refreshDrafts(), 400);
    } finally {
      this.els.device.classList.remove('alerting');
      this.isProcessing = false;
    }
  },

  /* -------- تحديث عدد المسودات -------- */
  _refreshDrafts() {
    const drafts = JSON.parse(localStorage.getItem('mawja_drafts') || '[]');
    this.els.draftsInfo.textContent = drafts.length
      ? `📁 عدد المسودات: ${drafts.length}`
      : '';
  },

  /* -------- ربط الأحداث -------- */
  bind() {
    this.els.connectBtn.addEventListener('click', () => this.toggleConnect());
    this.els.recordBtn .addEventListener('click', () => this.toggleRecord());
    this.els.callBtn   .addEventListener('click', () => this.simulateIncoming());

    // استقبال رسائل الخدمة
    this.service.onStatus((text, cls) => this.setStatus(text, cls));

    // تحميل عدد المسودات من البداية
    this._refreshDrafts();

    // تنظيف عند إغلاق الصفحة
    window.addEventListener('beforeunload', () => this.service.dispose());
  }
};

/* =========================================================
   تشغيل
   ========================================================= */
UI.bind();

/* منع قائمة الزر الأيمن */
document.addEventListener('contextmenu', e => e.preventDefault());

/* منع السحب والإفلات على الموبايل */
document.addEventListener('touchmove', e => {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });
</script>
</body>
  </html>
