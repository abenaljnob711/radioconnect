<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  margin:0;
  padding:0
}

html,body{

.app{

  min-height:100vh;
  margin:0 auto;

  box-shadow:0 0 40px rgba(0,0,0,.6)
}

.main-image{

  display:block;
  object-fit:contain
}

.hotspot{
  position:absolute;
  background:rgba(0,0,0,0);
  cursor:pointer;
  -webkit-tap-highlight-color:rgba(52,152,219,.2)
}

.hotspot:active{

.ptt-hotspot{

  left:50%;

}

.toast{
  position:fixed;
  left:50%;

  transform:translateX(-50%);
  background:#0a1e36;
  color:#fff;
  border:1px solid rgba(255,255,255,.1);
  padding:10px 18px;
  border-radius:20px;
  font-size:12px;
  z-index:100;
  opacity:0;
  pointer-events:none;

  max-width:90%;

}

.toast.show{

/* شاشة الجهاز */
.radio-screen{

  left:50%;

  align-items:center;

    0 0 10px rgba(0,255,0,.15);

}

.radio-glow{
  position:absolute;
  left:50%;
  top:44%;
  transform:translate(-50%,-50%);
  width:34%;
  aspect-ratio:1;
  border-radius:50%;
  background:radial-gradient(

    rgba(231,76,60,.25),

  );

}

.radio-glow.active{

}

.wave-display{

  background:rgba(7,26,46,.9);

/* =========================
   الدردشة
========================= */

.chat-close{

  color:#fff;

#chatMessages{
  flex:1;

.msg-bubble{
  max-width:82%;

.msg-bubble.sent{

}

.msg-bubble.received{

}

.empty-chat{

.chat-composer{

  border-radius:8px;
  padding:8px 14px

.hidden-file{
  display:none

<script>

/* =====================================================
   البيانات الأصلية للواجهة
===================================================== */

const waves = [
  {code:"7F3A",name:"العمليات"},
  {code:"68B665",name:"غرفة القيادة"},
  {code:"9K21",name:"الطوارئ"},
  {code:"4M88",name:"المساندة"},
  {code:"6P17",name:"القيادة"}
];

let waveIndex = 0;
let currentWave = waves[0];


/* =====================================================
   LiveKit
===================================================== */

const API = location.origin;

let deviceId =
  localStorage.getItem("radioDeviceId") ||
  "dev_" +
  Math.random()
    .toString(36)
    .substr(2,9);

localStorage.setItem(
  "radioDeviceId",
  deviceId
);

let activeRoomId =
  localStorage.getItem(
    "radio_active_room_id"
  ) || "";

let livekitRoom = null;
let localAudioTrack = null;
let isTalking = false;
let connectingLiveKit = false;


/* =====================================================
   عناصر
===================================================== */

function $(id){
  return document.getElementById(id);
}


/* =====================================================
   Toast
===================================================== */

function toast(message){

  const t = $("toast");

  if(!t) return;

  t.textContent = message;

  t.classList.add("show");

  clearTimeout(window.radioToastTimer);

  window.radioToastTimer =
    setTimeout(() => {
      t.classList.remove("show");
    },2500);
}


/* =====================================================
   تسجيل الجهاز
===================================================== */

async function registerDevice(){

  try{

    const response =
      await fetch(
        API + "/api/device",
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json",
            "x-device-id":
              deviceId
          },
          body:JSON.stringify({
            deviceId:deviceId
          })
        }
      );

    const data =
      await response.json();

    if(data.deviceId){

      deviceId =
        data.deviceId;

      localStorage.setItem(
        "radioDeviceId",
        deviceId
      );
    }

    return true;

  }catch(error){

    console.error(
      "Device registration:",
      error
    );

    return false;
  }
}


/* =====================================================
   الحصول على الغرفة الحقيقية
===================================================== */

async function loadActiveRoom(){

  try{

    const response =
      await fetch(
        API + "/api/rooms",
        {
          headers:{
            "x-device-id":
              deviceId
          }
        }
      );

    const data =
      await response.json();

    if(!data.success){
      return false;
    }

    const rooms =
      data.rooms || [];


    /*
      الغرفة المحفوظة
    */

    if(activeRoomId){

      const current =
        rooms.find(
          room =>
            room.id === activeRoomId &&
            room.isMember === true
        );

      if(current){

        updateRoomName(
          current.name
        );

        return true;
      }
    }


    /*
      أول غرفة مقبول فيها الجهاز
    */

    const approvedRoom =
      rooms.find(
        room =>
          room.isMember === true
      );

    if(approvedRoom){

      activeRoomId =
        approvedRoom.id;

      localStorage.setItem(
        "radio_active_room_id",
        activeRoomId
      );

      updateRoomName(
        approvedRoom.name
      );

      console.log(
        "Active room:",
        activeRoomId
      );

      return true;
    }


    activeRoomId = "";

    localStorage.removeItem(
      "radio_active_room_id"
    );

    return false;

  }catch(error){

    console.error(
      "Room loading:",
      error
    );

    return false;
  }
}


/* =====================================================
   تحديث اسم الغرفة في الدردشة
===================================================== */

function updateRoomName(name){

  if($("chatRoomName") && name){

    $("chatRoomName").textContent =
      name;
  }
}


/* =====================================================
   اتصال LiveKit
===================================================== */

async function connectLiveKit(){

  if(connectingLiveKit){
    return false;
  }

  if(!window.LivekitClient){

    toast(
      "تعذر تحميل نظام الصوت"
    );

    return false;
  }

  connectingLiveKit = true;

  try{

    await registerDevice();


    /*
      لا نستخدم default-room.
      نحصل على الغرفة من السيرفر.
    */

    if(!activeRoomId){

      const found =
        await loadActiveRoom();

      if(!found){

        toast(
          "لا توجد غرفة مقبول فيها الجهاز"
        );

        return false;
      }
    }


    /*
      إذا كان الاتصال قائمًا
    */

    if(
      livekitRoom &&
      livekitRoom.state ===
        "connected"
    ){

      return true;
    }


    const tokenResponse =
      await fetch(
        API +
        "/token?room=" +
        encodeURIComponent(
          activeRoomId
        ),
        {
          headers:{
            "x-device-id":
              deviceId
          }
        }
      );


    const tokenData =
      await tokenResponse.json();


    if(!tokenResponse.ok){

      throw new Error(
        tokenData.error ||
        "تعذر الحصول على تصريح LiveKit"
      );
    }


    const livekitUrl =
      tokenData.url ||
      tokenData.livekitUrl;


    if(
      !tokenData.token ||
      !livekitUrl
    ){

      throw new Error(
        "بيانات LiveKit غير مكتملة"
      );
    }


    livekitRoom =
      new window.LivekitClient.Room({
        adaptiveStream:true,
        dynacast:true
      });


    /* =========================
       استقبال الصوت
    ========================= */

    livekitRoom.on(
      window.LivekitClient.RoomEvent.TrackSubscribed,
      (track,publication,participant) => {

        console.log(
          "REMOTE AUDIO:",
          participant.identity
        );

        if(
          track.kind ===
          window.LivekitClient.Track.Kind.Audio
        ){

          const audio =
            track.attach();

          audio.autoplay = true;
          audio.playsInline = true;

          audio.style.display =
            "none";

          document.body.appendChild(
            audio
          );

          audio.play().catch(
            error => {
              console.warn(
                "Audio playback:",
                error
              );
            }
          );
        }
      }
    );


    /* =========================
       إزالة الصوت
    ========================= */

    livekitRoom.on(
      window.LivekitClient.RoomEvent.TrackUnsubscribed,
      track => {

        try{

          track.detach().forEach(
            element =>
              element.remove()
          );

        }catch(_){}
      }
    );


    /* =========================
       استقبال الدردشة
    ========================= */

    livekitRoom.on(
      window.LivekitClient.RoomEvent.DataReceived,
      payload => {

        try{

          const text =
            new TextDecoder(
              "utf-8"
            ).decode(payload);

          const data =
            JSON.parse(text);


          if(
            data.type ===
              "radio-chat" &&
            data.senderDeviceId !==
              deviceId
          ){

            appendMessageToUI(
              data.text,
              data.senderName,
              false,
              data.fileType,
              data.fileData
            );
          }

        }catch(error){

          console.error(
            "Receive message:",
            error
          );
        }
      }
    );


    /* =========================
       الاتصال
    ========================= */

    await livekitRoom.connect(
      livekitUrl,
      tokenData.token
    );


    console.log(
      "LIVEKIT CONNECTED:",
      activeRoomId
    );

    toast(
      "🟢 الصوت متصل"
    );

    return true;

  }catch(error){

    console.error(
      "LiveKit connection error:",
      error
    );

    livekitRoom = null;

    toast(
      error.message ||
      "تعذر الاتصال بالصوت"
    );

    return false;

  }finally{

    connectingLiveKit = false;
  }
}


/* =====================================================
   PTT
===================================================== */

const pttButton =
  $("pttBtn");

const pttArea =
  $("pttArea");


function setupPTTButton(button){

  if(!button) return;

  button.style.touchAction =
    "none";

  button.addEventListener(
    "pointerdown",
    startTalk
  );

  button.addEventListener(
    "pointerup",
    stopTalk
  );

  button.addEventListener(
    "pointercancel",
    stopTalk
  );
}


/*
  الزر الرئيسي
*/

setupPTTButton(
  pttButton
);


/*
  منطقة الضغط الموجودة
  في التصميم الأصلي
*/

setupPTTButton(
  pttArea
);


/* =====================================================
   بدء التحدث
===================================================== */

async function startTalk(event){

  if(event){
    event.preventDefault();
  }

  if(isTalking){
    return;
  }


  /*
    الاتصال بـ LiveKit
  */

  if(
    !livekitRoom ||
    livekitRoom.state !==
      "connected"
  ){

    const connected =
      await connectLiveKit();

    if(!connected){
      return;
    }
  }


  try{

    /*
      طلب الميكروفون الحقيقي
    */

    const stream =
      await navigator.mediaDevices
        .getUserMedia({
          audio:{
            echoCancellation:true,
            noiseSuppression:true,
            autoGainControl:true
          }
        });


    const rawTrack =
      stream.getAudioTracks()[0];


    if(!rawTrack){

      throw new Error(
        "لم يتم العثور على الميكروفون"
      );
    }


    /*
      إنشاء مسار LiveKit
    */

    localAudioTrack =
      new window.LivekitClient.LocalAudioTrack(
        rawTrack
      );


    localAudioTrack.enable();


    /*
      نشر الصوت
    */

    await livekitRoom
      .localParticipant
      .publishTrack(
        localAudioTrack,
        {
          name:
            "radio-microphone",

          source:
            window.LivekitClient.Track
              .Source.Microphone
        }
      );


    isTalking = true;


    /*
      تغيير شكل الجهاز فقط
    */

    if(pttButton){
      pttButton.classList.add(
        "talking"
      );
    }

    $("radioGlow")
      .classList.add(
        "active"
      );

    $("radioScreen").style.color =
      "#ff4444";

    $("radioScreen").style.textShadow =
      "0 0 6px #ff4444,0 0 12px rgba(255,68,68,.5)";


    toast(
      "🔴 تتحدث على " +
      currentWave.code
    );


    console.log(
      "MICROPHONE PUBLISHED"
    );

  }catch(error){

    console.error(
      "Microphone error:",
      error
    );

    isTalking = false;

    toast(
      "تعذر تشغيل الميكروفون"
    );
  }
}


/* =====================================================
   إيقاف التحدث
===================================================== */

async function stopTalk(event){

  if(event){
    event.preventDefault();
  }

  if(
    !isTalking &&
    !localAudioTrack
  ){
    return;
  }


  isTalking = false;


  if(pttButton){

    pttButton.classList.remove(
      "talking"
    );
  }

  $("radioGlow")
    .classList.remove(
      "active"
    );

  $("radioScreen").style.color =
    "#39ff14";

  $("radioScreen").style.textShadow =
    "0 0 6px #39ff14,0 0 12px rgba(57,255,20,.5)";


  try{

    if(
      livekitRoom &&
      localAudioTrack
    ){

      await livekitRoom
        .localParticipant
        .unpublishTrack(
          localAudioTrack
        );
    }

  }catch(error){

    console.error(
      "Stop microphone:",
      error
    );
  }


  try{

    if(localAudioTrack){
      localAudioTrack.stop();
    }

  }catch(_){}


  localAudioTrack = null;


  toast(
    "✅ تم إيقاف الإرسال"
  );


  console.log(
    "MICROPHONE STOPPED"
  );
}


/* =====================================================
   تغيير الموجة - الواجهة كما هي
===================================================== */

function changeWave(dir){

  waveIndex += dir;

  if(
    waveIndex < 0
  ){
    waveIndex =
      waves.length - 1;
  }

  if(
    waveIndex >= waves.length
  ){
    waveIndex = 0;
  }


  currentWave =
    waves[waveIndex];


  $("radioScreen")
    .textContent =
      currentWave.code;

  $("waveDisplay")
    .textContent =
      currentWave.code;


  updateRoomName(
    currentWave.name
  );


  const rs =
    $("radioScreen");


  rs.style.boxShadow =
    "inset 0 0 12px rgba(0,255,0,.4)," +
    "0 0 20px rgba(57,255,20,.6)";


  setTimeout(
    () => {

      rs.style.boxShadow =
        "inset 0 0 8px rgba(0,255,0,.2)," +
        "0 0 10px rgba(0,255,0,.15)";

    },
    300
  );


  toast(
    "📡 " +
    currentWave.code +
    " - " +
    currentWave.name
  );
}

/* =====================================================

/* =====================================================
   إضافة رسالة
===================================================== */

function appendMessageToUI(
  message,
  senderName,
  isMine,
  fileType = null,
  fileData = null
){

  const box =
    $("chatMessages");

  if(!box) return;


  const empty =
    box.querySelector(
      ".empty-chat"
    );

  if(empty){
    empty.remove();
  }


  const item =
    document.createElement(
      "div"
    );


  item.className =
    "msg-bubble " +
    (
      isMine
        ? "sent"
        : "received"
    );


  let text =
    String(message || "")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;");


  if(
    fileType &&
    fileData
  ){

    if(
      fileType.startsWith(
        "image/"
      )
    ){

      text +=
        "<br><img src=\"" +
        fileData +
        "\" style=\"" +
        "max-width:100%;" +
        "border-radius:8px;" +
        "margin-top:5px;" +
        "\">";

    }else if(
      fileType.startsWith(
        "video/"
      )
    ){

      text +=
        "<br><video src=\"" +
        fileData +
        "\" controls style=\"" +
        "max-width:100%;" +
        "border-radius:8px;" +
        "margin-top:5px;" +
        "\"></video>";

    }else{

      text +=
        "<br><a href=\"" +
        fileData +
        "\" download=\"file\">" +
        "📎 تنزيل الملف</a>";
    }
  }


  if(
    senderName &&
    !isMine
  ){

    item.innerHTML =
      "<small style=\"" +
      "display:block;" +
      "color:#a3c7ef;" +
      "font-size:9px;" +
      "margin-bottom:2px\">" +
      escapeHtml(
        senderName
      ) +
      "</small>" +
      text;

  }else{

    item.innerHTML =
      text;
  }


  box.appendChild(
    item
  );


  box.scrollTop =
    box.scrollHeight;
}


function escapeHtml(value){

  return String(value || "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    );
}


/* =====================================================
   إرسال رسالة
===================================================== */

async function sendMsg(){

  const input =
    $("chatInput");

  if(!input) return;


  const message =
    input.value.trim();

  if(!message) return;


  /*
    الاتصال قبل الإرسال
  */

  if(
    !livekitRoom ||
    livekitRoom.state !==
      "connected"
  ){

    const connected =
      await connectLiveKit();

    if(!connected){
      return;
    }
  }


  try{

    const data = {

      type:
        "radio-chat",

      text:
        message,

      senderDeviceId:
        deviceId,

      senderName:
        "أنت"
    };


    const payload =
      new TextEncoder()
        .encode(
          JSON.stringify(data)
        );


    await livekitRoom
      .localParticipant
      .publishData(
        payload,
        {
          reliable:true
        }
      );


    /*
      عرض الرسالة محليًا
    */

    appendMessageToUI(
      message,
      "أنت",
      true
    );


    input.value = "";


  }catch(error){

    console.error(
      "Send message error:",
      error
    );

    toast(
      "تعذر إرسال الرسالة"
    );
  }
}


/* =====================================================
   زر Enter للدردشة
===================================================== */

$("chatInput")
  ?.addEventListener(
    "keydown",
    event => {

      if(
        event.key === "Enter"
      ){

        event.preventDefault();

        sendMsg();
      }
    }
  );


/* =====================================================
   إيقاف الميكروفون عند الخروج
===================================================== */

window.addEventListener(
  "blur",
  () => {

    if(isTalking){
      stopTalk();
    }
  }
);


document.addEventListener(
  "visibilitychange",
  () => {

    if(
      document.hidden &&
      isTalking
    ){

      stopTalk();
    }
  }
);


/* =====================================================
   تشغيل التطبيق
===================================================== */

async function initRadioConnect(){

  console.log(
    "Radio Connect starting..."
  );


  await registerDevice();


  const found =
    await loadActiveRoom();


  if(found){

    /*
      اتصال LiveKit بدون تغيير الواجهة
    */

    await connectLiveKit();

  }else{

    console.log(
      "لا توجد غرفة مقبول فيها الجهاز حاليًا"
    );

    /*
      لا نعرض خطأ على الواجهة.
      التصميم يبقى كما هو.
    */
  }
}


if(
  document.readyState ===
  "loading"
){

  document.addEventListener(
    "DOMContentLoaded",
    initRadioConnect
  );

}else{

  initRadioConnect();
}
