<title>Radio Connect</title>
<style>
.pttBtn{
  width:108px;height:108px;border-radius:50%;
  background:radial-gradient(circle at 50% 35%,#1e5db0,#14386a 60%,#0a1e3c);
  border:2.5px solid rgba(59,141,224,.55);
  box-shadow:0 0 0 6px rgba(59,141,224,.12),0 0 20px rgba(30,93,176,.5);
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;
  transition:all .15s ease;
}
.pttBtn.talking{
  background:radial-gradient(circle at 50% 35%,#ff3b3b,#dc2626 55%,#7f1d1d);
  border-color:rgba(248,113,113,.9);
  box-shadow:0 0 0 10px rgba(239,68,68,.20),0 0 35px rgba(239,68,68,.8);
  transform:scale(.94);
  animation:pulseTalk .6s infinite alternate
}
@keyframes pulseTalk{
  from{box-shadow:0 0 0 8px rgba(239,68,68,.18),0 0 30px rgba(239,68,68,.6)}
  to{box-shadow:0 0 0 14px rgba(239,68,68,.28),0 0 45px rgba(239,68,68,.9)}
}
