<script>
'use strict';


/* =========================
   الإعدادات الأساسية
========================= */

const API = location.origin;

const DEFAULT_ROOM = "7F3A";

let deviceId =
  localStorage.getItem("deviceId") || null;

let livekitRoom = null;

let livekitRoomId = null;

let localAudioTrack = null;

let localRawStream = null;

let talking = false;

let pttSession = 0;

let voiceMode = "natural";

let currentWave = {
  code:"7F3A",
  name:"العمليات"
};

let waveIndex = 0;


const waves = [
  {code:"7F3A",name:"العمليات"},
  {code:"68B665",name:"غرفة القيادة"},
  {code:"9K21",name:"الطوارئ"},
  {code:"4M88",name:"المساندة"},
  {code:"6P17",name:"القيادة"}
];


const $ = id =>
  document.getElementById(id);


/* =========================
   الرسائل المنبثقة
========================= */

function toast(message){

  const t = $("toast");

  if(!t) return;

  t.textContent = message;

  t.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(
      ()=>t.classList.remove("show"),
      2500
    );
}


/* =========================
   تسجيل الجهاز
========================= */

async function registerDevice(){

  try{

    const response =
      await fetch(
        API + "/api/device",
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            deviceId
          })
        }
      );

    const data =
      await response.json();

    if(data.deviceId){

      deviceId =
        data.deviceId;

      localStorage.setItem(
        "deviceId",
        deviceId
      );

    }

  }catch(error){

    console.error(
      "Device registration:",
      error
    );

  }

}


/* =========================
   اتصال LiveKit
========================= */

async function connectLiveKit(){

  if(!window.LivekitClient){

    toast("تعذر تحميل نظام الصوت");

    return false;
  }


  if(!deviceId){

    await registerDevice();

  }


  if(
    livekitRoom &&
    livekitRoom.state === "connected" &&
    livekitRoomId === DEFAULT_ROOM
  ){

    return true;

  }


  if(livekitRoom){

    await disconnectLiveKit();

  }


  try{

    const url =
      API +
      "/token?room=" +
      encodeURIComponent(DEFAULT_ROOM) +
      "&identity=" +
      encodeURIComponent(deviceId) +
      "&deviceId=" +
      encodeURIComponent(deviceId);


    const response =
      await fetch(
        url,
        {
          headers:{
            "x-device-id":
              deviceId || ""
          }
        }
      );


    let data = {};

    try{

      data =
        await response.json();

    }catch(e){}


    if(!response.ok || !data.token){

      console.error(
        "Token error:",
        data
      );

      toast(
        data.error ||
        "تعذر الاتصال بالغرفة"
      );

      return false;

    }


    const room =
      new LivekitClient.Room({
        adaptiveStream:true,
        dynacast:true
      });


    /*
      استقبال صوت الأجهزة الأخرى
    */

    room.on(
      LivekitClient.RoomEvent.TrackSubscribed,
      (track)=>{

        if(
          track.kind ===
          LivekitClient.Track.Kind.Audio
        ){

          const audio =
            track.attach();

          audio.autoplay = true;

          audio.playsInline = true;

          audio.setAttribute(
            "data-livekit-audio",
            "1"
          );

          document.body.appendChild(
            audio
          );

          audio.play()
            .catch(()=>{});

        }

      }
    );


    /*
      إزالة الصوت عند انتهاء الإرسال
    */

    room.on(
      LivekitClient.RoomEvent.TrackUnsubscribed,
      (track)=>{

        try{

          track
            .detach()
            .forEach(
              element =>
                element.remove()
            );

        }catch(e){}

      }
    );


    /*
      استقبال رسائل الدردشة
    */

    room.on(
      LivekitClient.RoomEvent.DataReceived,
      (
        payload,
        participant,
        kind,
        topic
      )=>{

        try{

          if(
            topic &&
            topic !== "radio-chat"
          ){

            return;

          }


          const text =
            new TextDecoder()
              .decode(payload);


          const message =
            JSON.parse(text);


          if(
            message.type ===
              "radio-chat" &&
            message.senderDeviceId !==
              deviceId
          ){

            appendChatMessage(
              message.text || "",
              message.senderName ||
                "عضو",
              false,
              message.time ||
                Date.now()
            );

          }

        }catch(error){

          console.error(
            "Chat receive:",
            error
          );

        }

      }
    );


    room.on(
      LivekitClient.RoomEvent.Disconnected,
      ()=>{

        if(
          livekitRoom === room
        ){

          livekitRoom = null;

          livekitRoomId = null;

        }

      }
    );


    await room.connect(
      data.url,
      data.token
    );


    livekitRoom = room;

    livekitRoomId =
      DEFAULT_ROOM;


    toast("متصل بالغرفة ✅");

    return true;


  }catch(error){

    console.error(
      "LiveKit connection:",
      error
    );

    livekitRoom = null;

    livekitRoomId = null;

    toast(
      "تعذر الاتصال بالغرفة"
    );

    return false;

  }

}


/* =========================
   فصل LiveKit
========================= */

async function disconnectLiveKit(){

  try{

    if(localAudioTrack){

      if(
        livekitRoom &&
        livekitRoom.localParticipant
      ){

        try{

          await livekitRoom
            .localParticipant
            .unpublishTrack(
              localAudioTrack
            );

        }catch(e){}

      }


      try{

        localAudioTrack.stop();

      }catch(e){}


      localAudioTrack = null;

    }


    if(localRawStream){

      try{

        localRawStream
          .getTracks()
          .forEach(
            track =>
              track.stop()
          );

      }catch(e){}

      localRawStream = null;

    }


    if(livekitRoom){

      try{

        await livekitRoom.disconnect();

      }catch(e){}

    }

  }finally{

    livekitRoom = null;

    livekitRoomId = null;

  }

}


/* =========================
   طلب الميكروفون
========================= */

async function requestMicrophone(){

  if(!window.isSecureContext){

    throw new Error(
      "HTTPS_REQUIRED"
    );

  }


  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    throw new Error(
      "MEDIA_DEVICES_UNAVAILABLE"
    );

  }


  try{

    return await
      navigator.mediaDevices
      .getUserMedia({
        audio:{
          echoCancellation:true,
          noiseSuppression:true,
          autoGainControl:true,
          channelCount:1
        }
      });

  }catch(error){

    console.error(
      "Microphone:",
      error
    );


    if(
      error.name ===
        "NotAllowedError" ||
      error.name ===
        "PermissionDeniedError"
    ){

      throw new Error(
        "MIC_PERMISSION"
      );

    }


    if(
      error.name ===
        "NotFoundError" ||
      error.name ===
        "DevicesNotFoundError"
    ){

      throw new Error(
        "MIC_NOT_FOUND"
      );

    }


    if(
      error.name ===
        "NotReadableError"
    ){

      throw new Error(
        "MIC_BUSY"
      );

    }


    throw error;

  }

}


/* =========================
   بدء PTT
========================= */

async function startTalk(event){

  if(event){

    event.preventDefault();

  }


  if(talking){

    return;

  }


  const session =
    ++pttSession;


  talking = true;


  $("pttBtn")
    .classList
    .add("talking");


  $("radioGlow")
    .classList
    .add("active");


  $("radioScreen")
    .style
    .color = "#ff4444";


  toast(
    "🔴 جارٍ الاتصال بالميكروفون..."
  );


  try{

    /*
      الاتصال بالغرفة أولاً
    */

    const connected =
      await connectLiveKit();


    if(
      !talking ||
      session !== pttSession
    ){

      return;

    }


    if(
      !connected ||
      !livekitRoom ||
      livekitRoom.state !==
        "connected"
    ){

      throw new Error(
        "LIVEKIT_NOT_CONNECTED"
      );

    }


    /*
      طلب إذن الميكروفون
    */

    const stream =
      await requestMicrophone();


    if(
      !talking ||
      session !== pttSession
    ){

      stream
        .getTracks()
        .forEach(
          t => t.stop()
        );

      return;

    }


    localRawStream = stream;


    const raw =
      stream
        .getAudioTracks()[0];


    if(!raw){

      throw new Error(
        "MIC_NOT_FOUND"
      );

    }


    /*
      تحويل ميكروفون المتصفح
      إلى LiveKit Audio Track
    */

    localAudioTrack =
      new LivekitClient.LocalAudioTrack(
        raw
      );


    try{

      localAudioTrack.source =
        LivekitClient.Track.Source.Microphone;

    }catch(e){}


    await livekitRoom
      .localParticipant
      .publishTrack(
        localAudioTrack
      );


    if(
      !talking ||
      session !== pttSession
    ){

      await stopLocalAudio();

      return;

    }


    toast(
      "🎙️ الميكروفون يعمل الآن"
    );


    console.log(
      "PTT microphone ON"
    );


  }catch(error){

    console.error(
      "PTT ERROR:",
      error
    );


    if(
      session === pttSession
    ){

      talking = false;

      $("pttBtn")
        .classList
        .remove("talking");

      $("radioGlow")
        .classList
        .remove("active");

      $("radioScreen")
        .style
        .color = "#39ff14";


      if(
        error.message ===
        "MIC_PERMISSION"
      ){

        toast(
          "اسمح للمتصفح باستخدام الميكروفون"
        );

      }else if(
        error.message ===
        "MIC_NOT_FOUND"
      ){

        toast(
          "لم يتم العثور على ميكروفون"
        );

      }else if(
        error.message ===
        "MIC_BUSY"
      ){

        toast(
          "الميكروفون مستخدم حالياً"
        );

      }else if(
        error.message ===
        "LIVEKIT_NOT_CONNECTED"
      ){

        toast(
          "تعذر الاتصال بالغرفة"
        );

      }else{

        toast(
          "تعذر تشغيل الميكروفون"
        );

      }

    }

  }

}


/* =========================
   إيقاف PTT
========================= */

async function stopTalk(event){

  if(event){

    event.preventDefault();

  }


  if(!talking){

    return;

  }


  talking = false;

  ++pttSession;


  $("pttBtn")
    .classList
    .remove("talking");


  $("radioGlow")
    .classList
    .remove("active");


  $("radioScreen")
    .style
    .color = "#39ff14";


  await stopLocalAudio();


  toast(
    "✅ تم إيقاف الإرسال"
  );

}


/* =========================
   إيقاف صوت المستخدم
========================= */

async function stopLocalAudio(){

  const track =
    localAudioTrack;


  localAudioTrack = null;


  if(track){

    try{

      if(
        livekitRoom &&
        livekitRoom.localParticipant
      ){

        await livekitRoom
          .localParticipant
          .unpublishTrack(
            track
          );

      }

    }catch(error){

      console.error(
        "unpublish:",
        error
      );

    }


    try{

      track.stop();

    }catch(e){}

  }


  if(localRawStream){

    try{

      localRawStream
        .getTracks()
        .forEach(
          t => t.stop()
        );

    }catch(e){}

    localRawStream = null;

  }

}
