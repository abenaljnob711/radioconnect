<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}

}

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radio Connect - نفس الصورة 100%</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#020816;display:flex;justify-content:center;min-height:100vh;padding:0}
  .app-wrapper{
    position:relative;
    width:100%;
    max-width:420px;
    line-height:0;
    padding:0;
    background:#071022;
  }
  .app-wrapper img{
    width:100%;
    height:auto;
    display:block;
  }
  .overlay{
    position:absolute;
    border:2px solid transparent;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:all .15s ease;
    line-height:1;
  }
  .overlay.mic{
    left:39.3%;
    top:25.8%;
    width:21.4%;
    height:14.1%;
    border-radius:50%;
    background:radial-gradient(circle at 35% 35%, rgba(59,155,255,0) 0%, rgba(59,155,255,0) 100%);
  }
  .overlay.mic:active{
    background:radial-gradient(circle at 35% 35%, #ff5a5a 0%, #dc2626 60%, #991b1b 100%);
    box-shadow:0 0 0 8px rgba(239,68,68,.25), 0 0 28px rgba(239,68,68,.8);
    transform:scale(0.92);
  }
  .overlay.mic:active::after{
    content:'🔴 يتحدث';
    position:absolute;
    top:-28px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(239,68,68,.92);
    color:#fff;
    padding:4px 10px;
    border-radius:12px;
    font-size:10px;
    font-family:Tajawal,Arial,sans-serif;
    white-space:nowrap;
  }
  .overlay.toggle{
    border-radius:20px;
    background:transparent;
  }
  .overlay.toggle:active{
    background:rgba(59,155,255,.15);
    border-color:rgba(59,155,255,.3);
  }
  .overlay.chat{
    border-radius:20px;
    background:transparent;
  }
  .overlay.chat:active{
    background:rgba(59,155,255,.08);
  }
  .hint{
    position:fixed;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(18,48,90,.9);
    color:#fff;
    padding:8px 14px;
    border-radius:10px;
    font-size:11px;
    font-family:Tajawal,Arial,sans-serif;
    z-index:100;
    direction:rtl;
    text-align:center;
    max-width:90%;
    backdrop-filter:blur(10px);
    border:1px solid rgba(80,140,200,.2);
  }
</style>
</head>
