<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050914">
<title>جهاز لاسلكي</title>

<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
 margin:0;
 min-height:100%;
 font-family:Arial,"Noto Sans Arabic",sans-serif;
 background:#050914;
 color:#eef5ff
}
body{padding-bottom:86px}
button,input{font:inherit}
button{cursor:pointer;border:0}
.hidden{display:none!important}
.app{max-width:1100px;margin:auto}

.topbar{
 height:82px;
 background:linear-gradient(135deg,#06285b,#06152f);
 border-bottom:1px solid #0b67c8;
 display:flex;
 align-items:center;
 gap:14px;
 padding:10px 18px;
 position:sticky;
 top:0;
 z-index:20
}
.menuBtn{
 width:52px;height:52px;border-radius:15px;
 background:#0a2247;color:#fff;font-size:27px
}
.brand{display:flex;align-items:center;gap:10px;flex:1}
.brandIcon{font-size:35px;color:#1595ff}
.brand b{display:block;font-size:21px}
.brand small{font-size:13px;color:#9fc7f6}
.serverState{
 padding:11px 17px;border:1px solid #0759a9;
 border-radius:28px;background:#061b39;font-weight:700
}
.dot{
 display:inline-block;width:12px;height:12px;border-radius:50%;
 background:#28df77;margin-left:7px
}

main{padding:16px}

.card{
 background:linear-gradient(145deg,#07172e,#061122);
 border:1px solid #0a4e91;
 border-radius:20px;
 box-shadow:0 8px 30px #0005
}

.roomHead{
 display:grid;
 grid-template-columns:1fr 1.3fr 1fr;
 gap:12px;
 padding:14px
}
.roomBox,.statusBox{
 min-height:120px;
 border:1px solid #07579f;
 border-radius:17px;
 padding:16px;
 background:#061a35
}
.roomBox{
 display:flex;
 align-items:center;
 gap:12px
}
.star{font-size:28px;color:#ffd24d}
.roomBox b{font-size:18px}
.roomBox small{
 display:block;
 color:#9bc2ef;
 margin-top:7px
}
.current{text-align:center}
.current .label{
 color:#72c5ff;
 font-size:15px;
 margin-top:4px
}
.current .roomName{
 font-size:25px;
 font-weight:800;
 margin:12px 0 5px;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis
}
.current .waveName{
 font-size:14px;
 color:#8fb9e9
}
.waveNav{
 display:flex;
 justify-content:center;
 align-items:center;
 gap:10px
}
.arrow{
 width:45px;
 height:45px;
 border-radius:50%;
 background:#092b59;
 color:#d8edff;
 font-size:30px
}

.statusBox{
 display:flex;
 align-items:center;
 justify-content:space-around;
 text-align:center
}
.statusItem{font-size:23px}
.statusItem small{
 display:block;
 font-size:12px;
 color:#9ebde0;
 margin-top:5px
}

.controls{
 margin-top:14px;
 padding:18px
}
.voiceRow{
 display:grid;
 grid-template-columns:1fr 1.15fr 1fr;
 align-items:center;
 gap:16px
}
.voiceMode{
 border:1px solid #0870cf;
 border-radius:18px;
 background:#071d3a;
 padding:16px;
 min-height:100px;
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:10px
}
.voiceMode .icon{font-size:34px}
.voiceMode b{font-size:17px}
.voiceMode small{
 display:block;
 color:#9ec8f2;
 margin-top:6px
}

.switch{
 width:58px;
 height:32px;
 border-radius:20px;
 background:#344866;
 padding:3px;
 position:relative
}
.switch span{
 display:block;
 width:26px;
 height:26px;
 border-radius:50%;
 background:#dce8f7;
 transition:.2s
}
.switch.on{background:#087cf0}
.switch.on span{transform:translateX(-26px)}

.pttWrap{text-align:center}
.ptt{
 width:190px;
 height:190px;
 border-radius:50%;
 background:radial-gradient(circle,#0b2d60 0,#061a38 60%,#051125 100%);
 border:7px solid #087fff;
 color:#fff;
 box-shadow:0 0 25px #0786ff77,inset 0 0 30px #087fff33;
 font-size:20px;
 font-weight:800;
 touch-action:none;
 user-select:none
}
.ptt.talking{
 border-color:#20df8b;
 box-shadow:0 0 35px #20df8b99,inset 0 0 30px #20df8b33
}
.mic{
 font-size:55px;
 display:block;
 margin-bottom:6px
}
.waveVisual{
 height:50px;
 margin-top:12px;
 display:flex;
 align-items:center;
 justify-content:center;
 gap:4px
}
.waveVisual i{
 display:block;
 width:5px;
 height:10px;
 border-radius:6px;
 background:#087fff;
 transition:.15s
}
.waveVisual.talking i{animation:wave .55s infinite alternate}
.waveVisual i:nth-child(2n){animation-delay:.08s}
.waveVisual i:nth-child(3n){animation-delay:.16s}
@keyframes wave{to{height:40px}}

.contentGrid{
 display:grid;
 grid-template-columns:1.2fr .8fr;
 gap:14px;
 margin-top:14px
}
.chat,.media{min-height:430px}
.cardTitle{
 padding:15px 17px;
 border-bottom:1px solid #0a3b6d;
 font-size:19px;
 font-weight:800
}
.messages{
 height:315px;
 overflow:auto;
 padding:14px
}
.msg{margin:9px 0;max-width:85%}
.msg.me{margin-right:auto}
.bubble{
 background:#0a315f;
 border:1px solid #0c5fa8;
 border-radius:14px;
 padding:10px 12px;
 display:inline-block
}
.me .bubble{background:#0864c5}
.msg small{
 display:block;
 color:#7798bc;
 font-size:10px;
 margin-top:3px
}
.chatInput{
 display:flex;
 gap:8px;
 padding:12px;
 border-top:1px solid #0a3b6d
}
.chatInput input{
 flex:1;
 min-width:0;
 background:#061a35;
 border:1px solid #0a4e91;
 color:#fff;
 border-radius:14px;
 padding:12px;
 outline:none
}
.iconBtn,.sendBtn{
 width:46px;
 height:46px;
 border-radius:14px;
 background:#0a2b55;
 color:#d9ecff;
 font-size:20px
}
.sendBtn{background:#087cf0}

.mediaGrid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
 padding:14px
}
.mediaBtn{
 min-height:100px;
 border:1px solid #0a5aa5;
 background:#071d39;
 color:#dbeeff;
 border-radius:17px;
 font-weight:700
}
.mediaBtn span{
 display:block;
 font-size:31px;
 margin-bottom:8px
}
.attachments{padding:0 14px 14px}
.progress{
 color:#91bce8;
 font-size:12px;
 margin-top:6px
}

.bottom{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 background:#041027;
 border-top:1px solid #0b4d8d;
 height:76px;
 z-index:30;
 display:flex;
 justify-content:center
}
.bottomInner{
 width:min(1100px,100%);
 display:grid;
 grid-template-columns:repeat(4,1fr)
}
.navBtn{
 background:transparent;
 color:#91a8c9;
 font-size:12px
}
.navBtn span{
 display:block;
 font-size:25px;
 margin-bottom:2px
}
.navBtn.active{color:#1492ff}

.drawer{
 position:fixed;
 inset:0;
 background:#0008;
 z-index:50
}
.drawerPanel{
 width:min(330px,88%);
 height:100%;
 background:#06152b;
 border-left:1px solid #0b5ca8;
 padding:18px
}
.drawerPanel h2{margin-top:0}
.drawerItem{
 width:100%;
 padding:15px;
 border-radius:13px;
 background:#09213f;
 color:#fff;
 text-align:right;
 margin:8px 0
}

.modal{
 position:fixed;
 inset:0;
 background:#000a;
 z-index:60;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:18px
}
.modalBox{
 width:min(520px,100%);
 max-height:90vh;
 overflow:auto;
 background:#07172e;
 border:1px solid #0b67c8;
 border-radius:20px;
 padding:20px
}
.modalBox input{
 width:100%;
 padding:13px;
 border-radius:12px;
 border:1px solid #0a559c;
 background:#06152b;
 color:#fff;
 margin:8px 0 12px
}
.primary{
 background:#087cf0;
 color:#fff;
 padding:12px 17px;
 border-radius:12px
}
.secondary{
 background:#18304f;
 color:#fff;
 padding:12px 17px;
 border-radius:12px
}

.toast{
 position:fixed;
 bottom:90px;
 left:50%;
 transform:translateX(-50%);
 background:#09284e;
 border:1px solid #0b70ce;
 padding:11px 17px;
 border-radius:14px;
 z-index:100;
 max-width:90%;
 text-align:center
}

.setup{
 padding:30px 18px;
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center
}
.setup .card{
 width:min(600px,100%);
 padding:25px
}
.testRow{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
 margin-top:12px
}
.test{
 padding:14px;
 border:1px solid #0a4f90;
 border-radius:14px;
 background:#071d38
}
.ok{color:#37df8c}
.bad{color:#ff7777}

@media(max-width:760px){
 .topbar{height:72px;padding:8px 12px}
 .brand b{font-size:17px}
 .brand small{font-size:11px}
 .serverState{padding:9px 12px;font-size:12px}
 .roomHead{grid-template-columns:1fr}
 .statusBox{min-height:78px}
 .current{order:-1}
 .voiceRow{grid-template-columns:1fr}
 .ptt{width:175px;height:175px}
 .contentGrid{grid-template-columns:1fr}
 .chat,.media{min-height:auto}
 .messages{height:270px}
}
</style>
</head>

<body>

<div class="app">

<header class="topbar">
 <button class="menuBtn" onclick="openDrawer()">☰</button>

 <div class="brand">
  <div class="brandIcon">◉</div>
  <div>
   <b>Radio Connect</b>
   <small>جهاز لاسلكي</small>
  </div>
 </div>

 <div class="serverState">
  <span class="dot"></span>
  <span id="serverText">متصل</span>
 </div>
</header>

<main>

<section class="card roomHead">

 <div class="roomBox">
  <div class="star">★</div>
  <div>
   <b id="roomTitle">غرفة خاصة</b>
   <small id="memberCount">أعضاء الغرفة (0)</small>
  </div>
 </div>

 <div class="current">
  <div class="label">الغرفة الحالية</div>

  <div class="waveNav">
   <button class="arrow" onclick="changeWave(-1)">‹</button>

   <div>
    <div class="roomName" id="currentRoomName">غرفة خاصة</div>
    <div class="waveName" id="waveText">الموجة 1 من 50</div>
   </div>

   <button class="arrow" onclick="changeWave(1)">›</button>
  </div>
 </div>

 <div class="statusBox">
  <div class="statusItem">
   🔋
