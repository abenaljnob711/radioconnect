<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#020E28">
<title>Radio Connect - صوت حقيقي</title>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.8.0/dist/livekit-client.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;max-width:100%}
html{overflow-x:hidden}
html,body{font-family:'Tajawal',Arial,sans-serif;background:#010a1f;color:#e8f0ff;min-height:100vh;width:100%;overflow-x:hidden}
body{padding-bottom:80px;display:flex;justify-content:center}
button{border:0;cursor:pointer;font-family:inherit}
.hidden{display:none!important}
.app{width:100%;max-width:430px;min-height:100vh;background:radial-gradient(circle at 50% -20%,#0d2347 0%,#010a1f 55%);margin:0 auto;overflow-x:hidden}
.content{padding:8px;display:flex;flex-direction:column;gap:8px;width:100%}
.topbar{height:56px;background:linear-gradient(180deg,#0e2a5a,#0a1e44);border-bottom:1px solid rgba(86,140,220,.2);display:flex;align-items:center;justify-content:space-between;padding:0 8px;position:sticky;top:0;z-index:30;width:100%;direction:ltr}
.top-left{display:flex;align-items:center;gap:8px}
.menuBtn{width:36px;height:36px;background:transparent;color:#8eb4e0;font-size:24px}
.logoIcon{width:36px;height:36px;background:rgba(30,93,176,.2);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#3b8de0}
.brand b{font-size:15px;font-weight:800;color:#fff}
.brand span{font-size:11px;color:#a8c0dc}
.onlinePill{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.25);border:1px solid rgba(100,170,120,.2);padding:4px 10px;border-radius:20px}
.onlinePill i{width:8px;height:8px;background:#2ecc71;border-radius:50%}
.card{background:linear-gradient(145deg,#0b1e3c,#091833);border:1px solid rgba(86,140,220,.15);border-radius:16px;padding:8px;width:100%;overflow:hidden}
.roomCard{display:flex;align-items:center;justify-content:space-between;gap:4px;direction:ltr;width:100%}
.roomSelector{background:rgba(0,0,0,.22);border-radius:12px;padding:6px 8px;flex:0 0 92px;direction:rtl;text-align:right}
.selTop{font-size:11px;font-weight:700}
.waveCenter{text-align:center;flex:1;min-width:0;direction:rtl}
.waveNav{display:flex;align-items:center;justify-content:center;gap:6px;direction:ltr}
.waveNav button{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.06);color:#8eb4e0}
.waveCode{font-size:22px;font-weight:900;letter-spacing:2px;color:#d0e4ff}
.statusCol{display:flex;gap:4px;text-align:center;direction:ltr;flex:0 0 96px}
.sItem{font-size:8px;color:#6f8aad;flex:1}
.sItem strong{color:#e0eeff;font-size:10px;display:block}
.voiceCard{display:flex;align-items:center;justify-content:space-between;gap:4px;padding:6px;direction:ltr;width:100%}
.vSide{background:#0e2445;border:1px solid rgba(86,140,220,.15);border-radius:12px;padding:6px;flex:0 0 78px;direction:rtl}
.toggle{width:32px;height:18px;background:#1a2e52;border-radius:20px;position:relative}
.toggle.active{background:#1e5db0}
.toggle i{position:absolute;top:2px;left:2px;width:14px;height:14px;background:#fff;border-radius:50%;transition:.2s}
.toggle.active i{transform:translateX(14px)}
.pttWrap{text-align:center;flex:1;min-width:0;direction:rtl}
.pttBtn{width:108px;height:108px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#1e5db0,#14386a 60%,#0a1e3c);border:2.5px solid rgba(59,141,224,.55);box-shadow:0 0 0 6px rgba(59,141,224,.12),0 0 20px rgba(30,93,176,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;margin:0 auto;transition:all.15s ease}
.pttBtn.talking{background:radial-gradient(circle at 50% 35%,#ff3b3b,#dc2626 55%,#7f1d1d);border-color:rgba(248,113,113,.9);box-shadow:0 0 0 10px rgba(239,68,68,.20),0 0 35px rgba(239,68,68,.8);transform:scale(.94);animation:pulseTalk.6s infinite alternate}
@keyframes pulseTalk{from{box-shadow:0 0 0 8px rgba(239,68,68,.18),0 0 30px rgba(239,68,68,.6)}to{box-shadow:0 0 0 14px rgba(239,68,68,.28),0 0 45px rgba(239,68,68,.9)}}
.waves{display:flex;gap:2px;justify-content:center;margin-top:6px;height:16px;direction:ltr}
.waves span{width:3px;height:6px;background:#1e3a5f;border-radius:3px}
.waves.active span{animation:bar.45s infinite alternate;background:#ef4444}
@keyframes bar{to{height:18px;background:#f87171}}
.split{display:flex;gap:6px;direction:ltr;width:100%}
.chatCard{flex:1;min-width:0;display:flex;flex-direction:column;min-height:340px;direction:rtl}
.actions{flex:0 0 110px;display:flex;flex-direction:column;gap:6px;direction:rtl}
.actGrid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.actBtn{background:#0e2445;border:1px solid rgba(86,140,220,.15);border-radius:12px;padding:8px 4px;text-align:center;color:#cfe2ff}
.bottomNav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:60px;background:rgba(3,12,30,.98);display:flex;justify-content:space-around;align-items:center;z-index:40;direction:ltr}
.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:#12305a;color:#fff;padding:8px 12px;border-radius:10px;font-size:11px;z-index:100;max-width:90%;direction:rtl}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="top-left"><button class="menuBtn">☰</button><div class="logoIcon">((•))</div><div class="brand"><b>Radio Connect</b><span>جهاز لاسلكي</span></div></div><div class="top-right"><div class="onlinePill"><i></i><span id="connectionText">متصل</span></div></div></header>
<div id="audioIndicator" style="position:fixed;top:70px;left:50%;transform:translateX(-50%);background:rgba(239,68,68,.9);color:#fff;padding:6px 14px;border-radius:20px;font-size:11px;z-index:90;display:none">🔴 يتحدث الآن - الميكروفون شغال</div>
<main class="content">
<section class="card roomCard"><div class="roomSelector" onclick="openRooms()"><div class="selTop"><span>★</span><span id="currentRoomName">غرفة خاصة</span></div><div id="membersCount">أعضاء (0)</div><div id="myIdTag" class="adminTag hidden"><span>تعريفك:</span><b id="myAdminIdValue">--</b></div></div><div class="waveCenter"><div>الموجة الحالية</div><div class="waveNav"><button onclick="prevRoom()">❮</button><div class="waveCode" id="roomCodeDisplay">7F3A</div><button onclick="nextRoom()">❯</button></div></div><div class="statusCol"><div class="sItem"><b>🔋</b><strong id="batteryValue">14%</strong><span>البطارية</span></div><div class="sItem"><b>📶</b><strong>4G</strong></div><div class="sItem"><b>☁️</b><strong id="liveStatus">غير متصل</strong></div></div></section>
<section class="card voiceCard"><div class="vSide"><span>🔊</span><div><b style="font-size:10px">الصوت الطبيعي</b><small id="naturalState" style="font-size:8px">مفعل</small></div><div class="toggle active" id="naturalToggle"><i></i></div></div><div class="pttWrap"><button class="pttBtn" id="pttButton"><span style="font-size:28px">🎙️</span><span id="pttText" style="font-size:10px;font-weight:800">اضغط للتحدث</span></button><div class="waves" id="waveMeter"><span></span><span></span><span></span><span></span></div></div><div class="vSide"><span>📡</span><div><b style="font-size:10px">الصوت اللاسلكي</b><small id="radioState" style="font-size:8px">متوقف</small></div><div class="toggle" id="radioToggle"><i></i></div></div></section>
</main>
</div>
<div class="toast hidden" id="toast"></div>
<div id="audioContainer" style="display:none"></div>
<script>
const API=location.origin;let deviceId=localStorage.getItem("deviceId")||null;let adminId=localStorage.getItem("adminId")||null;let currentRoom=null;let talking=false;const state={rooms:[]};const $=id=>document.getElementById(id);let livekitRoom=null;let isLivekitConnected=false;
function toastM(m){const e=$("toast");e.textContent=m;e.classList.remove("hidden");clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.add("hidden"),3000)}
async function registerDevice(){try{const res=await fetch(API+"/api/device",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({deviceId})});const data=await res.json();if(data.deviceId){deviceId=data.deviceId;adminId=data.adminId;localStorage.setItem("deviceId",deviceId);localStorage.setItem("adminId",adminId);$("myAdminIdValue").textContent=adminId;if(adminId)$("myIdTag").classList.remove("hidden")}}catch(e){}}
function updateRoomUI(){if(!currentRoom){$("currentRoomName").textContent="غرفة خاصة";$("roomCodeDisplay").textContent="7F3A";return}$("currentRoomName").textContent=currentRoom.name;$("roomCodeDisplay").textContent=currentRoom.roomCode}
async function loadRooms(){try{const res=await fetch(API+"/api/rooms",{headers:{"x-device-id":deviceId}});const data=await res.json();state.rooms=data.rooms||[];if(state.rooms.length&&!currentRoom){currentRoom=state.rooms[0];updateRoomUI()}}catch(e){}}
async function ensureLiveKitConnected(){if(!currentRoom){toastM("اختر غرفة أولا");return false}if(livekitRoom&&isLivekitConnected&&livekitRoom.name===currentRoom.id)return true;try{if(livekitRoom){await livekitRoom.disconnect()}livekitRoom=new LivekitClient.Room({adaptiveStream:true,dynacast:true});livekitRoom.on(LivekitClient.RoomEvent.TrackSubscribed,(track,pub,participant)=>{if(track.kind===LivekitClient.Track.Kind.Audio){const audioEl=track.attach();audioEl.autoplay=true;document.getElementById("audioContainer").appendChild(audioEl);toastM(`🔊 ${participant.identity} يتحدث`)}});const identity=(adminId||deviceId||"user").substring(0,20);const res=await fetch(`${API}/token?identity=${encodeURIComponent(identity)}&room=${encodeURIComponent(currentRoom.id)}&deviceId=${encodeURIComponent(deviceId||identity)}`);const data=await res.json();if(!res.ok||!data.token)throw new Error(data.error||"فشل");await livekitRoom.connect(data.url,data.token);isLivekitConnected=true;$("liveStatus").textContent="متصل";await livekitRoom.localParticipant.setMicrophoneEnabled(false);return true}catch(err){toastM("خطأ: "+err.message);return false}}
async function startTalking(e){if(e)e.preventDefault();if(talking)return;const connected=await ensureLiveKitConnected();if(!connected)return;try{talking=true;$("pttButton").classList.add("talking");$("pttText").textContent="جار التحدث...";$("waveMeter").classList.add("active");document.getElementById("audioIndicator").style.display="flex";await livekitRoom.localParticipant.setMicrophoneEnabled(true);if(navigator.vibrate)navigator.vibrate(50)}catch(err){toastM("فشل المايك");stopTalking()}}
async function stopTalking(e){if(e)e.preventDefault();if(!talking)return;talking=false;$("pttButton").classList.remove("talking");$("pttText").textContent="اضغط للتحدث";$("waveMeter").classList.remove("active");document.getElementById("audioIndicator").style.display="none";try{if(livekitRoom&&isLivekitConnected){await livekitRoom.localParticipant.setMicrophoneEnabled(false)}}catch(e){}if(navigator.vibrate)navigator.vibrate(30)}
const pttBtn=document.getElementById("pttButton");pttBtn.addEventListener("pointerdown",startTalking);pttBtn.addEventListener("pointerup",stopTalking);pttBtn.addEventListener("pointercancel",stopTalking);pttBtn.addEventListener("pointerleave",(e)=>{if(talking)stopTalking(e)});pttBtn.addEventListener("touchstart",(e)=>{e.preventDefault();startTalking(e)},{passive:false});pttBtn.addEventListener("touchend",(e)=>{e.preventDefault();stopTalking(e)},{passive:false});
async function init(){await registerDevice();await loadRooms()}init();
function openRooms(){/* نفس السابق */}function prevRoom(){}function nextRoom(){}
</script>
</body>
</html>
