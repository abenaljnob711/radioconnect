<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Radio Connect S458</title>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.15.3/dist/livekit-client.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;background:#020611;color:#fff;font-family:Arial}
body{position:fixed;width:100%;height:100vh;overflow:hidden}
.app{max-width:430px;height:100vh;margin:auto;background:#020611;display:flex;flex-direction:column}
.top{height:46px;display:flex;justify-content:space-between;align-items:center;padding:0 12px}
.pill{background:#0a1f2a;border:1px solid #1a4a3a;color:#2ee5a0;font-size:10px;padding:6px 12px;border-radius:20px}
.wave{margin:4px 10px;height:52px;background:#0a1420;border-radius:12px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;border:1px solid rgba(255,255,255,.05)}
.modes{margin:6px 10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modes button{height:42px;border-radius:10px;background:#0a1420;border:1px solid rgba(255,255,255,.06);color:#6a829a;font-size:11px}
.modes button.active{background:#123052;border-color:#2a6a9a;color:#5eb0ff}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dev{width:220px;height:395px;background:linear-gradient(180deg,#1d2835 0%,#111821 50%,#090d13 100%);border-radius:28px;border:2px solid #2e3d50;box-shadow:0 0 0 1px rgba(255,255,255,.06) inset,0 24px 60px rgba(0,0,0,.9);position:relative;display:flex;flex-direction:column;align-items:center;padding:20px 16px 16px;transition:.2s}
.dev:before{content:'';position:absolute;top:-54px;left:50%;transform:translateX(-50%);width:18px;height:58px;background:linear-gradient(#2a2a2a,#111);border-radius:10px 10px 0 0}
.screen{width:100%;height:84px;background:radial-gradient(ellipse at center,#0a2a32,#061a22 70%,#030f15);border:1px solid #143a4a;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 18px rgba(0,229,255,.2)}
.screen b{color:#d0f0ff;font-size:16px}.screen span{color:#7ac8d8;font-size:12px}.screen small{color:#3a4a5a;font-size:11px;margin-top:4px}
.knobs{display:flex;gap:20px;margin:16px 0 20px}.knobs i{width:20px;height:20px;background:radial-gradient(circle at 35% 35%,#4a5a6a,#121821);border-radius:50%;border:1px solid #222;display:block}
.ptt{width:120px;height:98px;background:linear-gradient(180deg,#1e2c3a,#121a24);border:1.5px solid #2e4054;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.08s;touch-action:none;user-select:none}
.ptt b{color:#00b7ff;font-size:22px;letter-spacing:2px}.ptt small{color:#5a6a7a;font-size:8px}.ptt:active{transform:scale(.95)}
.dev.tx{border-color:#3fa9ff;box-shadow:0 0 0 3px rgba(63,169,255,.15),0 0 45px rgba(63,169,255,.6),0 24px 60px #000}
.dev.rx{border-color:#ff3b30;box-shadow:0 0 0 3px rgba(255,59,48,.15),0 0 45px rgba(255,59,48,.6),0 24px 60px #000}
.ptt.tx{border-color:#3fa9ff;background:#14365a;box-shadow:0 0 20px #3fa9ff}.ptt.rx{border-color:#ff3b30;background:#3a1a1a;box-shadow:0 0 20px #ff3b30}
.side{position:absolute;right:-12px;top:124px;width:20px;height:80px;background:linear-gradient(90deg,#e52a1a,#7a0f0a);border-radius:0 9px 9px 0;display:flex;align-items:center;justify-content:center;box-shadow:2px 0 14px rgba(229,42,26,.5)}
.side span{writing-mode:vertical-rl;color:#fff;font-size:10px;font-weight:900}
.side.tx{background:linear-gradient(90deg,#3fa9ff,#0a4a8a)}.side.rx{background:linear-gradient(90deg,#ff3b30,#7a0f0a);animation:bl.6s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.6}}
.wavebar{display:flex;gap:4px;height:18px;margin-top:20px;align-items:center}.wavebar i{width:4px;height:10px;background:#3fa9ff;border-radius:2px;display:block}.wavebar.active i{animation:br.5s infinite ease-in-out}
@keyframes br{0%,100%{height:4px}50%{height:18px}}
.hint{font-size:11px;color:#4a5a6e;margin-top:10px}
</style>
<!-- الإضافة الوحيدة الجديدة - مقطعك -->
<audio id="beep" src="./walkie_beep.mp3" preload="auto"></audio>
</head>
<body>
<div class="app">
<div class="top"><div class="pill" id="conn">● متصل AES-256</div><div style="font-weight:800">Radio Connect <span style="color:#5a7a9a;font-size:11px">S458 • Q307 • CH07</span></div></div>
<div class="wave"><div style="width:34px;height:34px;border-radius:50%;background:#0e1e32;display:flex;align-items:center;justify-content:center" onclick="chg(-1)">‹</div><div style="text-align:center"><b id="wc">S458</b><div style="font-size:10px;color:#6a829a">موجة القيادة</div></div><div style="width:34px;height:34px;border-radius:50%;background:#0e1e32;display:flex;align-items:center;justify-content:center" onclick="chg(1)">›</div></div>
<div class="modes"><button id="bChat">🏠 محادثة الغرفة</button><button id="bWave" class="active">📻 الموجة المباشرة</button></div>
<div class="stage">
<div class="dev" id="dev"><div class="screen"><b id="dc">S458</b><span>CH 07 • 446.100 MHz</span><small id="ds">● جاهز</small></div><div class="knobs"><i></i><i></i></div><div class="ptt" id="ptt"><b>PTT</b><small>PRESS TO TALK</small></div><div class="side" id="side"><span>PTT</span></div></div>
<div class="wavebar" id="wb"><i></i><i></i><i></i></div>
<div class="hint" id="hint">اضغط مطولاً - صوت walkie_beep.mp3 الحقيقي</div>
</div>
</div>

<script>
// ==== الكود الأصلي بدون تغيير ====
let codes=[];for(let i=0;i<20;i++){let L=String.fromCharCode(65+Math.random()*26|0);codes.push(L+(100+Math.random()*900|0))}
let idx=0;function chg(d){idx=(idx+d+codes.length)%codes.length;let v=codes[idx];document.getElementById('wc').textContent=v;document.getElementById('dc').textContent=v;}

// ==== الإضافة الوحيدة: تشغيل walkie_beep.mp3 ====
const beep = document.getElementById('beep');
let audioUnlocked = false;
function unlockAudio(){
  if(audioUnlocked) return;
  beep.play().then(()=>{ beep.pause(); beep.currentTime=0; audioUnlocked=true; }).catch(()=>{});
}
document.addEventListener('pointerdown', unlockAudio, {once:true});
document.addEventListener('touchstart', unlockAudio, {once:true});

let isDown=false;
const devEl=document.getElementById('dev'), pttEl=document.getElementById('ptt'), sideEl=document.getElementById('side'), dsEl=document.getElementById('ds'), hintEl=document.getElementById('hint'), wbEl=document.getElementById('wb');

function txOn(){
  isDown=true; unlockAudio();
  devEl.className='dev tx'; pttEl.className='ptt tx'; sideEl.className='side tx';
  wbEl.className='wavebar active'; dsEl.textContent='🔵 TX ترسل الآن'; dsEl.style.color='#3fa9ff'; hintEl.textContent='🔵 جاري الإرسال...';
  if(navigator.vibrate) navigator.vibrate(25);
}
function txOff(){
  if(!isDown) return; isDown=false;
  // هنا يشتغل مقطعك الحقيقي
  beep.currentTime=0; beep.volume=0.9; beep.play().catch(()=>{});
  if(navigator.vibrate) navigator.vibrate([30,40,30]);
  devEl.className='dev'; pttEl.className='ptt'; sideEl.className='side';
  wbEl.className='wavebar'; dsEl.textContent='● جاهز'; dsEl.style.color=''; hintEl.textContent='اضغط مطولاً - صوت walkie_beep.mp3 الحقيقي';
}
function rxOn(){
  beep.currentTime=0; beep.play().catch(()=>{});
  devEl.className='dev rx'; pttEl.className='ptt rx'; sideEl.className='side rx';
  dsEl.textContent='🔴 RX من Q307'; dsEl.style.color='#ff3b30';
  if(navigator.vibrate) navigator.vibrate([80,40,80]);
  setTimeout(()=>{ devEl.className='dev'; pttEl.className='ptt'; sideEl.className='side'; dsEl.textContent='● جاهز'; dsEl.style.color=''; }, 2200);
}

pttEl.addEventListener('pointerdown', e=>{ e.preventDefault(); txOn(); });
window.addEventListener('pointerup', e=>{ if(isDown) txOff(); });
pttEl.addEventListener('touchstart', e=>{ e.preventDefault(); txOn(); }, {passive:false});
window.addEventListener('touchend', e=>{ if(isDown) txOff(); });
sideEl.addEventListener('pointerdown', e=>{ e.preventDefault(); txOn(); });
sideEl.addEventListener('pointerup', e=>{ if(isDown) txOff(); });
</script>
</body>
</html>
