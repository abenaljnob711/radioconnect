<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Radio Connect - Real TX</title>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.15.3/dist/livekit-client.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;background:#020611;color:#fff;font-family:Arial}body{position:fixed;width:100%;height:100vh;overflow:hidden}
.app{max-width:430px;height:100vh;margin:auto;background:#020611;display:flex;flex-direction:column}
.top{height:46px;display:flex;justify-content:space-between;align-items:center;padding:0 12px}
.pill{background:#0a1f2a;border:1px solid #1a4a3a;color:#2ee5a0;font-size:10px;padding:6px 12px;border-radius:20px}
.wave{margin:4px 10px;height:52px;background:#0a1420;border-radius:12px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;border:1px solid rgba(255,255,255,.05)}
.modes{margin:6px 10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modes button{height:42px;border-radius:10px;background:#0a1420;border:1px solid rgba(255,255,255,.06);color:#6a829a;font-size:11px}
.modes button.active{background:#123052;border-color:#2a6a9a;color:#5eb0ff}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dev{width:220px;height:395px;background:linear-gradient(180deg,#1d2835 0%,#111821 50%,#090d13 100%);border-radius:28px;border:2px solid #2e3d50;box-shadow:0 0 0 1px rgba(255,255,255,.06) inset,0 24px 60px rgba(0,0,0,.9);position:relative;display:flex;flex-direction:column;align-items:center;padding:20px 16px 16px;transition:.2s}
.dev:before{content:'';position:absolute;top:-54px;left:50%;transform:translateX(-50%);width:18px;height:58px;background:linear-gradient(#2a2a2a,#111);border-radius:10px 10px 0 0}
.screen{width:100%;height:84px;background:radial-gradient(ellipse at center,#0a2a32,#061a22 70%,#030f15);border:1px solid #143a4a;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 18px rgba(0,229,255,.2)}
.screen b{color:#d0f0ff;font-size:16px}.screen span{color:#7ac8d8;font-size:12px}.screen small{color:#3a4a5a;font-size:11px;margin-top:4px}
.knobs{display:flex;gap:20px;margin:16px 0 20px}.knobs i{width:20px;height:20px;background:radial-gradient(circle at 35% 35%,#4a5a6a,#121821);border-radius:50%;border:1px solid #222;display:block}
.ptt{width:120px;height:98px;background:linear-gradient(180deg,#1e2c3a,#121a24);border:1.5px solid #2e4054;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.08s;touch-action:none;user-select:none}
.ptt b{color:#00b7ff;font-size:22px;letter-spacing:2px}.ptt small{color:#5a6a7a;font-size:8px}.ptt:active{transform:scale(.95)}
.dev.tx{border-color:#3fa9ff;box-shadow:0 0 0 3px rgba(63,169,255,.15),0 0 45px rgba(63,169,255,.6),0 24px 60px #000}
.dev.rx{border-color:#ff3b30;box-shadow:0 0 0 3px rgba(255,59,48,.15),0 0 45px rgba(255,59,48,.6),0 24px 60px #000}
.ptt.tx{border-color:#3fa9ff;background:#14365a;box-shadow:0 0 20px #3fa9ff}.ptt.rx{border-color:#ff3b30;background:#3a1a1a;box-shadow:0 0 20px #ff3b30}
.side{position:absolute;right:-12px;top:124px;width:20px;height:80px;background:linear-gradient(90deg,#e52a1a,#7a0f0a);border-radius:0 9px 9px 0;display:flex;align-items:center;justify-content:center;box-shadow:2px 0 14px rgba(229,42,26,.5)}
.side span{writing-mode:vertical-rl;color:#fff;font-size:10px;font-weight:900}
.side.tx{background:linear-gradient(90deg,#3fa9ff,#0a4a8a)}.side.rx{background:linear-gradient(90deg,#ff3b30,#7a0f0a);animation:bl.6s infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.6}}
.wavebar{display:flex;gap:4px;height:18px;margin-top:20px;align-items:center}.wavebar i{width:4px;height:10px;background:#3fa9ff;border-radius:2px;display:block}.wavebar.active i{animation:br.5s infinite ease-in-out}
@keyframes br{0%,100%{height:4px}50%{height:18px}}
.hint{font-size:11px;color:#4a5a6e;margin-top:10px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#0a1f2a;border:1px solid #1e6a8a;color:#fff;padding:8px 14px;border-radius:20px;font-size:11px;opacity:0;transition:.3s;z-index:99}.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
<div class="top"><div class="pill" id="conn">● جاري الاتصال...</div><div style="font-weight:800">Radio Connect <span style="color:#5a7a9a;font-size:11px" id="roomInfo">S458 • Q307</span></div></div>
<div class="wave"><div style="width:34px;height:34px;border-radius:50%;background:#0e1e32;display:flex;align-items:center;justify-content:center" onclick="chg(-1)">‹</div><div style="text-align:center"><b id="wc">S458</b><div style="font-size:10px;color:#6a829a" id="wn">موجة القيادة</div></div><div style="width:34px;height:34px;border-radius:50%;background:#0e1e32;display:flex;align-items:center;justify-content:center" onclick="chg(1)">›</div></div>
<div class="modes"><button id="bChat" onclick="setM('chat')">🏠 محادثة الغرفة</button><button id="bWave" class="active" onclick="setM('wave')">📻 الموجة المباشرة</button></div>
<div class="stage" id="vWave">
<div class="dev" id="dev"><div class="screen"><b id="dc">S458</b><span>CH 07 • 446.100 MHz</span><small id="ds">● جاهز</small></div><div class="knobs"><i></i><i></i></div><div class="ptt" id="ptt"><b>PTT</b><small>PRESS TO TALK</small></div><div class="side" id="side"><span>PTT</span></div></div>
<div class="wavebar" id="wb"><i></i><i></i><i></i><i></i><i></i></div>
<div class="hint" id="hint">اضغط مطولاً - صوت حقيقي + لاسلكي</div>
</div>
</div>
<div class="toast" id="toast"></div>

<script>
// ===== 1. إعداد LiveKit - غيّر هذا الرابط لرابط سيرفرك =====
const LIVEKIT_URL = "wss://your-livekit-url"; // ← حط رابط سيرفرك هنا
let room = null, isConnected = false;

// ===== 2. أصوات اللاسلكي الحقيقي =====
let audioCtx=null, noiseNode=null;
function getCtx(){if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); return audioCtx;}
function pttClick(){let c=getCtx(),o=c.createOscillator(),g=c.createGain(); o.frequency.value=1400; g.gain.setValueAtTime(0.28,c.currentTime); g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.06); o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+0.06);}
function startHiss(){let c=getCtx(),sz=c.sampleRate*1.5,b=c.createBuffer(1,sz,c.sampleRate),d=b.getChannelData(0); for(let i=0;i<sz;i++) d[i]=(Math.random()*2-1)*0.4; let s=c.createBufferSource(); s.buffer=b; s.loop=true; let f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1900; let g=c.createGain(); g.gain.value=0.018; s.connect(f); f.connect(g); g.connect(c.destination); s.start(); noiseNode=s;}
function stopHiss(){if(noiseNode){try{noiseNode.stop()}catch(e){} noiseNode=null;}}
function rogerBeep(){let c=getCtx(); [0,0.14].forEach(dl=>{let o=c.createOscillator(),g=c.createGain(); o.frequency.value=1100; let t=c.currentTime+dl; g.gain.setValueAtTime(0.32,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.16); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+0.16);}); if(navigator.vibrate) navigator.vibrate([30,40,30]);}
function rxBeep(){let c=getCtx(); [850,1100].forEach((f,i)=>{let o=c.createOscillator(),g=c.createGain(); o.frequency.value=f; let t=c.currentTime+i*0.13; g.gain.setValueAtTime(0.28,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.13); o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+0.13);});}

// ===== 3. الاتصال بالغرفة =====
async function connectRoom(){
  try{
    // إذا ما عندك سيرفر LiveKit الآن، خليه محاكاة فقط - بيشتغل الصوت بدون سيرفر
    if(LIVEKIT_URL.includes("your-livekit")){
      document.getElementById('conn').textContent='● محاكاة - بدون سيرفر';
      document.getElementById('conn').style.background='#0a1f2a';
      isConnected=true; return;
    }
    room = new LivekitClient.Room();
    // جيب التوكن من سيرفرك
    let token = await fetch("/getToken?room=Q307&user=S458").then(r=>r.text());
    await room.connect(LIVEKIT_URL, token);
    await room.localParticipant.setMicrophoneEnabled(false); // مقفل لحد ما تضغط PTT
    isConnected=true;
    document.getElementById('conn').textContent='● متصل AES-256';

    // لما Q307 يتكلم - يضيء أحمر RX
    room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, pub, participant)=>{
      if(track.kind==='audio'){
        let el = track.attach(); document.body.appendChild(el); el.style.display='none';
        track.on(LivekitClient.TrackEvent.Muted, ()=>{});
        // أول ما يبدأ يتكلم
        participant.on(LivekitClient.ParticipantEvent.IsSpeakingChanged, speaking=>{
          if(speaking) rxOn();
        });
      }
    });
  }catch(e){
    document.getElementById('conn').textContent='● محاكاة - '+e.message;
    isConnected=true;
  }
}
connectRoom();

// ===== 4. التحكم في PTT مع إرسال حقيقي =====
let codes=[];for(let i=0;i<20;i++){let L=String.fromCharCode(65+Math.random()*26|0);codes.push(L+(100+Math.random()*900|0))}
let idx=0;function chg(d){idx=(idx+d+codes.length)%codes.length;let v=codes[idx];document.getElementById('wc').textContent=v;document.getElementById('dc').textContent=v;}
function setM(m){document.getElementById('bWave').classList.toggle('active',m==='wave');document.getElementById('bChat').classList.toggle('active',m==='chat');}

let isDown=false;const dev=document.getElementById('dev'),ptt=document.getElementById('ptt'),side=document.getElementById('side'),wb=document.getElementById('wb'),ds=document.getElementById('ds'),hint=document.getElementById('hint');

async function txOn(){
  pttClick(); setTimeout(()=>startHiss(),70);
  dev.className='dev tx'; ptt.className='ptt tx'; side.className='side tx'; wb.className='wavebar active';
  wb.querySelectorAll('i').forEach(i=>i.style.background='#3fa9ff');
  ds.textContent='🔵 TX ترسل الآن - صوتك يرسل'; ds.style.color='#3fa9ff';
  hint.textContent='🔵 جاري الإرسال الحقيقي...';
  if(navigator.vibrate) navigator.vibrate(25);
  // ** هنا الإرسال الحقيقي **
  if(room && isConnected){ try{ await room.localParticipant.setMicrophoneEnabled(true); }catch(e){} }
}

async function txOff(){
  stopHiss(); rogerBeep();
  dev.className='dev'; ptt.className='ptt'; side.className='side'; wb.className='wavebar';
  ds.textContent='● جاهز'; ds.style.color=''; hint.textContent='اضغط مطولاً - صوت حقيقي + لاسلكي';
  // ** قفل المايك **
  if(room && isConnected){ try{ await room.localParticipant.setMicrophoneEnabled(false); }catch(e){} }
}

function rxOn(){
  rxBeep(); dev.className='dev rx'; ptt.className='ptt rx'; side.className='side rx'; wb.className='wavebar active';
  wb.querySelectorAll('i').forEach(i=>i.style.background='#ff3b30');
  ds.textContent='🔴 RX من Q307 - يتكلم الآن'; ds.style.color='#ff3b30';
  hint.textContent='🔴 Q307 يرسل...'; if(navigator.vibrate) navigator.vibrate([80,40,80]);
  setTimeout(()=>{dev.className='dev'; ptt.className='ptt'; side.className='side'; wb.className='wavebar'; wb.querySelectorAll('i').forEach(i=>i.style.background='#3fa9ff'); ds.textContent='● جاهز'; ds.style.color=''; hint.textContent='اضغط مطولاً - صوت حقيقي + لاسلكي';},2500);
}

ptt.addEventListener('pointerdown',e=>{e.preventDefault(); if(isDown) return; isDown=true; txOn();});
window.addEventListener('pointerup',e=>{if(isDown){isDown=false; txOff();}});
ptt.addEventListener('touchstart',e=>{e.preventDefault(); if(isDown) return; isDown=true; txOn();},{passive:false});
window.addEventListener('touchend',e=>{if(isDown){isDown=false; txOff();}});
side.addEventListener('pointerdown',e=>{e.preventDefault(); if(isDown) return; isDown=true; txOn();});
side.addEventListener('pointerup',e=>{if(isDown){isDown=false; txOff();}});

// محاكاة إذا ما عندك سيرفر
setInterval(()=>{if(!isDown &&!LIVEKIT_URL.includes("your-livekit-url")===false && Math.random()>0.6) rxOn();},8000);

function toast(m){let t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500);}
</script>
</body>
</html>
