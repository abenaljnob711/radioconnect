<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Radio Connect - Tactical Device</title>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.15.3/dist/livekit-client.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#01040a;color:#fff;font-family:Arial,sans-serif;position:fixed;width:100%;height:100vh;overflow:hidden}
.app{max-width:520px;height:100vh;margin:auto;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 0%,#0f2035,#02050a)}
.topbar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid rgba(0,229,255,.15)}
.topbar strong{font-size:14px}.topbar span{font-size:9px;color:#5eb0ff}
.status{font-size:10px;background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.2);padding:4px 10px;border-radius:20px;color:#00e5ff}
.main{flex:1;display:flex;flex-direction:column;padding:8px;overflow:hidden}
.wave-bar{display:flex;justify-content:space-between;align-items:center;background:#0b1c2d;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:8px 12px;margin-bottom:8px}
.wave-bar.code{font-family:monospace;font-size:22px;font-weight:900;letter-spacing:2px;color:#fff;text-shadow:0 0 10px #00e5ff}
.arrow{width:32px;height:32px;border-radius:50%;background:#0c2942;border:1px solid #3fa9ff;color:#fff}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
.mode button{padding:10px;border-radius:10px;background:#071521;border:1px solid rgba(255,255,255,.08);color:#8ab4dc;font-size:10px;font-weight:800}
.mode button.active{background:linear-gradient(145deg,#0b3a5e,#08253d);border-color:#3fa9ff;color:#fff;box-shadow:0 0 12px rgba(63,169,255,.3)}
/* RADIO DEVICE */
.radio-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.device{width:168px;height:312px;background:linear-gradient(180deg,#222830,#0f1318);border-radius:24px;border:2px solid #2a3441;box-shadow:0 20px 50px #000,inset 0 1px rgba(255,255,255,.15);display:flex;flex-direction:column;align-items:center;padding:14px 12px;position:relative;transition:.25s}
.device.tx{border-color:#3fa9ff;box-shadow:0 0 0 4px rgba(63,169,255,.2),0 0 35px #3fa9ff,0 20px 50px #000}
.device.rx{border-color:#ff3b30;box-shadow:0 0 0 4px rgba(255,59,48,.2),0 0 35px #ff3b30,0 20px 50px #000}
.antenna{width:14px;height:52px;background:linear-gradient(#333,#111);border-radius:8px 8px 0 0;margin-bottom:6px}
.screen{width:100%;height:74px;background:radial-gradient(#001a22,#000b0f);border:1px solid #0f3a4a;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 15px rgba(0,229,255,.2);margin-bottom:14px}
.screen.ch{font-family:monospace;font-size:26px;font-weight:900;color:#00e5ff;letter-spacing:3px;text-shadow:0 0 12px #00e5ff}
.screen.fr{font-size:9px;color:#5ab0c0}.screen.st{font-size:8px;font-weight:800;margin-top:3px}
.st.tx{color:#3fa9ff}.st.rx{color:#ff3b30}.st.idle{color:#4a5a6a}
.knobs{display:flex;gap:18px;margin-bottom:16px}.knob{width:18px;height:18px;background:radial-gradient(at 30% 30%,#444,#111);border-radius:50%;border:1px solid #333}
.ptt-main{width:88px;height:88px;border-radius:18px;background:linear-gradient(145deg,#1e2a36,#0d131a);border:2px solid #2a3a4a;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:.12s}
.ptt-main:active{transform:scale(.94)}.ptt-main.tx{border-color:#3fa9ff;box-shadow:0 0 20px #3fa9ff}.ptt-main.rx{border-color:#ff3b30;box-shadow:0 0 20px #ff3b30}
.ptt-main b{font-size:20px;color:#5eb0ff;letter-spacing:2px}.ptt-main.rx b{color:#ff6b60}.ptt-main small{font-size:7px;color:#7a8a9a}
.side-ptt{position:absolute;right:-14px;top:110px;width:14px;height:84px;background:linear-gradient(90deg,#ff2a1a,#7a0f0a);border-radius:0 7px 7px 0;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:3px 0 12px rgba(255,0,0,.4)}
.side-ptt span{writing-mode:vertical-rl;font-size:8px;font-weight:900;color:#fff}.side-ptt.tx{background:linear-gradient(90deg,#3fa9ff,#0a4a8a);box-shadow:0 0 12px #3fa9ff}.side-ptt.rx{background:linear-gradient(90deg,#ff3b30,#8a0f0a);animation:blink.6s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.6}}
.waveform{display:flex;gap:3px;height:20px;margin-top:14px}.waveform i{width:4px;background:#3fa9ff;border-radius:2px}.waveform.rx i{background:#ff3b30}.waveform.active i{animation:bar.5s infinite ease-in-out}
@keyframes bar{0%,100%{height:4px}50%{height:18px}}
.hint{font-size:10px;color:#6a829a;margin-top:10px;font-weight:700}
/* CHAT */
.chat{flex:1;display:none;flex-direction:column;background:linear-gradient(180deg,#071725,#030a11);border:1px solid rgba(255,255,255,.07);border-radius:14px;overflow:hidden}.chat.show{display:flex}
.chat-head{height:38px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;background:#081a29;border-bottom:1px solid rgba(0,229,255,.15);font-size:10px;font-weight:900}
.msgs{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.bubble{max-width:85%;padding:8px 10px;border-radius:14px;font-size:11px;line-height:1.5}
.bubble.mine{align-self:flex-start;background:linear-gradient(145deg,#0d4a73,#083659);border:1px solid rgba(63,169,255,.35)}
.bubble.other{align-self:flex-end;background:linear-gradient(145deg,#2a1212,#1a0808);border:1px solid rgba(255,59,48,.25)}
.bubble.meta{font-size:7px;opacity:.7;margin-top:4px;display:flex;gap:6px}
.log{font-family:monospace;font-size:7px;color:#445c6e;background:#07131e;padding:3px 8px;border-radius:10px;align-self:center}
.input-row{height:54px;display:flex;align-items:center;gap:6px;padding:6px 8px;background:#040b12;border-top:1px solid rgba(255,255,255,.08)}
.input-row input{flex:1;height:36px;background:#07131e;border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:0 12px;color:#fff;font-size:12px;outline:none}
.icon{width:36px;height:36px;border-radius:50%;background:#0b1d2d;border:1px solid rgba(255,255,255,.1);color:#8ab4dc;display:flex;align-items:center;justify-content:center}
.send{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#1594ff,#0757d8);color:#fff;display:none;align-items:center;justify-content:center}.send.show{display:flex}
.toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:#0b2033;border:1px solid #3fa9ff;color:#fff;padding:8px 14px;border-radius:14px;font-size:10px;opacity:0;transition:.3s;z-index:999}.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <div class="topbar"><div><strong>Radio Connect</strong><span id="roomLabel">S458 • Q307 • CH 07</span></div><div class="status" id="status">● متصل AES-256</div></div>
  <div class="main">
    <div class="wave-bar"><button class="arrow" onclick="changeWave(-1)">‹</button><div style="text-align:center"><div class="code" id="waveCode">S458</div><div style="font-size:10px;color:#8ab4dc" id="waveName">موجة القيادة</div></div><button class="arrow" onclick="changeWave(1)">›</button></div>
    <div class="mode"><button class="active" id="btnWave" onclick="setMode('wave')">📻 الموجة المباشرة</button><button id="btnRoom" onclick="setMode('room')">🏠 محادثة الغرفة</button></div>

    <div class="radio-stage" id="radioStage">
      <div class="device" id="device">
        <div class="antenna"></div>
        <div class="screen"><div class="ch" id="devCh">S458</div><div class="fr">CH 07 • 446.100 MHz</div><div class="st idle" id="devSt">● جاهز للإرسال</div></div>
        <div class="knobs"><div class="knob"></div><div class="knob"></div></div>
        <div class="ptt-main" id="pttMain"><b>PTT</b><small>PRESS TO TALK</small></div>
        <div class="side-ptt" id="sidePtt"><span>PTT</span></div>
      </div>
      <div class="waveform" id="waveform"><i style="height:5px"></i><i style="height:9px"></i><i style="height:14px"></i><i style="height:9px"></i><i style="height:5px"></i></div>
      <div class="hint" id="hint">اضغط مطولاً على PTT - أزرق TX / أحمر RX</div>
    </div>

    <div class="chat" id="chatBox">
      <div class="chat-head"><span>💬 محادثة الغرفة Q307</span><span style="color:#46d879">● مشفر</span></div>
      <div class="msgs" id="msgs"><div style="text-align:center;color:#536a80;font-size:10px;padding:20px">🔵 TX إرسالك - 🔴 RX استقبال<br>السجل التكتيكي</div></div>
      <div class="input-row"><div class="icon">🎙️</div><input id="inp" placeholder="اكتب رسالة..." oninput="onInp()" onkeydown="if(event.key==='Enter')sendMsg()"><div class="send" id="sendBtn" onclick="sendMsg()">➤</div></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
let waveIdx=0,waves=[],mode='wave',isTx=false,audioCtx=null;
const NAMES=["موجة القيادة","موجة العمليات","موجة الطوارئ","موجة المساندة","موجة الاستطلاع","موجة الإمداد","موجة الاتصال","موجة الدعم"];
for(let i=0;i<30;i++){let l=String.fromCharCode(65+Math.floor(Math.random()*26));let n=Math.floor(100+Math.random()*900);waves.push({code:l+n,name:(NAMES[i]||'موجة '+(i+1))})}
let cur=waves[0];
function beep(f,d){try{if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended') audioCtx.resume();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=f;g.gain.setValueAtTime(.2,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}catch(e){}}
function toast(m){let t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
function setMode(m){mode=m;$('btnWave').classList.toggle('active',m==='wave');$('btnRoom').classList.toggle('active',m==='room');$('radioStage').style.display=m==='wave'?'flex':'none';$('chatBox').classList.toggle('show',m==='room')}
function changeWave(d){waveIdx=(waveIdx+d+waves.length)%waves.length;cur=waves[waveIdx];$('waveCode').textContent=cur.code;$('devCh').textContent=cur.code;$('waveName').textContent=cur.name;toast('📻 '+cur.code)}
function setTx(on){let dev=$('device'),st=$('devSt'),side=$('sidePtt'),main=$('pttMain'),wf=$('waveform'),hint=$('hint');if(on){dev.className='device tx';side.className='side-ptt tx';main.className='ptt-main tx';wf.className='waveform active';st.textContent='🔵 TX - ترسل الآن';st.className='st tx';hint.textContent='🔵 جاري الإرسال...';beep(1500,.06)}else{dev.className='device';side.className='side-ptt';main.className='ptt-main';wf.className='waveform';st.textContent='● جاهز';st.className='st idle';hint.textContent='اضغط مطولاً على PTT';beep(900,.1)}}
function setRx(on){let dev=$('device'),st=$('devSt'),side=$('sidePtt'),main=$('pttMain'),wf=$('waveform');if(on){dev.className='device rx';side.className='side-ptt rx';main.className='ptt-main rx';wf.className='waveform rx active';st.textContent='🔴 RX - من Q307';st.className='st rx';beep(1100,.12);setTimeout(()=>beep(1100,.12),140);if(navigator.vibrate) navigator.vibrate([80,40,80]);setTimeout(()=>setRx(false),2500)}else{dev.className='device';side.className='side-ptt';main.className='ptt-main';wf.className='waveform';st.textContent='● جاهز';st.className='st idle'}}
let ptt=$('pttMain'),side=$('sidePtt');
function startTx(e){e.preventDefault();if(isTx) return;isTx=true;setTx(true)}
function endTx(e){e.preventDefault();if(!isTx) return;isTx=false;setTx(false)}
;[ptt,side].forEach(el=>{el.addEventListener('pointerdown',startTx);el.addEventListener('pointerup',endTx);el.addEventListener('pointercancel',endTx);el.addEventListener('touchstart',startTx,{passive:false});el.addEventListener('touchend',endTx,{passive:false})})
function onInp(){$('sendBtn').classList.toggle('show',$('inp').value.trim().length>0)}
function addMsg(t,mine){let c=$('msgs');if(c.innerHTML.includes('🔵 TX')) c.innerHTML='';let d=document.createElement('div');d.className='bubble '+(mine?'mine':'other');d.innerHTML=t+'<div class="meta"><span>'+new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})+'</span><span>'+(mine?'🔵 TX S458':'🔴 RX Q307')+'</span></div>';c.appendChild(d);c.scrollTop=c.scrollHeight;if(!mine) setRx(true)}
function sendMsg(){let i=$('inp');let t=i.value.trim();if(!t) return;addMsg(t,true);i.value='';onInp();setTimeout(()=>addMsg('مستلم. سأتحرك لنقطة المراقبة الشمالية. لا يوجد نشاط.',false),1000)}
</script>
</body>
</html>
