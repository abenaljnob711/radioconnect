<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>جهاز لاسلكي - Radio Connect</title>
  <script src="https://unpkg.com/livekit-client@2.15.3/dist/livekit-client.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: 0; min-height: 100vh;
      background: #050b14; color: #edf5ff;
      font-family: Arial, "Noto Sans Arabic", sans-serif;
      display: flex; justify-content: center; align-items: center;
    }
    .app {
      width: 100%; max-width: 520px; height: 100vh;
      background: linear-gradient(180deg, #07111f 0%, #050a13 100%);
      display: flex; flex-direction: column; position: relative; overflow: hidden;
    }
    /* الهيدر العلوي */
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 16px; background: rgba(5,11,20,.95);
      border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand-icon {
      width: 40px; height: 40px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center; font-size: 20px;
      background: linear-gradient(145deg, #12345d, #071321);
      border: 1px solid rgba(64,163,255,.25);
    }
    .connection {
      display: flex; align-items: center; gap: 6px; padding: 6px 10px;
      border-radius: 10px; background: #0b1726; font-size: 11px; color: #91a6bd;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #ff5267; }
    .dot.ok { background: #29d17d; box-shadow: 0 0 8px rgba(41,209,125,.6); }

    /* محتوى الغرفة والصوت */
    .content { flex: 1; display: flex; flex-direction: column; padding: 20px; justify-content: space-between; }
    .room-info-card {
      background: #102137; border-radius: 16px; padding: 15px; text-align: center;
      border: 1px solid rgba(255,255,255,.06);
    }
    .room-name { font-size: 18px; font-weight: bold; margin-bottom: 4px; }
    .room-code { color: #3498db; font-size: 12px; font-family: monospace; }

    /* زر التحدث PTT (أحمر يتحول لأزرق عند الضغط) */
    .ptt-container { display: flex; flex-direction: column; align-items: center; justify-content: center; margin: auto 0; }
    .ptt-btn {
      width: 170px; height: 170px; border-radius: 50%; color: white;
      font-size: 16px; font-weight: bold;
      background: radial-gradient(circle, #e74c3c 0%, #990000 100%);
      border: 6px solid #1d3557;
      box-shadow: 0 0 25px rgba(231, 76, 60, 0.4);
      cursor: pointer; display: flex; flex-direction: column;
      align-items: center; justify-content: center; transition: 0.1s;
      touch-action: none; user-select: none;
    }
    .ptt-btn span { font-size: 36px; margin-bottom: 6px; }
    .ptt-btn.active {
      transform: scale(0.95);
      background: radial-gradient(circle, #3498db 0%, #1d6fa5 100%);
      box-shadow: 0 0 35px rgba(52, 152, 219, 0.7);
    }
    .ptt-status { margin-top: 15px; color: #738aa2; font-size: 12px; }
    .ptt-status.talking { color: #3498db; font-weight: bold; }

    /* شريط المحادثة السفلي */
    .chat-box {
      background: #0b1726; border-radius: 14px; padding: 10px;
      display: flex; gap: 8px; border: 1px solid rgba(255,255,255,.06);
    }
    .chat-input {
      flex: 1; background: transparent; border: none; color: #fff; outline: none; font-size: 13px; padding: 0 5px;
    }
    .send-btn {
      background: #086dd7; color: #fff; padding: 8px 14px; border-radius: 10px; font-size: 12px;
    }
  </style>
</head>
<body>

<div class="app">
  <!-- الهيدر العلوي -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">📡</div>
      <div>
        <div style="font-size: 16px; font-weight: bold;">جهاز لاسلكي</div>
        <div style="font-size: 10px; color: #7f95ad;">اتصال صوتي فوري</div>
      </div>
    </div>
    <div class="connection">
      <span id="netDot" class="dot"></span>
      <span id="netText">غير متصل</span>
    </div>
  </header>

  <!-- المحتوى الرئيسي للغرفة والصوت -->
  <div class="content">
    <div class="room-info-card">
      <div class="room-name">غرفة العمليات</div>
      <div class="room-code">7F3A - موجة 1</div>
    </div>

    <div class="ptt-container">
      <button id="pttButton" class="ptt-btn" type="button">
        <span>🎙</span>اضغط للتحدث
      </button>
      <div id="pttStatus" class="ptt-status">اضغط باستمرار للتحدث واترك الزر للاستماع</div>
    </div>

    <div class="chat-box">
      <input type="text" id="chatInput" class="chat-input" placeholder="اكتب رسالة سريعة...">
      <button class="send-btn" onclick="sendQuickMessage()">إرسال</button>
    </div>
  </div>
</div>

<script>
  "use strict";

  // معرّف الجهاز المخفي والثابت في الذاكرة المحلية
  const deviceId = localStorage.getItem("radioDeviceId") || "dev_" + Math.random().toString(36).substr(2, 9);
  localStorage.setItem("radioDeviceId", deviceId);

  const activeRoomId = "default-operations-room";
  let livekitRoom = null;
  let localAudioTrack = null;
  let isTalking = false;

  const pttButton = document.getElementById("pttButton");
  const netDot = document.getElementById("netDot");
  const netText = document.getElementById("netText");
  const pttStatus = document.getElementById("pttStatus");

  function setStatus(connected, text) {
    netDot.className = "dot " + (connected ? "ok" : "");
    netText.textContent = text;
  }

  // اتصال سريع وفوري بـ LiveKit
  async function connectLiveKit() {
    if (livekitRoom && livekitRoom.state === "connected") return;
    try {
      setStatus(false, "جاري الاتصال...");
      const response = await fetch(`/token?room=${encodeURIComponent(activeRoomId)}`, {
        headers: { 'x-device-id': deviceId }
      });
      const data = await response.json();
      const wsUrl = data.url || 'wss://radioconnect-8uyh53qc.livekit.cloud';

      livekitRoom = new window.LivekitClient.Room({
        adaptiveStream: true,
        dynacast: true,
        publishDefaults: { audioPreset: window.LivekitClient.AudioPresets.speech }
      });

      livekitRoom.on(window.LivekitClient.RoomEvent.TrackSubscribed, track => {
        if (track.kind === window.LivekitClient.Track.Kind.Audio) {
          const audio = track.attach();
          audio.autoplay = true;
          document.body.appendChild(audio);
        }
      });

      await livekitRoom.connect(wsUrl, data.token);
      setStatus(true, "متصل");
    } catch (err) {
      setStatus(false, "خطأ بالاتصال");
    }
  }

  // تفعيل التحدث بأقصى سرعة عند الضغط على زر PTT
  async function startTalking(e) {
    if (e) e.preventDefault();
    if (isTalking) return;

    if (!livekitRoom || livekitRoom.state !== "connected") {
      await connectLiveKit();
    }

    try {
      isTalking = true;
      pttButton.classList.add("active");
      pttButton.innerHTML = "<span>🎙️</span>جاري التحدث";
      pttStatus.textContent = "🔴 أنت تتحدث الآن";
      pttStatus.classList.add("talking");

      const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
      localAudioTrack = new window.LivekitClient.LocalAudioTrack(stream.getAudioTracks()[0]);
      await localAudioTrack.enable();

      await livekitRoom.localParticipant.publishTrack(localAudioTrack, {
        name: 'radio-mic',
        source: window.LivekitClient.Track.Source.Microphone
      });
    } catch (err) {
      stopTalking();
    }
  }

  async function stopTalking(e) {
    if (e) e.preventDefault();
    if (!isTalking) return;
    isTalking = false;
    
    pttButton.classList.remove("active");
    pttButton.innerHTML = "<span>🎙</span>اضغط للتحدث";
    pttStatus.textContent = "اضغط باستمرار للتحدث واترك الزر للاستماع";
    pttStatus.classList.remove("talking");

    try {
      if (livekitRoom && localAudioTrack) {
        await livekitRoom.localParticipant.unpublishTrack(localAudioTrack);
      }
    } catch (err) {}

    if (localAudioTrack) {
      try { localAudioTrack.stop(); } catch (err) {}
      localAudioTrack = null;
    }
  }

  // ربط أحداث زر PTT باللمس والفأرة لضمان الاستجابة الفورية
  if (pttButton) {
    pttButton.addEventListener("pointerdown", startTalking);
    pttButton.addEventListener("pointerup", stopTalking);
    pttButton.addEventListener("pointercancel", stopTalking);
    pttButton.addEventListener("pointerleave", stopTalking);
  }

  async function sendQuickMessage() {
    const input = document.getElementById("chatInput");
    if (!input.value.trim()) return;
    if (!livekitRoom || livekitRoom.state !== "connected") {
      await connectLiveKit();
    }
    try {
      const payload = new TextEncoder().encode(JSON.stringify({ type: 'chat', text: input.value, deviceId }));
      await livekitRoom.localParticipant.publishData(payload, { reliable: true });
      input.value = "";
    } catch (err) {}
  }

  // بدء الاتصال فور التحميل
  connectLiveKit();
</script>
</body>
</html>
