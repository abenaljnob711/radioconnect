<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#05080c">
<title>Radio Connect — راديو كونكت</title>

<style>
/* =========================================================
   إعادة ضبط + متغيرات
   ========================================================= */
*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --bg: #05080c;
  --card: #0f1921;
  --card-2: #142028;
  --border: #1c2a36;
  --text: #e6f0f5;
  --text-dim: #6b8899;
  --cyan: #00e5ff;
  --cyan-dark: #008fa8;
  --green: #00ff88;
  --red: #ff2a4d;
  --red-dark: #b01530;
  --blue-msg: #1a4d6b;
  --blue-msg-2: #0f3550;
  --red-msg: #6b1220;
  --red-msg-2: #45080f;
  --purple: #8b5cf6;
  --radius: 14px;
}

html, body { height: 100%; overflow: hidden; background: var(--bg); }

body {
  font-family: 'Segoe UI', 'Tahoma', system-ui, -apple-system, sans-serif;
  color: var(--text);
  user-select: none;
  -webkit-user-select: none;
  position: relative;
}

body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(circle at 20% 20%, rgba(0,229,255,.06), transparent 45%),
    radial-gradient(circle at 80% 80%, rgba(0,255,136,.05), transparent 45%);
  pointer-events: none;
  z-index: 0;
}

.app {
  position: relative;
  z-index: 1;
  height: 100vh;
  display: flex;
  flex-direction: column;
  max-width: 500px;
  margin: 0 auto;
}

/* =========================================================
   الشاشات
   ========================================================= */
.screen {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  display: none;
  padding: 14px 14px 160px;
  animation: fadeIn .3s ease;
  scrollbar-width: none;
}
.screen::-webkit-scrollbar { display: none; }
.screen.active { display: block; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* =========================================================
   الترويسة
   ========================================================= */
.top-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 4px 14px;
}

.brand { display: flex; align-items: center; gap: 8px; }

.brand-icon {
  font-size: 26px;
  line-height: 1;
  filter: drop-shadow(0 0 8px rgba(0,229,255,.7));
  animation: iconPulse 2s ease-in-out infinite;
}

@keyframes iconPulse {
  0%, 100% { opacity: 1; }
  50%      { opacity: .65; }
}

.brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.brand-title {
  font-size: 19px;
  font-weight: 800;
  color: var(--cyan);
  letter-spacing: .3px;
  text-shadow: 0 0 14px rgba(0,229,255,.5);
}
.brand-sub {
  font-size: 11px;
  color: var(--text-dim);
  font-weight: 500;
}

.header-right {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px;
  color: var(--cyan);
  font-weight: 700;
}

/* زر ☰ */
.menu-toggle {
  width: 42px; height: 42px;
  border-radius: 11px;
  background: linear-gradient(180deg, var(--card-2), var(--card));
  border: 1px solid var(--border);
  color: var(--cyan);
  font-size: 22px;
  font-weight: 900;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all .2s;
  font-family: inherit;
  flex-shrink: 0;
  line-height: 1;
}
.menu-toggle:active {
  transform: scale(.94);
  border-color: var(--cyan);
  box-shadow: 0 0 14px rgba(0,229,255,.4);
}
.menu-toggle.open {
  background: linear-gradient(180deg, #00e5ff, #008fa8);
  color: #001418;
  border-color: var(--cyan);
  box-shadow: 0 0 18px rgba(0,229,255,.6);
}

/* =========================================================
   القائمة الجانبية
   ========================================================= */
.side-menu {
  position: fixed;
  top: 0; right: 0;
  height: 100vh;
  width: 280px;
  background: linear-gradient(180deg, var(--card-2), var(--bg));
  border-left: 1px solid var(--cyan);
  box-shadow: -12px 0 40px rgba(0,229,255,.25);
  z-index: 300;
  transform: translateX(110%);
  transition: transform .32s cubic-bezier(.4,0,.2,1);
  display: flex;
  flex-direction: column;
  padding: 20px 16px;
  overflow-y: auto;
  scrollbar-width: none;
}
.side-menu::-webkit-scrollbar { display: none; }
.side-menu.open { transform: translateX(0); }

.side-menu-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.7);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  z-index: 299;
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s;
}
.side-menu-backdrop.show {
  opacity: 1;
  pointer-events: auto;
}

.side-menu-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 16px;
}

.side-menu-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 16px;
  font-weight: 800;
  color: var(--cyan);
  text-shadow: 0 0 10px rgba(0,229,255,.5);
}
.side-menu-title .icon { font-size: 20px; }

.side-menu-close {
  width: 32px; height: 32px;
  border-radius: 8px;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: inherit;
}
.side-menu-close:active {
  border-color: var(--red);
  color: var(--red);
}

.menu-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 12px;
  background: linear-gradient(180deg, rgba(255,255,255,.02), transparent);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-bottom: 10px;
  color: var(--text);
  font-size: 13.5px;
  font-weight: 700;
  cursor: pointer;
  transition: all .2s;
  font-family: inherit;
  text-align: right;
  width: 100%;
}
.menu-item:active {
  transform: scale(.97);
  border-color: var(--cyan);
  box-shadow: 0 0 16px rgba(0,229,255,.3);
}

.menu-item .menu-icon {
  width: 40px; height: 40px;
  border-radius: 11px;
  background: rgba(0,229,255,.1);
  border: 1px solid rgba(0,229,255,.25);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 19px;
  flex-shrink: 0;
}
.menu-item .menu-text {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1;
}
.menu-item .menu-label {
  font-size: 13.5px;
  font-weight: 800;
  color: var(--text);
}
.menu-item .menu-desc {
  font-size: 10.5px;
  color: var(--text-dim);
  font-weight: 500;
}

.menu-item.primary {
  background: linear-gradient(180deg, rgba(0,229,255,.08), rgba(0,229,255,.02));
  border-color: rgba(0,229,255,.4);
}
.menu-item.primary .menu-icon {
  background: rgba(0,229,255,.2);
}

/* =========================================================
   شرائط الحالة
   ========================================================= */
.status-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 7px;
  margin-bottom: 14px;
}

.chip {
  background: linear-gradient(180deg, var(--card-2), var(--card));
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 9px 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  font-size: 10.5px;
  color: var(--text-dim);
  min-height: 54px;
  text-align: center;
}

.chip-value {
  font-size: 13px;
  font-weight: 800;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 4px;
}

.chip-value.online { color: var(--green); }

.chip-value.online::before {
  content: '';
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 8px var(--green);
  animation: dotPulse 1.5s ease-in-out infinite;
}

@keyframes dotPulse {
  0%, 100% { opacity: 1; }
  50%      { opacity: .35; }
}

.chip-label { font-size: 10px; color: var(--text-dim); }

/* 🆕 خانة رقم التعريف */
.chip-value.code {
  color: var(--cyan);
  font-family: 'Courier New', monospace;
  letter-spacing: 1px;
  font-size: 13px;
  font-weight: 900;
  text-shadow: 0 0 8px rgba(0,229,255,.6);
}

/* =========================================================
   جهاز الراديو
   ========================================================= */
.radio-stage {
  position: relative;
  height: 360px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 8px 0 16px;
}

.radio-device {
  position: relative;
  width: 210px;
  height: 320px;
  filter: drop-shadow(0 20px 40px rgba(0,0,0,.8))
          drop-shadow(0 0 30px rgba(0,229,255,.15));
}

.antenna {
  position: absolute;
  top: 0; right: 58px;
  width: 20px; height: 95px;
  background: linear-gradient(90deg, #0a0a0a, #2b2b2b 40%, #0a0a0a);
  border-radius: 10px 10px 3px 3px;
  box-shadow: inset -2px 0 3px rgba(0,0,0,.8);
}
.antenna::before {
  content: '';
  position: absolute;
  top: -8px; left: 50%;
  transform: translateX(-50%);
  width: 12px; height: 12px;
  background: #0a0a0a;
  border-radius: 50%;
  box-shadow: 0 0 6px rgba(0,229,255,.4);
}

.knobs {
  position: absolute;
  top: 88px; right: 18px;
  display: flex; gap: 20px;
}

.knob {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #4a4a4a, #0d0d0d);
  border: 2px solid #1c1c1c;
  box-shadow: 0 3px 6px rgba(0,0,0,.8), inset -2px -2px 4px rgba(0,0,0,.5);
  position: relative;
}
.knob::after {
  content: '';
  position: absolute;
  top: 3px; left: 50%;
  transform: translateX(-50%);
  width: 3px; height: 9px;
  background: #888;
  border-radius: 2px;
}

.body-main {
  position: absolute;
  top: 110px; left: 0; right: 0;
  height: 210px;
  background: linear-gradient(180deg, #1e1e1e, #0a0a0a);
  border-radius: 18px;
  border: 2px solid #0a0a0a;
  box-shadow:
    inset 0 2px 4px rgba(255,255,255,.06),
    inset 0 -4px 8px rgba(0,0,0,.7),
    0 10px 25px rgba(0,0,0,.7);
  overflow: hidden;
}
.body-main::before {
  content: '';
  position: absolute;
  inset: 6px;
  border-radius: 13px;
  border: 1px solid rgba(0,229,255,.08);
  pointer-events: none;
}

.lcd {
  position: absolute;
  top: 16px; left: 20px; right: 20px;
  height: 65px;
  background: #0a1a0f;
  border: 2px solid #050505;
  border-radius: 6px;
  box-shadow:
    inset 0 0 14px rgba(0,255,136,.18),
    inset 0 2px 4px rgba(0,0,0,.9),
    0 0 14px rgba(0,255,136,.15);
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 6px 10px;
  font-family: 'Courier New', monospace;
  color: var(--green);
  text-shadow: 0 0 7px rgba(0,255,136,.9);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .5px;
  line-height: 1.6;
}

.lcd-row {
  display: flex;
  justify-content: space-between;
  font-size: 11.5px;
}

.lcd-row .lcd-label { color: #00cc70; }

.side-btns {
  position: absolute;
  top: 92px; left: 12px; right: 12px;
  display: flex;
  justify-content: space-between;
  font-size: 8px;
  color: #666;
  letter-spacing: .5px;
  font-weight: 700;
}

.side-btn {
  padding: 2px 7px;
  background: #1a1a1a;
  border-radius: 4px;
  border: 1px solid #2a2a2a;
}

.speaker-grill {
  position: absolute;
  bottom: 14px; left: 24px; right: 24px;
  height: 46px;
  border-radius: 6px;
  background: repeating-linear-gradient(90deg,
    #050505 0, #050505 3px,
    #1a1a1a 3px, #1a1a1a 6px);
  box-shadow: inset 0 3px 6px rgba(0,0,0,.95);
}

.ptt-btn {
  position: absolute;
  top: 140px; left: 50%;
  transform: translateX(-50%);
  width: 105px; height: 62px;
  border-radius: 14px;
  background: linear-gradient(180deg, #0a2a3a, #041520);
  border: 2px solid var(--cyan);
  box-shadow:
    0 0 22px rgba(0,229,255,.55),
    inset 0 0 18px rgba(0,229,255,.25),
    inset 0 2px 4px rgba(0,0,0,.7);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--cyan);
  font-weight: 900;
  font-size: 23px;
  letter-spacing: 2px;
  text-shadow: 0 0 12px rgba(0,229,255,.95);
  cursor: pointer;
  transition: all .15s;
  z-index: 5;
  font-family: inherit;
}

.ptt-btn.holding {
  transform: translateX(-50%) scale(.95);
  background: linear-gradient(180deg, #00e5ff, #008fa8);
  color: #001418;
  text-shadow: none;
  box-shadow:
    0 0 45px rgba(0,229,255,1),
    0 0 90px rgba(0,229,255,.6),
    inset 0 0 22px rgba(255,255,255,.35);
}

.ptt-sub {
  position: absolute;
  top: 212px; left: 50%;
  transform: translateX(-50%);
  font-size: 8px;
  color: var(--cyan-dark);
  letter-spacing: 1.5px;
  font-weight: 700;
  white-space: nowrap;
}

.ab-indicator {
  position: absolute;
  top: 175px; right: 14px;
  font-size: 9px;
  color: #555;
  font-weight: 700;
}

/* =========================================================
   شريط التنقل السفلي
   ========================================================= */
.tab-bar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 500px;
  background: linear-gradient(180deg, rgba(11,18,24,.85), rgba(5,8,12,1));
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  padding: 8px 0 10px;
  z-index: 100;
}

.tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 6px 0;
  color: var(--text-dim);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: color .25s;
  position: relative;
  background: none;
  border: none;
  font-family: inherit;
}
.tab.active { color: var(--cyan); }
.tab.active::after {
  content: '';
  position: absolute;
  top: -8px; left: 50%;
  transform: translateX(-50%);
  width: 28px; height: 3px;
  background: var(--cyan);
  border-radius: 0 0 3px 3px;
  box-shadow: 0 0 12px var(--cyan);
}
.tab-icon { font-size: 22px; line-height: 1; }

.bottom-info {
  position: fixed;
  bottom: 68px;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 500px;
  text-align: center;
  font-size: 11px;
  color: var(--text-dim);
  padding: 8px 0;
  pointer-events: none;
  z-index: 99;
}
.bottom-info .hl { color: var(--cyan); font-weight: 700; }

/* =========================================================
   شاشة الغرفة
   ========================================================= */
.log-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 4px 14px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 14px;
  gap: 8px;
}

.log-title {
  display: flex;
  flex-direction: column;
  gap: 3px;
  text-align: right;
  flex: 1;
}
.log-title h2 {
  font-size: 17px;
  font-weight: 800;
  color: var(--cyan);
  display: flex;
  align-items: center;
  gap: 6px;
}
.log-title .sub {
  font-size: 11px;
  color: var(--text-dim);
  font-weight: 500;
}

.log-actions {
  display: flex;
  gap: 12px;
  color: var(--cyan);
  font-size: 20px;
}
.log-actions span { cursor: pointer; }

.encrypted-badge { text-align: center; margin-bottom: 16px; }

.encrypted-badge-inner {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(0,255,136,.06);
  border: 1px solid rgba(0,255,136,.2);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 11px;
  color: var(--green);
  font-weight: 600;
}
.encrypted-badge-inner::before {
  content: '';
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 8px var(--green);
  animation: dotPulse 1.5s ease-in-out infinite;
}

.room-users {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 4px 0 10px;
  margin-bottom: 10px;
  scrollbar-width: none;
}
.room-users::-webkit-scrollbar { display: none; }

.user-pill {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px;
  background: var(--card-2);
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-dim);
  flex-shrink: 0;
  white-space: nowrap;
}
.user-pill.active {
  border-color: var(--green);
  color: var(--green);
  box-shadow: 0 0 8px rgba(0,255,136,.3);
}

.user-avatar {
  width: 18px; height: 18px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--cyan), var(--cyan-dark));
  display: flex;
  align-items: center;
  justify-content: center;
  color: #001418;
  font-size: 10px;
  font-weight: 800;
}

/* شاشة الغرفة الفارغة */
.empty-room {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 20px;
  text-align: center;
  gap: 14px;
  color: var(--text-dim);
}
.empty-room-icon {
  font-size: 60px;
  opacity: .35;
  filter: drop-shadow(0 0 20px rgba(0,229,255,.3));
}
.empty-room-title {
  font-size: 16px;
  font-weight: 800;
  color: var(--cyan);
}
.empty-room-text {
  font-size: 12.5px;
  line-height: 1.7;
  max-width: 260px;
}

/* 🆕 زر إنشاء غرفة في الشاشة الفارغة */
.empty-room-btn {
  margin-top: 14px;
  padding: 14px 28px;
  background: linear-gradient(180deg, #00e5ff, #008fa8);
  border: 1px solid var(--cyan);
  border-radius: 12px;
  color: #001418;
  font-family: inherit;
  font-size: 14px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 0 20px rgba(0,229,255,.5);
  transition: all .2s;
}
.empty-room-btn:active {
  transform: scale(.95);
  box-shadow: 0 0 32px rgba(0,229,255,.8);
}

/* فقاعات الرسائل */
.msg {
  margin-bottom: 12px;
  position: relative;
  max-width: 92%;
  animation: msgSlide .35s ease;
}

@keyframes msgSlide {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.msg-in  { margin-right: 0; margin-left: auto; }
.msg-out { margin-left: 0; margin-right: auto; }

.msg-header {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  font-weight: 700;
  margin-bottom: 5px;
  padding: 0 8px;
}
.msg-in  .msg-header { color: var(--cyan); justify-content: flex-end; }
.msg-out .msg-header { color: #ff5577; }

.msg-body {
  border-radius: 14px;
  padding: 12px 14px;
  position: relative;
  border: 1px solid;
}
.msg-in .msg-body {
  background: linear-gradient(135deg, var(--blue-msg), var(--blue-msg-2));
  border-color: rgba(0,229,255,.3);
  border-top-right-radius: 4px;
}
.msg-out .msg-body {
  background: linear-gradient(135deg, var(--red-msg), var(--red-msg-2));
  border-color: rgba(255,42,77,.35);
  border-top-left-radius: 4px;
}

.voice-msg {
  display: flex;
  align-items: center;
  gap: 10px;
}

.play-btn {
  width: 42px; height: 42px;
  border-radius: 50%;
  background: rgba(0,229,255,.2);
  border: 1.5px solid var(--cyan);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--cyan);
  font-size: 16px;
  cursor: pointer;
  flex-shrink: 0;
  transition: all .2s;
  font-family: inherit;
  font-weight: 700;
}
.play-btn:active {
  background: var(--cyan);
  color: #001418;
