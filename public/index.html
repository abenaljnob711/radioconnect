  }

    width:100%;
    height:auto;
    display:block;

    border:2px solid transparent;

    line-height:1;

  .overlay.mic{
    left:39.3%;
    top:25.8%;
    width:21.4%;
    height:14.1%;
    border-radius:50%;

  }

    transform:scale(0.92);
  }
  .overlay.mic:active::after{
    content:'🔴 يتحدث';
    position:absolute;
    top:-28px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(239,68,68,.92);
    color:#fff;
    padding:4px 10px;
    border-radius:12px;
    font-size:10px;
    font-family:Tajawal,Arial,sans-serif;
    white-space:nowrap;
  }
  .overlay.toggle{
    border-radius:20px;
    background:transparent;
  }
  .overlay.toggle:active{
    background:rgba(59,155,255,.15);
    border-color:rgba(59,155,255,.3);
  }
  .overlay.chat{
    border-radius:20px;
    background:transparent;
  }
  .overlay.chat:active{
    background:rgba(59,155,255,.08);
  }
  .hint{
    position:fixed;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(18,48,90,.9);
    color:#fff;
    padding:8px 14px;
    border-radius:10px;
    font-size:11px;
    font-family:Tajawal,Arial,sans-serif;
    z-index:100;
    direction:rtl;
    text-align:center;
    max-width:90%;
    backdrop-filter:blur(10px);
    border:1px solid rgba(80,140,200,.2);
