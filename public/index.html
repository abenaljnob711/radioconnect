<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#05080c">
<title>Radio Connect - راديو كونكت</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.15.3/dist/livekit-client.umd.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#05080c;--card:#0f1921;--card-2:#142028;--border:#1c2a36;--text:#e6f0f5;--text-dim:#6b8899;--cyan:#00e5ff;--green:#00ff88;--red:#ff2a4d}
body{font-family:'Segoe UI',Tahoma,sans-serif;color:var(--text);background:var(--bg);user-select:none;overflow:hidden;height:100vh}
.app{max-width:500px;margin:0 auto;height:100vh;display:flex;flex-direction:column}
.screen{flex:1;overflow-y:auto;padding:14px 14px 170px;display:none}
.screen.active{display:block}
.top-header{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 14px}
.brand-title{font-size:19px;font-weight:800;color:var(--cyan)}
.menu-toggle{width:42px;height:42px;border-radius:11px;background:linear-gradient(180deg,var(--card-2),var(--card));border:1px solid var(--border);color:var(--cyan);font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer}
.side-menu{position:fixed;top:0;right:0;height:100vh;width:300px;background:linear-gradient(180deg,#15222e,#0a1118);border-left:1px solid rgba(0,229,255,.4);z-index:300;transform:translateX(110%);transition:transform .32s;display:flex;flex-direction:column;padding:20px 16px}
.side-menu.open{transform:translateX(0)}
.side-menu-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:299;opacity:0;pointer-events:none;transition:opacity .3s}
.side-menu-backdrop.show{opacity:1;pointer-events:auto}
.menu-item{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;color:var(--text);font-weight:700;cursor:pointer;width:100%;background:rgba(255,255,255,.02);font-family:inherit;text-align:right}
.status-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:8px}
.chip{background:linear-gradient(180deg,var(--card-2),var(--card));border:1px solid var(--border);border-radius:12px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;text-align:center}
.chip-value.code{color:var(--cyan);font-family:monospace;font-weight:900}
.radio-stage{position:relative;height:400px;display:flex;align-items:center;justify-content:center;margin:12px 0}
.radio-device{position:relative;width:230px;height:360px;filter:drop-shadow(0 25px 50px rgba(0,0,0,.9))}
.antenna{position:absolute;top:0;right:62px;width:22px;height:110px;background:linear-gradient(90deg,#050505,#2a2a2a 35%,#1a1a1a 50%,#0a0a0a);border-radius:11px 11px 4px 4px}
.antenna::before{content:'';position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:14px;height:14px;background:var(--red);border-radius:50%;box-shadow:0 0 10px var(--red);transition:all .25s}
body.ptt-active .antenna::before{background:var(--green);box-shadow:0 0 14px var(--green)}
.body-main{position:absolute;top:125px;left:0;right:0;height:235px;background:linear-gradient(180deg,#252525,#1a1a1a 10%,#0f0f0f 50%,#080808);border-radius:20px;border:1px solid #1a1a1a;overflow:hidden}
.lcd{position:absolute;top:18px;left:22px;right:22px;height:72px;background:linear-gradient(180deg,#0e2314,#0a1a0f);border:2px solid #050505;border-radius:8px;display:flex;flex-direction:column;justify-content:center;padding:8px 12px;font-family:monospace;color:var(--green);font-size:12px;font-weight:700}
.lcd-row{display:flex;justify-content:space-between}
.speaker-grill{position:absolute;bottom:16px;left:26px;right:26px;height:52px;border-radius:8px;background:repeating-linear-gradient(90deg,#040404 0,#040404 3px,#1c1c1c 3px,#1c1c1c 5px,#0a0a0a 5px,#0a0a0a 7px)}
.ptt-btn{position:absolute;top:158px;left:50%;transform:translateX(-50%);width:115px;height:68px;border-radius:16px;background:linear-gradient(180deg,#0d3344,#08202b);border:2px solid var(--cyan);box-shadow:0 0 25px rgba(0,229,255,.5);display:flex;align-items:center;justify-content:center;color:var(--cyan);font-weight:900;font-size:24px;letter-spacing:3px;cursor:pointer;z-index:5;font-family:inherit}
.ptt-btn.holding{transform:translateX(-50%) scale(.96);background:linear-gradient(180deg,#00e5ff,#00b8d4);color:#001a22;box-shadow:0 0 50px rgba(0,229,255,1)}
.ptt-sub{position:absolute;top:236px;left:50%;transform:translateX(-50%);font-size:8.5px;color:#2a6a7a;letter-spacing:2px;font-weight:700;white-space:nowrap}
.tab-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;background:linear-gradient(180deg,rgba(12,20,28,.9),rgba(5,8,12,1));border-top:1px solid var(--border);display:grid;grid-template-columns:1fr 1fr 1fr;padding:10px 0 12px;z-index:100}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;color:var(--text-dim);font-size:11px;font-weight:600;cursor:pointer;background:none;border:none;font-family:inherit}
.tab.active{color:var(--cyan)}
.bottom-info{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);width:100%;max-width:500px;text-align:center;font-size:11px;color:var(--text-dim);padding:8px 0;z-index:99}
.toast{position:fixed;top:22px;left:50%;transform:translateX(-50%) translateY(-120px);background:linear-gradient(180deg,#1a2a36,#0f1921);border:1px solid var(--cyan);color:var(--text);padding:12px 22px;border-radius:12px;font-size:13px;font-weight:600;z-index:999;transition:transform .4s;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(6px);z-index:500;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{width:100%;max-width:400px;background:linear-gradient(180deg,#1a2e3a,#0f1921);border:1px solid rgba(0,229,255,.4);border-radius:20px;padding:24px 20px}
.modal-title{font-size:18px;font-weight:800;color:var(--cyan);text-align:center;margin-bottom:16px}
.modal-field input{width:100%;padding:14px 16px;background:rgba(5,8,12,.8);border:1px solid var(--border);border-radius:12px;color:var(--text);font-family:inherit;font-size:14px;text-align:right}
.modal-field input.code-input{text-align:center;letter-spacing:4px;font-family:monospace;color:var(--cyan);font-weight:800;font-size:16px}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.modal-btn{padding:14px;border-radius:12px;border:1px solid;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
.modal-btn.cancel{background:transparent;border-color:var(--border);color:var(--text-dim)}
.modal-btn.confirm{background:linear-gradient(180deg,#00e5ff,#0097b3);border-color:var(--cyan);color:#001418}
</style>
</head>
<body>
<div class="app">
<section class="screen active" id="screen-radio">
<header class="top-header"><button class="menu-toggle" id="menuToggle">☰</button><div class="brand"><span class="brand-title">Radio Connect</span></div></header>
<div class="status-row"><div class="chip"><div class="chip-value">📶</div><div class="chip-label">الشبكة</div></div><div class="chip" id="waveNameChip"><div class="chip-value" id="waveNameLabel" style="font-size:11px">لا توجد فرقة</div><div class="chip-label">الفرقة</div></div><div class="chip"><div class="chip-value code" id="waveCodeChip">Q00000</div><div class="chip-label">رقمك</div></div></div>
<div class="status-row"><div class="chip" id="waveStatusChip"><div class="status-text" id="waveStatusText">🔴 غير متصل</div><div class="chip-label" id="waveTimer">00:00</div></div><div class="chip" id="operationsChip"><div class="chip-value" style="font-size:13px">📋 العمليات</div></div><div class="chip"><div class="chip-value" id="batteryValue">--%</div><div class="chip-label">البطارية</div></div></div>
<div class="radio-stage"><div class="radio-device"><div class="antenna"></div><div class="body-main"><div class="lcd"><div class="lcd-row"><span id="lcdLine1">CH 07 • FM</span><span id="lcdLine2">S458</span></div><div class="lcd-row"><span id="lcdLine3">Q00000 • RX</span><span>●</span></div></div><div class="speaker-grill"></div></div><button class="ptt-btn" id="pttMain">PTT</button><div class="ptt-sub">PRESS TO TALK - اضغط وتحدث</div></div></div>
</section>
<nav class="tab-bar"><button class="tab" data-tab="log" onclick="switchTab('log')">💬 الغرفة</button><button class="tab active" data-tab="radio" onclick="switchTab('radio')">📡 النداء</button><button class="tab" data-tab="settings" onclick="switchTab('settings')">⚙️ الإعدادات</button></nav>
<div class="bottom-info">إشارة: قوي • بطارية: <span id="bottomBattery">--%</span> • 🔊 مضخم 400%</div>
</div>
<div class="side-menu-backdrop" id="menuBackdrop"></div>
<aside class="side-menu" id="sideMenu"><div style="display:flex;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--border);margin-bottom:16px"><span style="color:var(--cyan);font-weight:800">⚙️ القائمة</span><button onclick="closeSideMenu()">✕</button></div><div id="sideMenuContent"></div></aside>
<div class="modal-overlay" id="modalWave"><div class="modal"><div class="modal-title">📡 إنشاء فرقة</div><div class="modal-field"><input type="text" id="waveName" placeholder="اسم الفرقة"></div><div class="modal-actions"><button class="modal-btn cancel" onclick="closeModal('modalWave')">إلغاء</button><button class="modal-btn confirm" onclick="createWave()">إنشاء</button></div></div></div>
<div class="modal-overlay" id="modalWaveCreated"><div class="modal"><div class="modal-title">✅ تم إنشاء الفرقة</div><div style="text-align:center;padding:20px;background:rgba(0,229,255,.06);border:1px dashed var(--cyan);border-radius:14px;margin:16px 0"><div id="createdWaveCode" style="font-size:30px;font-weight:900;color:var(--cyan);font-family:monospace;letter-spacing:4px">Q00000</div></div><div class="modal-actions"><button class="modal-btn cancel" onclick="copyWaveCode()">📋 نسخ</button><button class="modal-btn confirm" onclick="closeModal('modalWaveCreated')">تمام</button></div></div></div>
<div class="modal-overlay" id="modalSearch"><div class="modal"><div class="modal-title">🔍 البحث</div><div class="modal-field"><input type="text" id="searchQuery" class="code-input" placeholder="Q##### او W#####"></div><div class="modal-actions" style="grid-template-columns:1fr"><button class="modal-btn confirm" onclick="doSearch()">بحث</button></div><div id="searchResults" style="margin-top:14px"></div><div class="modal-actions" style="grid-template-columns:1fr;margin-top:14px"><button class="modal-btn cancel" onclick="closeModal('modalSearch')">إغلاق</button></div></div></div>
<div class="modal-overlay" id="modalJoinConfirm"><div class="modal"><div class="modal-title">📩 انضمام</div><div style="text-align:center;padding:14px"><div id="joinTargetName" style="font-weight:800;color:var(--cyan)"></div><div id="joinTargetCode" style="font-family:monospace"></div></div><div class="modal-actions"><button class="modal-btn cancel" onclick="closeModal('modalJoinConfirm')">إلغاء</button><button class="modal-btn confirm" onclick="confirmJoin()">انضمام</button></div></div></div>
<div class="modal-overlay" id="modalUserName"><div class="modal"><div class="modal-title">👋 ما اسمك؟</div><div class="modal-field"><input type="text" id="userNameInput" placeholder="اسمك"></div><div class="modal-actions" style="grid-template-columns:1fr"><button class="modal-btn confirm" onclick="saveUserName()">دخول</button></div></div></div>
<script>
const SERVER_URL='https://radio-connect-server.onrender.com';
const LIVEKIT_URL='wss://radioconnect-8uyh53qc.livekit.cloud';
let DEVICE_ID=localStorage.getItem('rc_device_id');if(!DEVICE_ID){DEVICE_ID='dev_'+Math.random().toString(36).slice(2)+Date.now();localStorage.setItem('rc_device_id',DEVICE_ID);}
let currentUser={id:DEVICE_ID,name:localStorage.getItem('rc_user_name')||'',radCode:'Q00000',waveId:localStorage.getItem('rc_saved_wave_id')||null,waveName:localStorage.getItem('rc_saved_wave_name')||null};
let socket=null,waveRoom=null,waveLocalAudioTrack=null,rawMicStream=null,audioContext=null,isTalking=false,timerInterval=null,timerSec=0,joinTarget=null;
function toast(m,t=''){let el=document.createElement('div');el.className='toast '+(t||'');el.textContent=m;document.body.appendChild(el);setTimeout(()=>el.classList.add('show'),10);setTimeout(()=>{el.classList.remove('show');setTimeout(()=>el.remove(),400);},3200);}
function openModal(id){document.getElementById(id).classList.add('show');}
function closeModal(id){document.getElementById(id).classList.remove('show');}
function switchTab(tab){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('screen-'+tab)?.classList.add('active');document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));}
function closeSideMenu(){document.getElementById('sideMenu').classList.remove('open');document.getElementById('menuBackdrop').classList.remove('show');document.getElementById('menuToggle').classList.remove('open');}
function openSideMenu(){renderSideMenu();document.getElementById('sideMenu').classList.add('open');document.getElementById('menuBackdrop').classList.add('show');document.getElementById('menuToggle').classList.add('open');}
document.getElementById('menuToggle').onclick=openSideMenu;document.getElementById('menuBackdrop').onclick=closeSideMenu;document.getElementById('operationsChip').onclick=openSideMenu;document.getElementById('waveNameChip').onclick=openSideMenu;
function renderSideMenu(){let c=document.getElementById('sideMenuContent');c.innerHTML=`<button class="menu-item" onclick="openModal('modalWave');closeSideMenu();">📡 إنشاء فرقة جديدة</button><button class="menu-item" onclick="openModal('modalSearch');closeSideMenu();">🔍 البحث وانضمام</button><button class="menu-item" onclick="leaveWave()">🚪 الخروج</button><div style="margin-top:16px;padding:14px;background:rgba(0,229,255,.08);border:1px dashed rgba(0,229,255,.4);border-radius:12px;text-align:center"><div style="font-size:11px;color:var(--text-dim)">رقمك</div><div style="font-size:20px;font-weight:900;color:var(--cyan);font-family:monospace">${currentUser.radCode}</div><div style="font-size:11px;color:var(--text-dim)">فرقتك: ${currentUser.waveId||'لا توجد'}</div></div>`;}
async function registerUser(){try{let r=await fetch(SERVER_URL+'/api/users/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({deviceId:currentUser.id,userName:currentUser.name||'مستخدم'})});let d=await r.json();if(d.radCode||d.code){currentUser.radCode=d.radCode||d.code;document.getElementById('waveCodeChip').textContent=currentUser.radCode;document.getElementById('lcdLine3').textContent=currentUser.radCode+' • RX';}return d;}catch(e){return null;}}
function saveUserName(){let v=document.getElementById('userNameInput').value.trim();if(!v){toast('أدخل اسمك','error');return;}currentUser.name=v;localStorage.setItem('rc_user_name',v);closeModal('modalUserName');registerUser().then(()=>{if(socket)socket.emit('register_device',{deviceId:currentUser.id,userName:v});toast('مرحبا '+v,'success');updateUI();});}
function updateUI(){if(currentUser.waveId){document.getElementById('waveNameLabel').textContent=currentUser.waveName||currentUser.waveId;document.getElementById('waveStatusText').textContent='🟢 متصل';}else{document.getElementById('waveNameLabel').textContent='لا توجد فرقة';document.getElementById('waveStatusText').textContent='🔴 غير متصل';}}
async function createWave(){let name=document.getElementById('waveName').value.trim();if(!name){toast('أدخل اسم الفرقة','error');return;}try{let res=await fetch(SERVER_URL+'/api/waves/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({deviceId:currentUser.id,waveName:name})});let data=await res.json();let waveId=data.waveId||data.id;currentUser.waveId=waveId;currentUser.waveName=name;localStorage.setItem('rc_saved_wave_id',waveId);localStorage.setItem('rc_saved_wave_name',name);document.getElementById('createdWaveCode').textContent=waveId;document.getElementById('waveName').value='';closeModal('modalWave');openModal('modalWaveCreated');updateUI();if(socket)socket.emit('wave_join',{waveId:waveId,deviceId:currentUser.id,userName:currentUser.name});toast('✅ تم إنشاء الفرقة','success');}catch(e){toast('فشل','error');}}
function copyWaveCode(){navigator.clipboard.writeText(document.getElementById('createdWaveCode').textContent);toast('تم النسخ','success');}
function leaveWave(){currentUser.waveId=null;currentUser.waveName=null;localStorage.removeItem('rc_saved_wave_id');localStorage.removeItem('rc_saved_wave_name');disconnectWaveRoom();updateUI();closeSideMenu();toast('تم الخروج','success');}
async function doSearch(){let q=document.getElementById('searchQuery').value.trim().toUpperCase();if(!q){toast('أدخل الرقم','error');return;}let box=document.getElementById('searchResults');box.innerHTML='جاري البحث...';try{let res=await fetch(SERVER_URL+'/api/users/search?code='+encodeURIComponent(q)+'&deviceId='+currentUser.id);let data=await res.json();box.innerHTML='';if(data.wave){let d=document.createElement('div');d.style.cssText='display:flex;align-items:center;gap:12px;padding:14px;background:#05080c;border:1px solid #1c2a36;border-radius:12px;margin-bottom:8px;cursor:pointer';d.innerHTML=`<div style="width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#00ff88,#00cc70);display:flex;align-items:center;justify-content:center">📡</div><div style="flex:1"><div style="font-weight:800">${data.wave.name||'فرقة'}</div><div style="font-family:monospace;color:#00ff88">${data.wave.id||data.wave.code}</div></div>`;d.onclick=()=>{joinTarget={waveId:data.wave.id||data.wave.code,name:data.wave.name};document.getElementById('joinTargetName').textContent=joinTarget.name;document.getElementById('joinTargetCode').textContent=joinTarget.waveId;openModal('modalJoinConfirm');};box.appendChild(d);}if(!data.user&&!data.wave)box.innerHTML='لم يتم العثور';}catch(e){box.innerHTML='خطأ';}}
async function confirmJoin(){closeModal('modalJoinConfirm');closeModal('modalSearch');if(joinTarget){try{let res=await fetch(SERVER_URL+'/api/waves/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({waveId:joinTarget.waveId,deviceId:currentUser.id,userName:currentUser.name})});currentUser.waveId=joinTarget.waveId;currentUser.waveName=joinTarget.name;localStorage.setItem('rc_saved_wave_id',joinTarget.waveId);localStorage.setItem('rc_saved_wave_name',joinTarget.name);updateUI();if(socket)socket.emit('wave_join',{waveId:joinTarget.waveId,deviceId:currentUser.id,userName:currentUser.name});toast('✅ انضممت','success');}catch(e){toast('تم إرسال طلب','success');}}}
async function disconnectWaveRoom(){try{if(waveLocalAudioTrack&&waveRoom){try{waveRoom.localParticipant.unpublishTrack(waveLocalAudioTrack);waveLocalAudioTrack.stop();}catch(e){}waveLocalAudioTrack=null;}if(waveRoom){await waveRoom.disconnect();waveRoom=null;}document.querySelectorAll('audio[data-lk]').forEach(el=>el.remove());}catch(e){}}
async function connectWaveChannel(){
 try{
  if(!window.LivekitClient||!currentUser.waveId) return false;
  if(waveRoom&&waveRoom.state==='connected') return true;
  let tokenRes=await fetch(SERVER_URL+'/api/livekit/token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({roomId:currentUser.waveId,deviceId:currentUser.id,userName:currentUser.name})});
  let tokenData=await tokenRes.json();if(!tokenData.token) return false;
  waveRoom=new window.LivekitClient.Room({adaptiveStream:true,dynacast:true});
  waveRoom.on(window.LivekitClient.RoomEvent.TrackSubscribed,(track,pub,participant)=>{
   if(track.kind==='audio'){
    let audioElement=track.attach();
    audioElement.setAttribute('data-lk','true');
    audioElement.volume=1.0;audioElement.muted=false;audioElement.autoplay=true;audioElement.playsInline=true;audioElement.style.display='none';
    document.body.appendChild(audioElement);
    try{let ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();let src=ctx.createMediaElementSource(audioElement);let gain=ctx.createGain();gain.gain.value=4.0;let comp=ctx.createDynamicsCompressor();comp.threshold.value=-24;comp.ratio.value=20;src.connect(gain);gain.connect(comp);comp.connect(ctx.destination);}catch(e){}
    audioElement.play().catch(()=>{document.body.addEventListener('click',()=>audioElement.play(),{once:true});});
    toast('🔊 '+participant.identity+' يتحدث','success');
   }
  });
  waveRoom.on(window.LivekitClient.RoomEvent.Disconnected,()=>{waveRoom=null;if(isTalking)stopTalking();});
  await waveRoom.connect(LIVEKIT_URL,tokenData.token);return true;
 }catch(e){waveRoom=null;return false;}
}
function startWaveTimer(){timerSec=0;clearInterval(timerInterval);timerInterval=setInterval(()=>{timerSec++;let m=String(Math.floor(timerSec/60)).padStart(2,'0');let s=String(timerSec%60).padStart(2,'0');document.getElementById('waveTimer').textContent=m+':'+s;},1000);}
function stopWaveTimer(){clearInterval(timerInterval);document.getElementById('waveTimer').textContent='00:00';}
async function onPTTStart(){
 if(isTalking) return;
 if(!currentUser.waveId){toast('أنشئ فرقة أولاً','error');openSideMenu();return;}
 isTalking=true;document.getElementById('pttMain').classList.add('holding');document.body.classList.add('ptt-active');document.getElementById('waveStatusText').textContent='🟢 يتحدث';startWaveTimer();
 try{
  rawMicStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:true,channelCount:1,sampleRate:48000}});
  let ok=await connectWaveChannel();if(!ok){toast('فشل الاتصال','error');stopTalking();return;}
  audioContext=new(window.AudioContext||window.webkitAudioContext)();if(audioContext.state==='suspended')await audioContext.resume();
  let micSource=audioContext.createMediaStreamSource(rawMicStream);let gainNode=audioContext.createGain();gainNode.gain.value=3.5;let filter=audioContext.createBiquadFilter();filter.type='highpass';filter.frequency.value=80;let comp=audioContext.createDynamicsCompressor();comp.threshold.value=-30;comp.ratio.value=12;let dest=audioContext.createMediaStreamDestination();
  micSource.connect(filter);filter.connect(gainNode);gainNode.connect(comp);comp.connect(dest);
  let boostedTrack=dest.stream.getAudioTracks()[0];
  waveLocalAudioTrack=await window.LivekitClient.createLocalAudioTrack({track:boostedTrack});
  await waveRoom.localParticipant.publishTrack(waveLocalAudioTrack,{source:window.LivekitClient.Track.Source.Microphone,dtx:false,red:true});
  if(socket)socket.emit('wave_broadcast_start',{waveId:currentUser.waveId,deviceId:currentUser.id});
 }catch(err){toast('تعذر المايك','error');stopTalking();}
}
function stopTalking(){
 if(waveLocalAudioTrack&&waveRoom){try{waveRoom.localParticipant.unpublishTrack(waveLocalAudioTrack);waveLocalAudioTrack.stop();}catch(e){}waveLocalAudioTrack=null;}
 if(rawMicStream){rawMicStream.getTracks().forEach(t=>t.stop());rawMicStream=null;}
 if(audioContext){try{audioContext.close();}catch(e){}audioContext=null;}
 isTalking=false;document.getElementById('pttMain').classList.remove('holding');document.body.classList.remove('ptt-active');document.getElementById('waveStatusText').textContent=currentUser.waveId?'🟢 متصل':'🔴 غير متصل';document.getElementById('lcdLine3').textContent=(currentUser.radCode||'--')+' • RX';stopWaveTimer();
 if(socket&&currentUser.waveId)socket.emit('wave_broadcast_stop',{waveId:currentUser.waveId,deviceId:currentUser.id});
}
const pttBtn=document.getElementById('pttMain');
pttBtn.addEventListener('pointerdown',e=>{e.preventDefault();onPTTStart();});
pttBtn.addEventListener('pointerup',e=>{e.preventDefault();stopTalking();});
pttBtn.addEventListener('touchstart',e=>{e.preventDefault();onPTTStart();},{passive:false});
pttBtn.addEventListener('touchend',e=>{e.preventDefault();stopTalking();},{passive:false});
function initSocket(){if(typeof io==='undefined')return;socket=io(SERVER_URL,{transports:['websocket','polling'],reconnection:true});socket.on('connect',()=>{socket.emit('register_device',{deviceId:currentUser.id,userName:currentUser.name});if(currentUser.waveId)socket.emit('wave_join',{waveId:currentUser.waveId,deviceId:currentUser.id,userName:currentUser.name});});}
document.addEventListener('DOMContentLoaded',async()=>{if(!currentUser.name)openModal('modalUserName');else{await registerUser();updateUI();}initSocket();});
</script>
</body>
