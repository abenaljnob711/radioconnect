<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#05080c">
<title>Radio Connect - راديو كونكت</title>
<audio id="walkieOpen" src="./walkie_open.mp3" preload="auto"></audio>
<audio id="walkieClose" src="./walkie_close.mp3" preload="auto"></audio>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.15.3/dist/livekit-client.umd.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#05080c;--card:#0f1921;--card-2:#142028;--border:#1c2a36;--text:#e6f0f5;--text-dim:#6b8899;--cyan:#00e5ff;--green:#00ff88;--red:#ff2a4d}
body{font-family:'Segoe UI',Tahoma,sans-serif;color:var(--text);background:var(--bg);user-select:none;position:relative;overflow:hidden;height:100vh}
.app{max-width:500px;margin:0 auto;height:100vh;display:flex;flex-direction:column;position:relative}
.screen{flex:1;overflow-y:auto;padding:14px 14px 160px;display:none}
.screen.active{display:block}
.top-header{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 14px}
.brand{display:flex;align-items:center;gap:8px}
.brand-icon{font-size:26px;filter:drop-shadow(0 0 8px rgba(0,229,255,.7))}
.brand-title{font-size:19px;font-weight:800;color:var(--cyan)}
.brand-sub{font-size:11px;color:var(--text-dim)}
.menu-toggle{width:42px;height:42px;border-radius:11px;background:linear-gradient(180deg,var(--card-2),var(--card));border:1px solid var(--border);color:var(--cyan);font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer}
.menu-toggle.open{background:linear-gradient(180deg,#00e5ff,#008fa8);color:#001418}
.side-menu{position:fixed;top:0;right:0;height:100vh;width:280px;background:linear-gradient(180deg,var(--card-2),var(--bg));border-left:1px solid var(--cyan);z-index:300;transform:translateX(110%);transition:transform .32s ease;display:flex;flex-direction:column;padding:20px 16px}
.side-menu.open{transform:translateX(0)}
.side-menu-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(3px);z-index:299;opacity:0;pointer-events:none;transition:opacity .3s}
.side-menu-backdrop.show{opacity:1;pointer-events:auto}
.menu-item{display:flex;align-items:center;gap:12px;padding:14px 12px;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;color:var(--text);font-weight:700;cursor:pointer;width:100%;background:linear-gradient(180deg,rgba(255,255,255,.02),transparent);font-family:inherit;text-align:right}
.status-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-bottom:8px}
.chip{background:linear-gradient(180deg,var(--card-2),var(--card));border:1px solid var(--border);border-radius:10px;padding:9px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:54px;text-align:center}
.chip-value{font-size:13px;font-weight:800;color:var(--text)}
.chip-value.code{color:var(--cyan);font-family:monospace;font-weight:900}
#waveStatusChip.live .status-text{color:var(--green)}
#waveStatusChip.disconnected .status-text{color:var(--red)}
.radio-stage{position:relative;height:360px;display:flex;align-items:center;justify-content:center;margin:8px 0 16px}
.radio-device{position:relative;width:210px;height:320px;filter:drop-shadow(0 20px 40px rgba(0,0,0,.8)) drop-shadow(0 0 30px rgba(0,229,255,.15))}
.antenna{position:absolute;top:0;right:58px;width:20px;height:95px;background:linear-gradient(90deg,#0a0a0a,#2b2b2b 40%,#0a0a0a);border-radius:10px 10px 3px 3px}
.antenna::before{content:'';position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:12px;height:12px;background:var(--red);border-radius:50%;box-shadow:0 0 8px var(--red);transition:all .25s}
body.ptt-active .antenna::before{background:var(--green);box-shadow:0 0 14px var(--green)}
.body-main{position:absolute;top:110px;left:0;right:0;height:210px;background:linear-gradient(180deg,#1e1e1e,#0a0a0a);border-radius:18px;border:2px solid #0a0a0a;overflow:hidden}
.lcd{position:absolute;top:16px;left:20px;right:20px;height:65px;background:#0a1a0f;border:2px solid #050505;border-radius:6px;display:flex;flex-direction:column;justify-content:center;padding:6px 10px;font-family:monospace;color:var(--green);font-size:12px;font-weight:700}
.lcd-row{display:flex;justify-content:space-between}
.speaker-grill{position:absolute;bottom:14px;left:24px;right:24px;height:46px;border-radius:6px;background:repeating-linear-gradient(90deg,#050505 0,#050505 3px,#1a1a1a 3px,#1a1a1a 6px)}
.ptt-btn{position:absolute;top:140px;left:50%;transform:translateX(-50%);width:105px;height:62px;border-radius:14px;background:linear-gradient(180deg,#0a2a3a,#041520);border:2px solid var(--cyan);box-shadow:0 0 22px rgba(0,229,255,.55);display:flex;align-items:center;justify-content:center;color:var(--cyan);font-weight:900;font-size:23px;letter-spacing:2px;cursor:pointer;z-index:5;font-family:inherit;transition:all .15s}
.ptt-btn.holding{transform:translateX(-50%) scale(.95);background:linear-gradient(180deg,#00e5ff,#008fa8);color:#001418;box-shadow:0 0 45px rgba(0,229,255,1)}
.ptt-sub{position:absolute;top:212px;left:50%;transform:translateX(-50%);font-size:8px;color:#008fa8;letter-spacing:1.5px;font-weight:700;white-space:nowrap}
.tab-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;background:linear-gradient(180deg,rgba(11,18,24,.85),rgba(5,8,12,1));backdrop-filter:blur(12px);border-top:1px solid var(--border);display:grid;grid-template-columns:1fr 1fr 1fr;padding:8px 0 10px;z-index:100}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--text-dim);font-size:11px;font-weight:600;cursor:pointer;background:none;border:none;font-family:inherit}
.tab.active{color:var(--cyan)}
.bottom-info{position:fixed;bottom:68px;left:50%;transform:translateX(-50%);width:100%;max-width:500px;text-align:center;font-size:11px;color:var(--text-dim);padding:8px 0;z-index:99}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:linear-gradient(180deg,var(--card-2),var(--card));border:1px solid var(--cyan);color:var(--text);padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;z-index:999;transition:transform .35s ease;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{border-color:var(--green)}
.toast.error{border-color:var(--red)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);backdrop-filter:blur(4px);z-index:500;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{width:100%;max-width:400px;background:linear-gradient(180deg,var(--card-2),var(--bg));border:1px solid var(--cyan);border-radius:18px;padding:22px 18px}
.modal-title{font-size:18px;font-weight:800;color:var(--cyan);text-align:center;margin-bottom:14px}
.modal-field input{width:100%;padding:12px 14px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;font-size:14px;text-align:right}
.modal-field input.code-input{text-align:center;letter-spacing:3px;font-family:monospace;color:var(--cyan);font-weight:800}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.modal-btn{padding:13px;border-radius:10px;border:1px solid;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
.modal-btn.cancel{background:transparent;border-color:var(--border);color:var(--text-dim)}
.modal-btn.confirm{background:linear-gradient(180deg,#00e5ff,#008fa8);border-color:var(--cyan);color:#001418}
</style>
</head>
<body>
<div class="app">
<section class="screen active" id="screen-radio">
<header class="top-header"><button class="menu-toggle" id="menuToggle">☰</button><div class="brand"><div><span class="brand-title">Radio Connect</span><div class="brand-sub">راديو كونكت</div></div><span class="brand-icon">📻</span></div></header>
<div class="status-row"><div class="chip"><div class="chip-value">📶</div><div class="chip-label">الشبكة</div></div><div class="chip" id="waveNameChip"><div class="chip-value" id="waveNameLabel" style="font-size:11px">لا توجد فرقة</div><div class="chip-label">الفرقة</div></div><div class="chip"><div class="chip-value code" id="waveCodeChip">Q00000</div><div class="chip-label">رقمك</div></div></div>
<div class="status-row"><div class="chip" id="waveStatusChip" class="disconnected"><div class="status-text" id="waveStatusText">🔴 غير متصل</div><div class="chip-label" id="waveTimer">00:00</div></div><div class="chip" id="operationsChip"><div class="chip-value" style="font-size:13px">📋 العمليات</div></div><div class="chip"><div class="chip-value" id="batteryValue">--%</div><div class="chip-label">البطارية</div></div></div>
<div class="radio-stage"><div class="radio-device"><div class="antenna"></div><div class="body-main"><div class="lcd"><div class="lcd-row"><span id="lcdLine1">CH 07</span><span id="lcdLine2">S458</span></div><div class="lcd-row"><span id="lcdLine3">Q00000 • RX</span><span>●</span></div></div><div class="speaker-grill"></div></div><button class="ptt-btn" id="pttMain">PTT</button><div class="ptt-sub">PRESS TO TALK - اضغط وتحدث</div></div></div>
</section>
<nav class="tab-bar"><button class="tab" data-tab="log" onclick="switchTab('log')"><span>💬</span><span>الغرفة</span></button><button class="tab active" data-tab="radio" onclick="switchTab('radio')"><span>📡</span><span>النداء</span></button><button class="tab" data-tab="settings" onclick="switchTab('settings')"><span>⚙️</span><span>الإعدادات</span></button></nav>
<div class="bottom-info">إشارة: قوي • بطارية: <span id="bottomBattery">--%</span></div>
</div>
<div class="side-menu-backdrop" id="menuBackdrop"></div>
<aside class="side-menu" id="sideMenu"><div style="display:flex;justify-content:space-between;padding-bottom:16px;border-bottom:1px solid var(--border);margin-bottom:16px"><span style="color:var(--cyan);font-weight:800">⚙️ القائمة</span><button onclick="closeSideMenu()" style="width:32px;height:32px;border-radius:8px;background:transparent;border:1px solid var(--border);color:var(--text-dim)">✕</button></div><div id="sideMenuContent"></div></aside>
<div class="modal-overlay" id="modalWave"><div class="modal"><div class="modal-title">📡 إنشاء فرقة</div><div class="modal-field"><input type="text" id="waveName" placeholder="اسم الفرقة مثلا: فريق العمل"></div><div class="modal-actions"><button class="modal-btn cancel" onclick="closeModal('modalWave')">إلغاء</button><button class="modal-btn confirm" onclick="createWave()">إنشاء</button></div></div></div>
<div class="modal-overlay" id="modalWaveCreated"><div class="modal"><div class="modal-title">✅ تم إنشاء الفرقة</div><div style="text-align:center;padding:18px;background:rgba(0,229,255,.05);border:1px dashed var(--cyan);border-radius:12px;margin:14px 0"><div id="createdWaveCode" style="font-size:26px;font-weight:900;color:var(--cyan);font-family:monospace;letter-spacing:3px">Q00000</div><div style="font-size:11px;color:var(--text-dim);margin-top:8px">شارك هذا الرقم مع فريقك</div></div><div class="modal-actions"><button class="modal-btn cancel" onclick="copyWaveCode()">📋 نسخ</button><button class="modal-btn confirm" onclick="closeModal('modalWaveCreated')">تمام</button></div></div></div>
<div class="modal-overlay" id="modalSearch"><div class="modal"><div class="modal-title">🔍 البحث</div><div class="modal-field"><input type="text" id="searchQuery" class="code-input" placeholder="Q##### او W#####"></div><div class="modal-actions" style="grid-template-columns:1fr"><button class="modal-btn confirm" onclick="doSearch()">🔍 بحث</button></div><div id="searchResults" style="margin-top:12px"></div><div class="modal-actions" style="grid-template-columns:1fr;margin-top:12px"><button class="modal-btn cancel" onclick="closeModal('modalSearch')">إغلاق</button></div></div></div>
<div class="modal-overlay" id="modalJoinConfirm"><div class="modal"><div class="modal-title">📩 انضمام</div><div style="text-align:center;padding:10px"><div id="joinTargetName" style="font-weight:800;color:var(--cyan)"></div><div id="joinTargetCode" style="font-family:monospace"></div></div><div class="modal-actions"><button class="modal-btn cancel" onclick="closeModal('modalJoinConfirm')">إلغاء</button><button class="modal-btn confirm" onclick="confirmJoin()">انضمام</button></div></div></div>
<div class="modal-overlay" id="modalUserName"><div class="modal"><div class="modal-title">👤 ما اسمك؟</div><div class="modal-field"><input type="text" id="userNameInput" placeholder="اسمك"></div><div class="modal-actions" style="grid-template-columns:1fr"><button class="modal-btn confirm" onclick="saveUserName()">حفظ</button></div></div></div>

<script>
const SERVER_URL = 'https://radio-connect-server.onrender.com';
const LIVEKIT_URL = 'wss://radioconnect-8uyh53qc.livekit.cloud';
let DEVICE_ID = localStorage.getItem('rc_device_id');
if(!DEVICE_ID){DEVICE_ID='dev_'+Math.random().toString(36).slice(2)+Date.now();localStorage.setItem('rc_device_id',DEVICE_ID);}
let currentUser = {id:DEVICE_ID, name:localStorage.getItem('rc_user_name')||'', radCode:'Q00000', waveId:localStorage.getItem('rc_saved_wave_id')||null, waveName:localStorage.getItem('rc_saved_wave_name')||null};
let socket=null, waveRoom=null, waveLocalAudioTrack=null, rawMicStream=null, audioContext=null, isTalking=false, timerInterval=null, timerSec=0;
let joinTarget=null;
function toast(msg,type=''){let t=document.createElement('div');t.className='toast '+(type||'');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.classList.add('show'),10);setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),400);},3000);}
function openModal(id){document.getElementById(id).classList.add('show');}
function closeModal(id){document.getElementById(id).classList.remove('show');}
function switchTab(tab){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));let el=document.getElementById('screen-'+tab);if(el)el.classList.add('active');}
function closeSideMenu(){document.getElementById('sideMenu').classList.remove('open');document.getElementById('menuBackdrop').classList.remove('show');document.getElementById('menuToggle').classList.remove('open');}
function openSideMenu(){renderSideMenu();document.getElementById('sideMenu').classList.add('open');document.getElementById('menuBackdrop').classList.add('show');document.getElementById('menuToggle').classList.add('open');}
document.getElementById('menuToggle').onclick=openSideMenu;
document.getElementById('menuBackdrop').onclick=closeSideMenu;
document.getElementById('operationsChip').onclick=openSideMenu;
document.getElementById('waveNameChip').onclick=openSideMenu;
function renderSideMenu(){
 let c=document.getElementById('sideMenuContent');
 c.innerHTML=`<button class="menu-item" onclick="openModal('modalWave');closeSideMenu();">📡 إنشاء فرقة جديدة</button>
 <button class="menu-item" onclick="openModal('modalSearch');closeSideMenu();">🔍 البحث وانضمام لفرقة</button>
 <button class="menu-item" onclick="leaveWave()">🚪 الخروج من الفرقة</button>
 <div style="margin-top:14px;padding:10px;background:rgba(0,229,255,.05);border:1px dashed var(--cyan);border-radius:10px;text-align:center">
 <div style="font-size:11px;color:var(--text-dim)">رقمك</div><div style="font-size:18px;font-weight:900;color:var(--cyan);font-family:monospace">${currentUser.radCode}</div>
 <div style="font-size:11px;color:var(--text-dim);margin-top:6px">فرقتك: ${currentUser.waveId||'لا توجد'}<br>${currentUser.waveName||''}</div></div>
 <div style="margin-top:10px;font-size:10px;color:var(--text-dim);text-align:center">💡 بعد الانضمام لنفس الفرقة<br>اضغط PTT وتحدث - الصوت يصل فوراً</div>`;
}
async function registerUser(){
 try{
  let res=await fetch(SERVER_URL+'/api/users/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({deviceId:currentUser.id,userName:currentUser.name||'مستخدم'})});
  let data=await res.json();
  if(data.radCode){currentUser.radCode=data.radCode;document.getElementById('waveCodeChip').textContent=data.radCode;document.getElementById('lcdLine3').textContent=data.radCode+' • RX';}
  return data;
 }catch(e){return null;}
}
function saveUserName(){let v=document.getElementById('userNameInput').value.trim();if(!v){toast('أدخل اسم','error');return;}currentUser.name=v;localStorage.setItem('rc_user_name',v);closeModal('modalUserName');registerUser().then(()=>{if(socket)socket.emit('register_device',{deviceId:currentUser.id,userName:v});toast('مرحبا '+v,'success');updateUI();});}
function updateUI(){
 if(currentUser.waveId){document.getElementById('waveNameLabel').textContent=currentUser.waveName||currentUser.waveId;document.getElementById('waveStatusText').textContent='🟢 متصل';document.getElementById('waveStatusChip').classList.add('live');document.getElementById('waveStatusChip').classList.remove('disconnected');}else{document.getElementById('waveNameLabel').textContent='لا توجد فرقة';document.getElementById('waveStatusText').textContent='🔴 غير متصل';document.getElementById('waveStatusChip').classList.remove('live');document.getElementById('waveStatusChip').classList.add('disconnected');}
}
async function createWave(){
 let name=document.getElementById('waveName').value.trim();if(!name){toast('أدخل اسم الفرقة','error');return;}
 try{
  let res=await fetch(SERVER_URL+'/api/waves/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({deviceId:currentUser.id,waveName:name})});
  let data=await res.json();if(!data.success && !data.waveId) throw Error(data.error||'فشل');
  let waveId=data.waveId||data.id;currentUser.waveId=waveId;currentUser.waveName=name;localStorage.setItem('rc_saved_wave_id',waveId);localStorage.setItem('rc_saved_wave_name',name);
  document.getElementById('createdWaveCode').textContent=waveId;document.getElementById('waveName').value='';closeModal('modalWave');openModal('modalWaveCreated');updateUI();
  if(socket)socket.emit('wave_join',{waveId:waveId,deviceId:currentUser.id,userName:currentUser.name});toast('✅ تم إنشاء الفرقة','success');
 }catch(e){toast('فشل: '+e.message,'error');}
}
function copyWaveCode(){navigator.clipboard.writeText(document.getElementById('createdWaveCode').textContent);toast('تم النسخ','success');}
function leaveWave(){currentUser.waveId=null;currentUser.waveName=null;localStorage.removeItem('rc_saved_wave_id');localStorage.removeItem('rc_saved_wave_name');disconnectWaveRoom();updateUI();closeSideMenu();toast('تم الخروج','success');}
async function doSearch(){
 let q=document.getElementById('searchQuery').value.trim().toUpperCase();if(!q){toast('أدخل الرقم','error');return;}
 let box=document.getElementById('searchResults');box.innerHTML='جاري البحث...';
 try{
  let res=await fetch(SERVER_URL+'/api/users/search?code='+encodeURIComponent(q)+'&deviceId='+currentUser.id);
  let data=await res.json();box.innerHTML='';
  if(data.user){
   let d=document.createElement('div');d.style.cssText='display:flex;align-items:center;gap:12px;padding:14px;background:#05080c;border:1px solid #1c2a36;border-radius:12px;margin-bottom:8px;cursor:pointer';
   d.innerHTML=`<div style="width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#00e5ff,#008fa8);display:flex;align-items:center;justify-content:center">👤</div><div style="flex:1"><div style="font-weight:800">${data.user.name||'مستخدم'}</div><div style="font-family:monospace;color:#00e5ff">${data.user.radCode||data.user.code}</div></div>`;
   box.appendChild(d);
  }
  if(data.wave){
   let d=document.createElement('div');d.style.cssText='display:flex;align-items:center;gap:12px;padding:14px;background:#05080c;border:1px solid #1c2a36;border-radius:12px;margin-bottom:8px;cursor:pointer';
   d.innerHTML=`<div style="width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#00ff88,#00cc70);display:flex;align-items:center;justify-content:center">📡</div><div style="flex:1"><div style="font-weight:800">${data.wave.name||'فرقة'}</div><div style="font-family:monospace;color:#00ff88">${data.wave.id||data.wave.code}</div></div>`;
   d.onclick=()=>{joinTarget={waveId:data.wave.id||data.wave.code,name:data.wave.name};document.getElementById('joinTargetName').textContent=joinTarget.name;document.getElementById('joinTargetCode').textContent=joinTarget.waveId;openModal('modalJoinConfirm');};
   box.appendChild(d);
  }
  if(!data.user && !data.wave) box.innerHTML='<div style="text-align:center;color:#6b8899;padding:20px">لم يتم العثور على نتائج</div>';
 }catch(e){box.innerHTML='خطأ في البحث';}
}
async function confirmJoin(){
 closeModal('modalJoinConfirm');closeModal('modalSearch');
 if(joinTarget){
  try{
   let res=await fetch(SERVER_URL+'/api/waves/join',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({waveId:joinTarget.waveId,deviceId:currentUser.id,userName:currentUser.name})});
   let data=await res.json();
   currentUser.waveId=joinTarget.waveId;currentUser.waveName=joinTarget.name;localStorage.setItem('rc_saved_wave_id',joinTarget.waveId);localStorage.setItem('rc_saved_wave_name',joinTarget.name);updateUI();if(socket)socket.emit('wave_join',{waveId:joinTarget.waveId,deviceId:currentUser.id,userName:currentUser.name});toast('✅ انضممت إلى '+joinTarget.name,'success');
  }catch(e){if(socket)socket.emit('wave_join_request',{waveId:joinTarget.waveId,fromDeviceId:currentUser.id,fromName:currentUser.name});toast('📤 تم إرسال طلب انضمام','success');}
 }
}
async function disconnectWaveRoom(){try{if(waveLocalAudioTrack&&waveRoom){try{waveRoom.localParticipant.unpublishTrack(waveLocalAudioTrack);waveLocalAudioTrack.stop();}catch(e){}waveLocalAudioTrack=null;}if(waveRoom){await waveRoom.disconnect();waveRoom=null;}document.querySelectorAll('audio[data-lk]').forEach(el=>el.remove());}catch(e){}}
async function connectWaveChannel(){
 try{
  if(!window.LivekitClient||!currentUser.waveId) return false;
  if(waveRoom&&waveRoom.state==='connected') return true;
  let tokenRes=await fetch(SERVER_URL+'/api/livekit/token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({roomId:currentUser.waveId,deviceId:currentUser.id,userName:currentUser.name})});
  let tokenData=await tokenRes.json();if(!tokenData.token) return false;
  waveRoom=new window.LivekitClient.Room({adaptiveStream:true,dynacast:true});
  waveRoom.on(window.LivekitClient.RoomEvent.TrackSubscribed,(track,pub,participant)=>{
   if(track.kind==='audio'){
    let audioElement=track.attach();
    audioElement.setAttribute('data-lk','true');
    audioElement.volume=1.0;
    audioElement.muted=false;
    audioElement.autoplay=true;
    audioElement.playsInline=true;
    audioElement.style.display='none';
    document.body.appendChild(audioElement);
    try{
      let ctx = new (window.AudioContext||window.webkitAudioContext)();
      if(ctx.state==='suspended') ctx.resume();
      let src = ctx.createMediaElementSource(audioElement);
      let gain = ctx.createGain();
      gain.gain.value = 4.0;
      let comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -24;
      comp.knee.value = 10;
      comp.ratio.value = 20;
      comp.attack.value = 0.003;
      comp.release.value = 0.25;
      src.connect(gain);
      gain.connect(comp);
      comp.connect(ctx.destination);
    }catch(e){}
    audioElement.play().then(()=>{}).catch(()=>{document.body.addEventListener('click',()=>audioElement.play(),{once:true});});
    toast('🔊 '+participant.identity+' يتحدث','success');
   }
  });
  waveRoom.on(window.LivekitClient.RoomEvent.TrackUnsubscribed,(track)=>{track.detach().forEach(el=>el.remove());});
  waveRoom.on(window.LivekitClient.RoomEvent.Disconnected,()=>{waveRoom=null;if(isTalking)stopTalking();});
  await waveRoom.connect(LIVEKIT_URL,tokenData.token);
  return true;
 }catch(e){waveRoom=null;return false;}
}
function startWaveTimer(){timerSec=0;clearInterval(timerInterval);timerInterval=setInterval(()=>{timerSec++;let m=String(Math.floor(timerSec/60)).padStart(2,'0');let s=String(timerSec%60).padStart(2,'0');document.getElementById('waveTimer').textContent=m+':'+s;},1000);}
function stopWaveTimer(){clearInterval(timerInterval);document.getElementById('waveTimer').textContent='00:00';}
async function onPTTStart(){
 if(isTalking) return;
 if(!currentUser.waveId){toast('⚠️ أنشئ فرقة أولاً ☰','error');openSideMenu();return;}
 isTalking=true;document.getElementById('pttMain').classList.add('holding');document.body.classList.add('ptt-active');document.getElementById('waveStatusText').textContent='🟢 يتحدث';document.getElementById('waveStatusChip').classList.add('live');document.getElementById('lcdLine3').textContent=(currentUser.radCode||'--')+' • TX';startWaveTimer();
 try{let ac=new (window.AudioContext||window.webkitAudioContext)();let o=ac.createOscillator();let g=ac.createGain();o.frequency.value=800;g.gain.value=0.12;o.connect(g);g.connect(ac.destination);o.start();setTimeout(()=>{o.stop();ac.close();},120);}catch(e){}
 try{
  rawMicStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:true,channelCount:1,sampleRate:48000,sampleSize:16,volume:1.0}});
  let ok=await connectWaveChannel();if(!ok){toast('فشل الاتصال بالفرقة','error');stopTalking();return;}
  audioContext = new (window.AudioContext||window.webkitAudioContext)();
  if(audioContext.state==='suspended') await audioContext.resume();
  let micSource = audioContext.createMediaStreamSource(rawMicStream);
  let gainNode = audioContext.createGain();
  gainNode.gain.value = 3.5;
  let filter = audioContext.createBiquadFilter();
  filter.type = 'highpass';
  filter.frequency.value = 80;
  let comp = audioContext.createDynamicsCompressor();
  comp.threshold.value = -30;
  comp.knee.value = 20;
  comp.ratio.value = 12;
  let dest = audioContext.createMediaStreamDestination();
  micSource.connect(filter);
  filter.connect(gainNode);
  gainNode.connect(comp);
  comp.connect(dest);
  let boostedTrack = dest.stream.getAudioTracks()[0];
  boostedTrack.enabled = true;
  waveLocalAudioTrack=await window.LivekitClient.createLocalAudioTrack({track:boostedTrack});
  await waveRoom.localParticipant.publishTrack(waveLocalAudioTrack,{source: window.LivekitClient.Track.Source.Microphone, dtx:false, red:true});
  if(socket)socket.emit('wave_broadcast_start',{waveId:currentUser.waveId,deviceId:currentUser.id});
 }catch(err){toast('تعذر تشغيل المايك: '+err.message,'error');stopTalking();}
}
function stopTalking(){
 try{let ac=new (window.AudioContext||window.webkitAudioContext)();let o=ac.createOscillator();let g=ac.createGain();o.frequency.value=400;g.gain.value=0.12;o.connect(g);g.connect(ac.destination);o.start();setTimeout(()=>{o.stop();ac.close();},120);}catch(e){}
 if(waveLocalAudioTrack&&waveRoom){try{waveRoom.localParticipant.unpublishTrack(waveLocalAudioTrack);waveLocalAudioTrack.stop();}catch(e){}waveLocalAudioTrack=null;}
 if(rawMicStream){rawMicStream.getTracks().forEach(t=>t.stop());rawMicStream=null;}
 if(audioContext){try{audioContext.close();}catch(e){}audioContext=null;}
 isTalking=false;document.getElementById('pttMain').classList.remove('holding');document.body.classList.remove('ptt-active');document.getElementById('waveStatusText').textContent=currentUser.waveId?'🟢 متصل':'🔴 غير متصل';document.getElementById('waveStatusChip').classList.remove('live');document.getElementById('lcdLine3').textContent=(currentUser.radCode||'--')+' • RX';stopWaveTimer();
 if(socket&&currentUser.waveId)socket.emit('wave_broadcast_stop',{waveId:currentUser.waveId,deviceId:currentUser.id});
}
const pttBtn=document.getElementById('pttMain');
pttBtn.addEventListener('pointerdown',e=>{e.preventDefault();onPTTStart();});
pttBtn.addEventListener('pointerup',e=>{e.preventDefault();stopTalking();});
pttBtn.addEventListener('pointercancel',e=>{e.preventDefault();stopTalking();});
pttBtn.addEventListener('touchstart',e=>{e.preventDefault();onPTTStart();},{passive:false});
pttBtn.addEventListener('touchend',e=>{e.preventDefault();stopTalking();},{passive:false});
function initSocket(){
 if(typeof io==='undefined') return;
 socket=io(SERVER_URL,{transports:['websocket','polling'],reconnection:true});
 socket.on('connect',()=>{socket.emit('register_device',{deviceId:currentUser.id,userName:currentUser.name});if(currentUser.waveId)socket.emit('wave_join',{waveId:currentUser.waveId,deviceId:currentUser.id,userName:currentUser.name});});
}
document.addEventListener('DOMContentLoaded',async()=>{
 if(!currentUser.name) openModal('modalUserName'); else {await registerUser();updateUI();}
 initSocket();
 try{if(navigator.getBattery){let b=await navigator.getBattery();let update=()=>{let p=Math.round(b.level*100);document.getElementById('batteryValue').textContent=p+'%';document.getElementById('bottomBattery').textContent=p+'%';};update();b.addEventListener('levelchange',update);}}catch(e){}
});
</script>
