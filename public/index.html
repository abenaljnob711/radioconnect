<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#02050e">
<title>Radio Connect - جهاز لاسلكي - الصورة الأصلية</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{min-height:100%;background:#02050e;color:#eaf2ff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial,sans-serif;direction:rtl}
.app{max-width:520px;min-height:100vh;margin:0 auto;position:relative;background:#02050e;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.6)}
.main-image{width:100%;display:block;object-fit:contain}
.hotspot{position:absolute;background:rgba(0,0,0,0);cursor:pointer;-webkit-tap-highlight-color:rgba(52,152,219,.2)}
.hotspot:active{background:rgba(52,152,219,.15)}
.ptt-hotspot{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:32%;aspect-ratio:1;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;z-index:5}
.ptt-hotspot.talking{box-shadow:0 0 0 8px rgba(231,76,60,.25),0 0 30px rgba(231,76,60,.6);background:rgba(231,76,60,.15)}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#0a1e36;color:#fff;border:1px solid rgba(255,255,255,.1);padding:10px 18px;border-radius:20px;font-size:12px;z-index:100;opacity:0;pointer-events:none;transition:.3s;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* === التعديل الجديد: شاشة الجهاز اللاسلكي في الوسط === */
.radio-screen{
  position:absolute;left:50%;top:37.2%;transform:translate(-50%,-50%);
  width:12.5%;height:4.2%;background:linear-gradient(180deg,#0a2a0a,#061a06);
  border:1px solid rgba(0,255,0,.15);border-radius:2px;display:flex;
  align-items:center;justify-content:center;font-family:monospace;
  font-weight:900;font-size:10px;color:#39ff14;letter-spacing:1px;
  text-shadow:0 0 6px #39ff14,0 0 12px rgba(57,255,20,.5);
  box-shadow:inset 0 0 8px rgba(0,255,0,.2),0 0 10px rgba(0,255,0,.15);
  z-index:6;pointer-events:none;
}
.radio-glow{
  position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);
  width:34%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(231,76,60,.25),transparent 70%);
  opacity:0;transition:.2s;z-index:4;pointer-events:none;
}
.radio-glow.active{opacity:1}
.wave-display{
  position:absolute;top:15.2%;left:50%;transform:translateX(-50%);
  background:rgba(7,26,46,.9);border:1px solid rgba(52,152,219,.25);
  color:#49aaff;font-family:monospace;font-weight:800;font-size:14px;
  letter-spacing:2px;padding:4px 12px;border-radius:12px;z-index:6;pointer-events:none;
}
</style>
</head>
<body>
<div class="app" id="app">
  <img src="photo5632381770554479545.jpeg" alt="Radio Connect" class="main-image">
  <!-- الشاشة الديناميكية على جهاز اللاسلكي -->
  <div class="radio-screen" id="radioScreen">7F3A</div>
  <div class="radio-glow" id="radioGlow"></div>
  <div class="wave-display" id="waveDisplay">7F3A</div>

  <div class="hotspot" style="top:2.5%;left:2%;width:12%;height:5%" onclick="toast('☰ القائمة')"></div>
  <div class="hotspot" style="top:2.8%;right:17%;width:22%;height:4.5%" onclick="toast('متصل ✅')"></div>
  <div class="hotspot" style="top:2.2%;right:2%;width:12%;height:5.5%" onclick="toast('حالة الخادم')"></div>
  <div class="hotspot" style="top:13.5%;left:3%;width:32%;height:9%" onclick="changeRoom()"></div>
  <div class="hotspot" style="top:12%;left:37%;width:26%;height:10%" onclick="toast('الموجة: '+currentWave.code)"></div>
  <div class="hotspot" style="top:14%;left:38%;width:7%;height:5%" onclick="changeWave(-1)"></div>
  <div class="hotspot" style="top:14%;left:56%;width:7%;height:5%" onclick="changeWave(1)"></div>
  <div class="hotspot" style="top:12.5%;right:3%;width:31%;height:9.5%" onclick="toast('البطارية 81% - 4G')"></div>
  <div class="hotspot" style="top:27.5%;left:4%;width:31%;height:5.5%" onclick="toast('الصوت الطبيعي: مفعل')"></div>
  <div class="hotspot" style="top:27.5%;right:4%;width:31%;height:5.5%" onclick="toast('الصوت اللاسلكي: متوقف')"></div>
  <div class="ptt-hotspot" id="pttBtn"></div>
  <div class="hotspot" style="top:35%;left:25%;width:50%;height:20%;border-radius:50%" onpointerdown="startTalk(event)" onpointerup="stopTalk(event)" onpointerleave="stopTalk(event)" onpointercancel="stopTalk(event)"></div>
  <div class="hotspot" style="top:52%;left:0;width:100%;height:32%" onclick="openChat()"></div>
  <div class="hotspot" style="top:62%;left:35%;width:15%;height:6%" onclick="toast('📷 صورة')"></div>
  <div class="hotspot" style="top:62%;left:54%;width:15%;height:6%" onclick="toast('🎥 فيديو')"></div>
  <div class="hotspot" style="top:69%;left:35%;width:15%;height:6%" onclick="toast('👥 جهات الاتصال')"></div>
  <div class="hotspot" style="top:69%;left:54%;width:15%;height:6%" onclick="toast('📄 مستند')"></div>
  <div class="hotspot" style="top:76%;left:35%;width:15%;height:6%" onclick="toast('🎵 صوت')"></div>
  <div class="hotspot" style="top:76%;left:54%;width:15%;height:6%" onclick="toast('👥 أعضاء الغرفة')"></div>
  <div class="hotspot" style="top:86.5%;left:14%;width:58%;height:4.5%" onclick="openChat()"></div>
  <div class="hotspot" style="top:92.5%;left:2%;width:22%;height:6%" onclick="toast('الرئيسية')"></div>
  <div class="hotspot" style="top:92.5%;left:27%;width:22%;height:6%" onclick="toast('المفضلة')"></div>
  <div class="hotspot" style="top:92.5%;left:51%;width:22%;height:6%" onclick="toast('الموجات')"></div>
  <div class="hotspot" style="top:92.5%;right:2%;width:22%;height:6%" onclick="toast('حسابي')"></div>
</div>
<div id="toast" class="toast"></div>
<div id="chatModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:90;align-items:flex-end;justify-content:center">
  <div style="width:min(520px,100%);background:#050f1f;border-radius:20px 20px 0 0;padding:16px">
    <div style="display:flex;justify-content:space-between;margin-bottom:12px"><strong>💬 <span id="chatRoomName">العمليات</span></strong><button onclick="closeChat()" style="background:#09182b;color:#fff;width:30px;height:30px;border-radius:8px;border:0">×</button></div>
    <div style="display:flex;gap:6px;background:#040a14;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:6px"><input id="chatInput" placeholder="اكتب..." style="flex:1;background:transparent;border:0;color:#fff;outline:none;padding:6px"><button onclick="sendMsg()" style="background:#1a6194;color:#fff;border:0;border-radius:8px;padding:8px 14px">➤</button></div>
  </div>
</div>
<script>
const waves=[
  {code:"7F3A",name:"العمليات"},
  {code:"68B665",name:"غرفة القيادة"},
  {code:"9K21",name:"الطوارئ"},
  {code:"4M88",name:"المساندة"},
  {code:"6P17",name:"القيادة"}
];
let waveIndex=0;let currentWave=waves[0];
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.remove('show'),2500)}
function changeWave(dir){
  waveIndex+=dir;if(waveIndex<0)waveIndex=waves.length-1;if(waveIndex>=waves.length)waveIndex=0;
  currentWave=waves[waveIndex];
  document.getElementById('radioScreen').textContent=currentWave.code;
  document.getElementById('waveDisplay').textContent=currentWave.code;
  document.getElementById('chatRoomName').textContent=currentWave.name;
  const rs=document.getElementById('radioScreen');
  rs.style.boxShadow='inset 0 0 12px rgba(0,255,0,.4),0 0 20px rgba(57,255,20,.6)';
  setTimeout(()=>{rs.style.boxShadow='inset 0 0 8px rgba(0,255,0,.2),0 0 10px rgba(0,255,0,.15)';},300);
  toast('📡 '+currentWave.code+' - '+currentWave.name+' | 📻 شاشة اللاسلكي: '+currentWave.code);
}
function changeRoom(){changeWave(1)}
let talking=false;
function startTalk(e){e.preventDefault();if(talking)return;talking=true;document.getElementById('pttBtn').classList.add('talking');document.getElementById('radioGlow').classList.add('active');document.getElementById('radioScreen').style.color='#ff4444';toast('🔴 تتحدث على '+currentWave.code)}
function stopTalk(e){if(e)e.preventDefault();if(!talking)return;talking=false;document.getElementById('pttBtn').classList.remove('talking');document.getElementById('radioGlow').classList.remove('active');document.getElementById('radioScreen').style.color='#39ff14';toast('✅ تم الإرسال على '+currentWave.code)}
function openChat(){document.getElementById('chatModal').style.display='flex'}
function closeChat(){document.getElementById('chatModal').style.display='none'}
function sendMsg(){const i=document.getElementById('chatInput');if(!i.value.trim())return;toast('تم الإرسال على '+currentWave.code+': '+i.value);i.value='';closeChat()}
</script>
</body>
</html>
