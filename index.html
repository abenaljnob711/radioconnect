
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<title>اتصال لاسلكي</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f172a;color:#fff;font-family:system-ui;display:flex;flex-direction:column;align-items:center;padding:20px}

</style>
</head>
<body>
<div style="font-size:60px">📡</div>
<h1>اتصال لاسلكي</h1>
<div class="card">
<div id="status">جاهز للاتصال</div>
<button class="btn" onclick="document.getElementById('status').innerHTML='جاري البحث... 📡<br>تم العثور على جهاز ✅'">🔍 البحث عن أجهزة</button>
</div>
</body>
</html>
